<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Фавиконка «Инварианта»: зигзаг дверной виньетки титула без плашки,
       круче обычного — чтобы созвездие заполняло квадрат иконки. Цвета
       узлов — палитра областей карты физики (lib/areas.ts): кинематика,
       динамика, колебания, тяготение; рёбра подстраиваются под тему
       вкладки медиазапросом. Тот же знак — у вывески «Инвариант» в шапке
       (Base.astro) и в LMS (BrandMark.vue). -->
  <style>
    line { stroke: #4a5468; stroke-width: 3.2; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) {
      line { stroke: rgba(236, 238, 246, 0.65); }
    }
  </style>
  <line x1="9" y1="49" x2="27" y2="20"/>
  <line x1="27" y1="20" x2="43" y2="44"/>
  <line x1="43" y1="44" x2="57" y2="15"/>
  <circle cx="9" cy="49" r="6" fill="#4fc3f7"/>
  <circle cx="27" cy="20" r="8.5" fill="#ffb454"/>
  <circle cx="43" cy="44" r="6" fill="#4dd0c4"/>
  <circle cx="57" cy="15" r="6.5" fill="#9575cd"/>
</svg>
