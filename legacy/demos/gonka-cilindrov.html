'use strict';
var C = window.DemoCore, html = C.html;
var useState = React.useState, useRef = React.useRef;

/* ══════════════════ физика ══════════════════

   Блоки главы teorema-gyujgensa-shtejnera и shar-i-disk (бриф
   briefs/demki_nedelya06.md, № 8). Демка держит обещание четвёртой недели
   из teorema-kyoniga: где кончается приближение обода и как считать колесо
   со спицами. Шесть тел одной массы m = 1 кг и одного радиуса R = 5 см
   скатываются по одному склону, каждое в своей дорожке: обруч, тонкая
   сфера, диск, шар, колесо со спицами и брусок без трения как предел
   k → 0. Масса и радиус из времени выпадают, и это видно: в модель они
   входят только через k = I/(mR²). В коде и в __demoState коэффициент
   зовётся k, как в брифе; на экране он β, как в главе (раздел «Досчитаем
   колесо со спицами» блока teorema-gyujgensa-shtejnera).

   ЧТО СЧИТАЕТСЯ. Каждое тело интегрируется само, по двум уравнениям, а не
   по формуле ответа. Состояние: путь центра s, скорость центра v вдоль
   склона, угол поворота φ и угловая скорость ω (по ходу качения). Силы:
   тяжесть m g sinθ вдоль склона, реакция N = m g cosθ и сила трения F у
   точки касания, направленная вверх по склону. Движение центра масс и
   вращение вокруг него:
       m dv/dt = m g sinθ − F,      I dω/dt = F R,      I = k m R².
   Скорость точки касания относительно склона u = v − ωR, вниз по склону.
   Закон трения двухрежимный, одно μ и на покой, и на скольжение.
     Сцепление, u = 0. Чтобы u оставалось нулём, из двух уравнений и
     v = ωR нужна сила F = k m g sinθ/(1 + k). Пока она не больше μN, тело
     катится: a = g sinθ/(1 + k). Порог μ ≥ k tgθ/(1 + k) то же самое, что
     θ ≤ arctg(μ(1 + k)/k).
     Скольжение. Если нужная сила больше μN, работает трение скольжения
     F = μN·sign(u) (при срыве, u = 0, знак плюс: вверх по склону):
     a = g(sinθ − μ cosθ), и от k оно не зависит, поэтому все
     проскальзывающие тела идут вровень. ω растёт по I dω/dt = μN R, и u
     убывает, если μ выше порога, а иначе растёт до самого финиша.
   Брусок: F = 0, a = g sinθ, предел k → 0.

   СХЕМА. Шаг 1 мс. На шаге θ и μ заданы, ускорения постоянны, и обновление
   s += v h + a h²/2, v += a h, φ += ω h + α h²/2 точно (скоростной Верле на
   куске с постоянной силой). Шаг режется там, где меняется закон: u дошла
   до нуля у проскальзывающего тела (тогда решается, хватает ли трения
   покоя; если да, ω := v/R и тело катится) и центр дошёл до финиша (время
   и скорость финиша берутся из корня уравнения пути на этом куске, а не по
   первому кадру за линией). В сцеплении ω снимается со связи v = ωR, чтобы
   округление не копило u.

   СОХРАНЯЕТСЯ. Энергия с теплом: ½ m v² + ½ I ω² − m g s sinθ + Q = 0, где
   Q = ∫ μN |u| dt набирается на проскальзывании. Работа силы трения
   считается как F u: в сцеплении u = 0 тождественно, и работа трения покоя
   в модели ноль, а не «мала». В показаниях это balanceError и
   bodies[].balance; frictionWork = −Q.

   ЭНЕРГИИ ГЛАВЫ. Колесо 1 кг на 5 м/с: обод (k = 1) 25,00 Дж, диск
   (k = 1/2) 18,75 Дж, колесо с долей s массы в спицах-стержнях от центра
   до обода, I = (1 − s) m R² + s m R²/3 (момент стержня на конце ml²/3 из
   teorema-gyujgensa-shtejnera; при s = 0,2 k = 13/15), 23,33 Дж; приближение
   обода завышает на (25 − 23,33)/23,33 = 7,1 %. Эти числа демка не
   подставляет: каждое тело прогоняется тем же интегратором из покоя до
   v = 5 м/с с трением, которого хватает всегда (μ = 10⁹), и энергия
   снимается с состояния, ½ m v² + ½ I ω². Они не зависят от ползунков угла
   и μ, только от доли спиц: это энергия качения, а не гонки.

   ЗАПУСК И ТЕМП. Страница сразу пускает гонку; «Старт» и любой ползунок
   ставят тела на старт и пускают её заново, так что числа на экране всегда
   относятся к гонке при показанных параметрах. Настоящая гонка длится
   0,64–0,90 с, залу это не видно, поэтому показ замедлен в четыре раза
   (кнопки ×1, ×½, ×¼). Темп умножает кадр: __demoTick(dt, n) двигает
   модель на n·dt·темп секунд, а числа и результаты от темпа не зависят.

   ЧИСЛА. g = 9,81, склон 30°, дорожка 1 м, μ = 0,30, доля в спицах 0,2:
   ускорения 2,453 (обруч), 2,943, 3,270, 3,504, 2,628 (колесо), 4,905
   (брусок) м/с²; пороги μ мин 0,289, 0,231, 0,192, 0,165, 0,268, 0; времена
   0,903, 0,824, 0,782, 0,756, 0,872, 0,639 с; предельные углы при μ = 0,30
   31,0°, 36,9°, 42,0°, 46,4°, 32,9°. При 40° и μ = 0,30 обруч, тонкая
   сфера и колесо проскальзывают и приходят вместе за 0,703 с с
   ускорением 4,051 м/с², диск (0,690 с) и шар (0,666 с) катятся.

   ЗАМЕР 04.10 (прогоны hcheck через __demoProgon и ползунки; сверка
   скриптами scipy вне демки). Сетка 7 углов (5…60°) × 8 значений μ (0…1) ×
   4 доли спиц (0…1) × 6 тел × 3 длины кадра (1/240, 1/60 и 0,05 с), 4032
   прогона тел, mgh на дорожке от 0,85 до 8,5 Дж. Баланс энергии на финише
   не больше 5·10⁻¹⁴ Дж, а при ползунках через DOM, кадре 0,05 с и шаге
   1 мс не больше 1,4·10⁻¹³ Дж. Время и скорость финиша от длины кадра не
   зависят до 1,1·10⁻¹⁴. Время финиша против √(2L/a) с ускорением своего
   режима: 4,4·10⁻¹⁵ относительно. Масса и радиус (7 кг и 20 см; 0,1 кг и
   1 см; 1000 кг и 3 м): время и скорость финиша те же побитово, тепло на
   килограмм до 1,3·10⁻¹⁵. Порог: бисекция по μ динамической модели
   совпала с k tgθ/(1 + k) до 10⁻¹² (допуск сравнения) при 20°, 30°, 45° и
   60°. DOP853 с событиями (40 случайных наборов параметров × 6 тел):
   время до 4,4·10⁻¹⁵ с, скорость 7·10⁻¹⁵, ω 9·10⁻¹⁴, тепло 7·10⁻¹⁵, режимы
   те же. Radau с регуляризованным трением μN·th(u/ε), без логики режимов
   (120 прогонов тел): время до 1·10⁻⁸ с, ω 9·10⁻⁷, тепло 6·10⁻⁸ Дж; порог
   этой моделью найден бисекцией с разницей до 10⁻⁴ (критерий тепла 1 мДж).
   Отчёт briefs/demki_nedelya06_gonka-cilindrov_REPORT.md. */

var G = 9.81;                      /* м/с² */
var R = 0.05;                      /* радиус всех тел, м */
var M = 1;                         /* масса, кг: выпадает из времён, нужна энергиям в Дж */
var DL = 1;                        /* путь центра масс от старта до финиша, м */
var V5 = 5;                        /* скорость центра для энергий главы, м/с */
var H_SUB = 0.001;                 /* шаг интегрирования, с */
var MU_INF = 1e9;                  /* «трения хватает всегда»: для энергий при качении */
var TH_MIN = 5, TH_MAX = 60, TH_NACH = 30;     /* градусы */
var MU_MAX = 1, MU_NACH = 0.3;
var SP_NACH = 0.2;                 /* доля массы колеса в спицах */
var TEMP_NACH = 0.25;              /* показ замедлен: гонка 0,64–0,90 с слишком быстра для зала */
var TWO_PI = 2 * Math.PI;

/* Тела. k = I/(mR²). Для колеса k считается от доли спиц. */
var TELA = [
  { id: 'obruch', name: 'обруч', k: 1, col: '#4db6c6' },
  { id: 'sfera', name: 'тонкая сфера', k: 2 / 3, col: '#7aa6ff' },
  { id: 'disk', name: 'диск', k: 1 / 2, col: '#b48cf0' },
  { id: 'shar', name: 'шар', k: 2 / 5, col: '#e0b050' },
  { id: 'koleso', name: 'колесо со спицами', k: null, col: '#e08a52' },
  { id: 'brusok', name: 'брусок', k: 0, col: '#8c93ac', free: true }
];
var I_OBRUCH = 0, I_DISK = 2, I_SHAR = 3, I_KOLESO = 4;

/* Обод массой (1 − s)m на радиусе R и спицы-стержни общей массой s m от
   центра до обода: I = (1 − s) m R² + s m R²/3. */
function kKolesa(sp) { return (1 - sp) + sp / 3; }
function kTela(i, sp) { return TELA[i].k === null ? kKolesa(sp) : TELA[i].k; }

function parametry(thetaDeg, mu, sp) {
  return { thetaDeg: thetaDeg, theta: thetaDeg * Math.PI / 180, mu: mu, spoke: sp };
}

function novoeTelo(i, p) {
  var b = { i: i, k: kTela(i, p.spoke), free: !!TELA[i].free,
            s: 0, v: 0, w: 0, phi: 0, Q: 0, t: 0, mode: 'roll',
            done: false, tFin: null, vFin: null, wFin: null, QFin: null, modeFin: null };
  if (b.free) b.mode = 'free';
  else if (trebuetsya(b, p) > p.mu * M * G * Math.cos(p.theta) * (1 + 1e-12)) b.mode = 'slip';
  return b;
}

/* Сила трения, которая нужна, чтобы u оставалось нулём. */
function trebuetsya(b, p) { return b.k * M * G * Math.sin(p.theta) / (1 + b.k); }

/* Закон трения: по состоянию и режиму даёт режим, силу F, ускорения. Тело
   не меняет: режим меняет только dvigat. */
function zakon(b, p) {
  var sn = Math.sin(p.theta), N = M * G * Math.cos(p.theta), Fmax = p.mu * N;
  if (b.free) return { mode: 'free', F: 0, a: G * sn, al: 0 };
  var Ftr = trebuetsya(b, p);
  if (b.mode === 'roll' && Ftr <= Fmax * (1 + 1e-12))
    return { mode: 'roll', F: Ftr, a: G * sn / (1 + b.k), al: G * sn / (1 + b.k) / R };
  /* скольжение; сюда же попадает срыв, когда трения покоя не хватило */
  var u = b.v - b.w * R;
  var F = Fmax * (u < 0 ? -1 : 1);           /* u = 0 в срыве: нужна сила вверх по склону */
  return { mode: 'slip', F: F, a: G * sn - F / M, al: F * R / (b.k * M * R * R) };
}

/* Кусок движения длиной tau при постоянных ускорениях. */
function dvizhenie(b, f, tau) {
  var u0 = b.v - b.w * R;
  b.s += b.v * tau + f.a * tau * tau / 2;
  b.phi += b.w * tau + f.al * tau * tau / 2;
  b.v += f.a * tau;
  if (f.mode === 'roll') b.w = b.v / R;      /* связь держит ω = v/R без накопления округления */
  else b.w += f.al * tau;
  if (f.mode === 'slip') {
    var u1 = b.v - b.w * R;
    b.Q += Math.abs(f.F) * Math.abs(u0 + u1) / 2 * tau;   /* u линейна на куске и знака не меняет */
  }
  b.t += tau;
}

/* Один шаг h тела b с разрезом на события. stop: { s } финиш по пути или
   { v } остановка по скорости. */
function dvigat(b, h, p, stop) {
  for (var n = 0; h > 1e-15 && !b.done && n < 8; n++) {
    var f = zakon(b, p);
    b.mode = f.mode;
    var tau = h, ev = null;
    if (f.a > 1e-12) {
      if (stop.s !== undefined) {
        var d = stop.s - b.s;
        var tf = d <= 0 ? 0 : 2 * d / (b.v + Math.sqrt(b.v * b.v + 2 * f.a * d));
        if (tf <= tau) { tau = tf; ev = 'fin'; }
      }
      if (stop.v !== undefined) {
        var tv = Math.max(0, (stop.v - b.v) / f.a);
        if (tv <= tau) { tau = tv; ev = 'fin'; }
      }
    }
    if (f.mode === 'slip') {
      var u = b.v - b.w * R, du = f.a - f.al * R;
      if (u * du < 0) {
        var tu = -u / du;
        if (tu < tau) { tau = tu; ev = 'stick'; }
      }
    }
    dvizhenie(b, f, tau);
    h -= tau;
    if (ev === 'fin') {
      if (stop.s !== undefined) b.s = stop.s;
      if (stop.v !== undefined) b.v = stop.v;
      b.done = true;
      b.tFin = b.t; b.vFin = b.v; b.wFin = b.w; b.QFin = b.Q; b.modeFin = b.mode;
    } else if (ev === 'stick') {
      b.w = b.v / R;                         /* u = 0 ровно */
      b.mode = trebuetsya(b, p) <= p.mu * M * G * Math.cos(p.theta) * (1 + 1e-12) ? 'roll' : 'slip';
    }
  }
}

var STOP_GONKA = { s: DL };

/* Энергия с теплом: должна быть нулём. Кинетическая плюс потенциальная
   (от старта) плюс выделившееся тепло. */
function balans(b, p) {
  return 0.5 * M * b.v * b.v + 0.5 * b.k * M * R * R * b.w * b.w - M * G * b.s * Math.sin(p.theta) + b.Q;
}

/* Энергия тела 1 кг при v = 5 м/с при качении: прогон каждого тела из покоя
   тем же интегратором, но с трением, которого хватает всегда. */
function energii5(sp, thetaDeg) {
  var p = parametry(thetaDeg, MU_INF, sp), r = { K: [], Kt: [], Kr: [], s: [], t: [] };
  for (var i = 0; i < TELA.length; i++) {
    var b = novoeTelo(i, p);
    for (var j = 0; j < 1e6 && !b.done; j++) dvigat(b, H_SUB, p, { v: V5 });
    var Kt = 0.5 * M * b.v * b.v, Kr = 0.5 * b.k * M * R * R * b.w * b.w;
    r.Kt.push(Kt); r.Kr.push(Kr); r.K.push(Kt + Kr); r.s.push(b.s); r.t.push(b.t);
  }
  r.rim = r.K[I_OBRUCH]; r.wheel = r.K[I_KOLESO]; r.disk = r.K[I_DISK];
  r.over = (r.rim - r.wheel) / r.wheel;
  return r;
}

/* Прогон без анимации для проверки: гонка при заданных углу, μ, доле
   спиц и длине кадра h. */
function progon(opt) {
  opt = opt || {};
  var p = parametry(opt.thetaDeg != null ? opt.thetaDeg : TH_NACH,
                    opt.mu != null ? opt.mu : MU_NACH,
                    opt.spoke != null ? opt.spoke : SP_NACH);
  var h = opt.h || 1 / 60;
  var tela = TELA.map(function (d, i) { return novoeTelo(i, p); });
  for (var g = 0; g < 1e6 && tela.some(function (b) { return !b.done; }); g++)
    tela.forEach(function (b) { dvigat(b, h, p, STOP_GONKA); });
  return tela.map(function (b, i) {
    return { name: TELA[i].name, k: b.k, tFin: b.tFin, vFin: b.vFin, wFin: b.wFin, mode: b.modeFin,
             Q: b.QFin, balance: balans(b, p), muMin: b.k / (1 + b.k) * Math.tan(p.theta) };
  });
}

/* Русская запятая и настоящий минус; крохи печатаются нулём. */
function num(v, d) {
  v = +v.toPrecision(12);
  if (Math.abs(v) < 0.5 * Math.pow(10, -d)) v = 0;
  return v.toFixed(d).replace('.', ',').replace('-', '−');
}
function kx(tex) {
  try { return katex.renderToString(tex, { throwOnError: false }); }
  catch (e) { return tex; }
}

/* ══════════════════ сцена ══════════════════

   Склон развёрнут вдоль дорожек: шесть дорожек стоят друг под другом, как
   шесть копий вида сбоку, и тела идут слева направо вниз по склону. Угол
   склона виден на значке внизу слева, а не в наклоне дорожек: иначе шести
   дорожкам не хватило бы высоты. Слева у каждой дорожки имя тела и k,
   справа ускорение, порог трения покоя, время финиша и режим (катится или
   проскальзывает). Красная стрелка у точки касания показывает скорость
   u = v − ωR точки касания относительно склона: при качении её нет. Внизу
   энергии колеса 1 кг на 5 м/с при качении.

   Кегль подписей на канве 17 и больше, числа моноширинные. */

var W = 1000, HGT = 440;
var Y0 = 40, RH = 49;              /* верх первой дорожки и высота дорожки, px */
var SC = 440;                      /* пикселей на метр пути */
var XS = 168, XF = XS + DL * SC;   /* x центра тела на старте и на финише */
var RP = R * SC;                   /* радиус тела на экране: 22 px */
var XA = 700, XMU = 764, XT = 842, XR = 858;   /* колонки справа: правые края чисел, левый край режима */
var CLR_KATIT = '#a6c35a', CLR_SKOL = '#ff7a66';
var MONO = '"JetBrains Mono", ui-monospace, monospace';
var SPITSY = 6;

function chislo(ctx, x, y, text, color, align) {
  ctx.fillStyle = color; ctx.textAlign = align || 'right';
  ctx.font = '600 17px ' + MONO;
  ctx.fillText(text, x, y);
}

function strelka(ctx, x0, y0, x1, y1, color, width) {
  var dx = x1 - x0, dy = y1 - y0, Ln = Math.hypot(dx, dy);
  if (Ln < 1) return;
  var ux = dx / Ln, uy = dy / Ln;
  var head = Math.min(10, Ln * 0.5);
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x0, y0); ctx.lineTo(x1 - ux * head * 0.72, y1 - uy * head * 0.72);
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x1 - ux * head - uy * head * 0.4, y1 - uy * head + ux * head * 0.4);
  ctx.lineTo(x1 - ux * head * 0.72, y1 - uy * head * 0.72);
  ctx.lineTo(x1 - ux * head + uy * head * 0.4, y1 - uy * head - ux * head * 0.4);
  ctx.closePath(); ctx.fill();
}

function rgba(hex, a) {
  var n = parseInt(hex.slice(1), 16);
  return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')';
}

/* Метка поворота: точка у обода и тонкий радиус к ней. */
function metka(ctx, r, ink, radius) {
  if (radius) {
    ctx.strokeStyle = 'rgba(' + ink + ',.55)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -r); ctx.stroke();
  }
  ctx.fillStyle = 'rgb(' + ink + ')';
  ctx.beginPath(); ctx.arc(0, -r, 3.6, 0, TWO_PI); ctx.fill();
}

/* Тело в точке (x, yc) на дорожке: вид сбоку, повёрнуто на φ. Толщина обода
   колеса и ширина спиц на рисунке пропорциональны массе обода и массе спиц. */
function risuyTelo(ctx, i, b, x, yc, ink, sp) {
  var col = TELA[i].col, j;
  ctx.save();
  ctx.translate(x, yc);
  if (TELA[i].free) {
    var bw = RP * 1.7, bh = RP * 1.45;
    ctx.fillStyle = rgba(col, 0.3); ctx.strokeStyle = col; ctx.lineWidth = 2.2;
    C.roundRect(ctx, -bw / 2, RP - bh, bw, bh, 3); ctx.fill(); ctx.stroke();
    ctx.restore();
    return;
  }
  ctx.rotate(b.phi);
  if (i === 0) {                                  /* обруч: только обод */
    ctx.strokeStyle = col; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(0, 0, RP - 2.5, 0, TWO_PI); ctx.stroke();
    metka(ctx, RP - 2.5, ink, false);
  } else if (i === 1) {                           /* тонкая сфера: оболочка */
    ctx.fillStyle = rgba(col, 0.1); ctx.strokeStyle = col; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.arc(0, 0, RP - 1.3, 0, TWO_PI); ctx.fill(); ctx.stroke();
    metka(ctx, RP - 1.3, ink, true);
  } else if (i === 2) {                           /* диск: сплошной */
    ctx.fillStyle = rgba(col, 0.38); ctx.strokeStyle = col; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.arc(0, 0, RP - 1.1, 0, TWO_PI); ctx.fill(); ctx.stroke();
    metka(ctx, RP - 6, ink, true);
  } else if (i === 3) {                           /* шар: сплошной, с бликом */
    var g = ctx.createRadialGradient(0, 0, 1, 0, 0, RP);
    g.addColorStop(0, rgba(col, 0.68)); g.addColorStop(1, rgba(col, 0.3));
    ctx.fillStyle = g; ctx.strokeStyle = col; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.arc(0, 0, RP - 1.1, 0, TWO_PI); ctx.fill(); ctx.stroke();
    metka(ctx, RP - 6, ink, true);
  } else if (i === 4) {                           /* колесо: обод и спицы */
    var tr = 1.5 + 6.5 * (1 - sp), ws = sp > 0.004 ? 0.8 + 5.2 * sp : 0;
    if (ws > 0) {
      ctx.strokeStyle = rgba(col, 0.92); ctx.lineWidth = ws; ctx.lineCap = 'butt';
      for (j = 0; j < SPITSY; j++) {
        var a = j * TWO_PI / SPITSY;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.sin(a) * (RP - tr), -Math.cos(a) * (RP - tr)); ctx.stroke();
      }
    }
    ctx.strokeStyle = col; ctx.lineWidth = tr;
    ctx.beginPath(); ctx.arc(0, 0, RP - tr / 2, 0, TWO_PI); ctx.stroke();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(0, 0, 3.2, 0, TWO_PI); ctx.fill();
    metka(ctx, RP - tr / 2, ink, false);
  }
  ctx.restore();
  if (i === 3) {                                  /* блик не вращается: свет стоит на месте */
    var gl = ctx.createRadialGradient(x - RP * 0.35, yc - RP * 0.38, 1, x - RP * 0.35, yc - RP * 0.38, RP * 0.6);
    gl.addColorStop(0, 'rgba(255,255,255,.35)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(x, yc, RP - 1.1, 0, TWO_PI); ctx.fill();
  }
}

function Gonka() {
  var st = useRef(null);
  if (!st.current) st.current = nachalo(TH_NACH, MU_NACH, SP_NACH, TEMP_NACH);
  var S = st.current;
  var pair = useState(snimok(S));
  var ui = pair[0], setUi = pair[1];

  function nachalo(thetaDeg, mu, sp, temp) {
    var p = parametry(thetaDeg, mu, sp);
    return { p: p, tela: TELA.map(function (d, i) { return novoeTelo(i, p); }),
             t: 0, running: true, finished: false, speed: temp, e5: energii5(sp, thetaDeg) };
  }
  function snimok(s) {
    return { thetaDeg: s.p.thetaDeg, mu: s.p.mu, spoke: s.p.spoke, speed: s.speed,
             running: s.running, finished: s.finished, sig: podpis(s) };
  }
  /* Подпись состояния, от которого зависит текст под сценой: режимы тел,
     кто финишировал, идёт ли гонка. Меняется подпись, и интерфейс
     перерисовывается. */
  function podpis(s) {
    return [s.running, s.finished, s.tela.map(function (b) { return b.mode + (b.done ? 'F' : ''); }).join(',')].join('|');
  }

  function pokazaniya() {
    var p = S.p, sn = Math.sin(p.theta), cs = Math.cos(p.theta);
    var maxBal = 0;
    var tela = S.tela.map(function (b, i) {
      var f = zakon(b, p);
      var bal = Math.abs(balans(b, p));
      if (bal > maxBal) maxBal = bal;
      var u = b.v - b.w * R;
      return {
        name: TELA[i].name, k: b.k, a: f.a,
        muMin: b.k / (1 + b.k) * Math.tan(p.theta),
        thetaMax: b.k > 0 ? Math.atan(p.mu * (1 + b.k) / b.k) : null,
        thetaMaxDeg: b.k > 0 ? Math.atan(p.mu * (1 + b.k) / b.k) * 180 / Math.PI : null,
        rolling: b.mode === 'roll',
        slipping: b.mode === 'slip',
        s: b.s, v: b.v, omega: b.w, phi: b.phi, uContact: u,
        heat: b.Q, frictionWork: -b.Q, finishTime: b.tFin, finishSpeed: b.vFin,
        K: 0.5 * M * b.v * b.v + 0.5 * b.k * M * R * R * b.w * b.w, balance: balans(b, p)
      };
    });
    window.__demoState = {
      theta: p.theta, thetaDeg: p.thetaDeg, mu: p.mu, bodies: tela, spokeFraction: p.spoke,
      t: S.t, running: S.running, finished: S.finished, speed: S.speed,
      g: G, R: R, m: M, track: DL, normal: M * G * cs, along: M * G * sn,
      energy5: { rim: S.e5.rim, wheel: S.e5.wheel, disk: S.e5.disk, overestimate: S.e5.over, K: S.e5.K },
      balanceError: maxBal
    };
  }
  function obnovit() { setUi(snimok(S)); pokazaniya(); }

  function step(dt) {
    if (!S.running) return;
    var h = dt * S.speed;
    var n = Math.max(1, Math.ceil(h / H_SUB - 1e-9)), hh = h / n;
    for (var j = 0; j < n; j++) {
      var zhivye = 0;
      for (var i = 0; i < S.tela.length; i++) {
        var b = S.tela[i];
        if (!b.done) dvigat(b, hh, S.p, STOP_GONKA);
        if (!b.done) zhivye++;
      }
      S.t += hh;
      if (!zhivye) {
        S.running = false; S.finished = true;
        S.t = Math.max.apply(null, S.tela.map(function (b) { return b.tFin; }));
        break;
      }
    }
    if (podpis(S) !== ui.sig) obnovit(); else pokazaniya();
  }

  function draw(ctx) {
    var tone = C.tones(ctx), ink = tone.ink, muted = tone.muted, mut = 'rgb(' + muted + ')', inkc = 'rgb(' + ink + ')';
    var acc = 'rgb(' + tone.accent + ')';          /* акцент темы: янтарный на тёмном, бирюзовый на светлом */
    var p = S.p, i, b, T, yl, yc, x;

    /* заголовки колонок и часы */
    C.label(ctx, 12, 26, 'β = I/(mR²)', 17, mut, 'left');
    C.label(ctx, XS, 26, 'старт', 17, mut, 'center');
    C.label(ctx, XF, 26, 'финиш', 17, mut, 'center');
    C.label(ctx, (XS + XF) / 2, 26, 't = ' + num(S.t, 3) + ' с', 17, acc, 'center');
    C.label(ctx, XA, 26, 'a, м/с²', 17, mut, 'right');
    C.label(ctx, XMU, 26, 'μ мин', 17, mut, 'right');
    C.label(ctx, XT, 26, 'время, с', 17, mut, 'right');
    C.label(ctx, XR, 26, 'режим', 17, mut, 'left');

    /* строки: полоса, подпись, дорожка, тело, числа */
    for (i = 0; i < TELA.length; i++) {
      b = S.tela[i];
      T = Y0 + i * RH; yl = T + RH - 3; yc = yl - RP;
      if (i % 2 === 0) { ctx.fillStyle = 'rgba(' + ink + ',.035)'; ctx.fillRect(0, T, W, RH); }
      C.label(ctx, 12, T + 21, TELA[i].name === 'колесо со спицами' ? 'колесо' : TELA[i].name, 18, TELA[i].col, 'left');
      C.label(ctx, 12, T + 41, 'β = ' + (b.k === 0 ? '0' : num(b.k, 3)), 17, mut, 'left');
      ctx.strokeStyle = 'rgba(' + muted + ',.5)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(XS - RP - 6, yl); ctx.lineTo(XF + RP + 6, yl); ctx.stroke();
    }

    /* старт и финиш */
    ctx.save();
    ctx.setLineDash([5, 6]); ctx.lineWidth = 1.4;
    ctx.strokeStyle = 'rgba(' + muted + ',.7)';
    ctx.beginPath(); ctx.moveTo(XS, Y0 - 2); ctx.lineTo(XS, Y0 + TELA.length * RH); ctx.stroke();
    ctx.strokeStyle = acc;
    ctx.beginPath(); ctx.moveTo(XF, Y0 - 2); ctx.lineTo(XF, Y0 + TELA.length * RH); ctx.stroke();
    ctx.restore();

    /* тела и числа */
    var f;
    for (i = 0; i < TELA.length; i++) {
      b = S.tela[i];
      T = Y0 + i * RH; yl = T + RH - 3; yc = yl - RP;
      x = XS + b.s * SC;
      risuyTelo(ctx, i, b, x, yc, ink, p.spoke);
      var u = b.v - b.w * R;
      if (!TELA[i].free && Math.abs(u) > 0.01 && b.mode === 'slip') {
        strelka(ctx, x, yl, x + C.clamp(u * 24, -70, 70), yl, CLR_SKOL, 3);
      }
      f = zakon(b, p);
      chislo(ctx, XA, T + 31, num(f.a, 3), inkc);
      chislo(ctx, XMU, T + 31, TELA[i].free ? '0' : num(b.k / (1 + b.k) * Math.tan(p.theta), 3), inkc);
      if (b.done) chislo(ctx, XT, T + 31, num(b.tFin, 3), acc);
      var rez = TELA[i].free ? 'скользит' : b.mode === 'roll' ? 'катится' : 'проскальзывает';
      var cr = TELA[i].free ? mut : b.mode === 'roll' ? CLR_KATIT : CLR_SKOL;
      C.label(ctx, XR, T + 31, rez, 17, cr, 'left');
    }

    /* низ: значок склона и энергии колеса на 5 м/с */
    var FY = Y0 + TELA.length * RH + 4;
    ctx.strokeStyle = 'rgba(' + muted + ',.35)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, FY); ctx.lineTo(W, FY); ctx.stroke();
    var Lw = 84, ax = 18, ay = HGT - 8;
    var wx = Lw * Math.cos(p.theta), wy = Lw * Math.sin(p.theta);
    ctx.fillStyle = 'rgba(' + ink + ',.05)';
    ctx.beginPath(); ctx.moveTo(ax, ay - wy); ctx.lineTo(ax + wx, ay); ctx.lineTo(ax, ay); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(' + muted + ',.8)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(ax, ay - wy); ctx.lineTo(ax + wx, ay); ctx.lineTo(ax, ay); ctx.closePath(); ctx.stroke();
    ctx.strokeStyle = inkc; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ax, ay - wy); ctx.lineTo(ax + wx, ay); ctx.stroke();
    ctx.strokeStyle = acc; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ax + wx, ay, 30, Math.PI, Math.PI + p.theta, false); ctx.stroke();
    C.label(ctx, ax + wx + 12, ay - 3, 'θ = ' + num(p.thetaDeg, 0) + '°', 17, acc, 'left');

    C.label(ctx, 214, FY + 26, 'Энергия при качении, масса 1 кг, скорость центра 5 м/с:', 17, mut, 'left');
    var e = S.e5;
    C.readout(ctx, 340, FY + 52, 'ОБОД, Дж', num(e.rim, 2), TELA[I_OBRUCH].col);
    C.readout(ctx, 520, FY + 52, 'КОЛЕСО, Дж', num(e.wheel, 2), TELA[I_KOLESO].col);
    C.readout(ctx, 700, FY + 52, 'ДИСК, Дж', num(e.disk, 2), TELA[I_DISK].col);
    C.readout(ctx, 990, FY + 52, 'ОБОД ЗАВЫШАЕТ КОЛЕСО, %', num(e.over * 100, 1), acc);
  }

  var ref = C.useStage(W, HGT, step, draw);
  if (!window.__demoState) pokazaniya();
  window.__demoProgon = progon;

  /* Любой ползунок и «Старт» ставят тела на старт и пускают гонку. */
  function peresbros(thetaDeg, mu, sp) {
    var n = nachalo(thetaDeg, mu, sp, S.speed);
    S.p = n.p; S.tela = n.tela; S.t = 0; S.running = true; S.finished = false; S.e5 = n.e5;
    obnovit();
  }
  function start() { peresbros(S.p.thetaDeg, S.p.mu, S.p.spoke); }
  function ugol(v) { peresbros(C.clamp(Math.round(v), TH_MIN, TH_MAX), S.p.mu, S.p.spoke); }
  function tren(v) { peresbros(S.p.thetaDeg, C.clamp(Math.round(v * 100) / 100, 0, MU_MAX), S.p.spoke); }
  function spicy(v) { peresbros(S.p.thetaDeg, S.p.mu, C.clamp(Math.round(v) / 100, 0, 1)); }
  function pauza() { if (S.finished) return; S.running = !S.running; obnovit(); }
  function temp(v) { S.speed = v; obnovit(); }

  function perechen(a) {
    if (a.length < 2) return a.join('');
    return a.slice(0, -1).join(', ') + ' и ' + a[a.length - 1];
  }

  function slova() {
    var A = function (t) { return '<span class="accent">' + t + '</span>'; };
    var p = S.p, tela = S.tela, i;
    var cs = Math.cos(p.theta), sn = Math.sin(p.theta);
    var skol = [], tmin = [], imin = -1, imax = -1, umin = 0, umax = 0;
    for (i = 0; i < tela.length; i++) {
      if (TELA[i].free) continue;
      var kmn = tela[i].k / (1 + tela[i].k) * Math.tan(p.theta);
      if (tela[i].mode === 'slip') { skol.push(i); tmin.push(num(kmn, 3)); }
      var um = Math.atan(p.mu * (1 + tela[i].k) / tela[i].k) * 180 / Math.PI;
      if (imin < 0 || um < umin) { imin = i; umin = um; }
      if (imax < 0 || um > umax) { imax = i; umax = um; }
    }
    var imya = function (j) { return TELA[j].name === 'колесо со спицами' ? 'колесо' : TELA[j].name; };
    var finish = '';
    if (S.finished) {
      var ord = tela.map(function (b, j) { return j; }).sort(function (x, y) { return tela[x].tFin - tela[y].tFin; });
      finish = A('Финиш.') + ' ' + ord.map(function (j) { return imya(j) + ' ' + num(tela[j].tFin, 3) + ' с'; }).join(', ') + '. ';
    }
    var ask = A(num(G * (sn - p.mu * cs), 2) + ' м/с²');
    if (skol.length === 0) {
      var porog = 'При μ = ' + num(p.mu, 2) + ' ' + imya(imin) + ' держится до ' + A(num(umin, 1) + '°') + ', ' + imya(imax) + ' до ' + A(num(umax, 1) + '°') + '.';
      if (S.finished) {
        var dolya = function (j) {
          var b = tela[j], Kt = 0.5 * M * b.vFin * b.vFin, Kr = 0.5 * b.k * M * R * R * b.wFin * b.wFin;
          return Kt / (Kt + Kr);
        };
        return finish + 'Пять тел катились без проскальзывания, и трение покоя работы не совершило: точка касания стоит. ' +
          'Каждое тело получило кинетическую энергию ' + A(num(M * G * DL * sn, 2) + ' Дж') + ', равную убыли потенциальной. У обруча ' +
          A(num(dolya(I_OBRUCH) * 100, 0) + ' %') + ' её в движении центра, у шара ' + A(num(dolya(I_SHAR) * 100, 0) + ' %') +
          ', у бруска все 100 %. ' + porog;
      }
      return 'Все пять тел катятся без проскальзывания: трения покоя хватает, пока ' +
        kx(String.raw`\mu \ge \dfrac{\beta\,\operatorname{tg}\theta}{1+\beta}`) + '. Ускорение ' + kx(String.raw`a = \dfrac{g\sin\theta}{1+\beta}`) +
        ' задаёт только ' + kx(String.raw`\beta = I/(mR^2)`) + ', масса и радиус в него не входят. ' + porog;
    }
    var teplo = '';
    if (S.finished) {
      teplo = ' В тепло ушло ' + perechen(skol.map(function (j) { return num(tela[j].Q, 2) + ' Дж'; })) + '.';
    }
    if (p.mu === 0) {
      return finish + 'Трения нет: все пять тел скользят, как брусок, с ускорением ' + kx(String.raw`g\sin\theta`) + ' = ' +
        A(num(G * sn, 2) + ' м/с²') + ', и β роли не играет. Это предел, к которому идёт каждое тело, когда трения всё меньше.';
    }
    var allSlip = skol.length === tela.length - 1;
    return finish + (allSlip ? 'Проскальзывают все пять тел' : 'Проскальзывают ' + perechen(skol.map(imya))) +
      ': μ = ' + num(p.mu, 2) + ' ниже порога ' + perechen(tmin) + ' при θ = ' + num(p.thetaDeg, 0) + '°. У проскальзывающего тела ' +
      'ускорение ' + kx(String.raw`g(\sin\theta-\mu\cos\theta)`) + ' = ' + ask + ' от β не зависит, они идут вровень и быстрее, чем катились бы. ' +
      'Красная стрелка внизу дорожки: скорость точки касания относительно склона.' + teplo;
  }

  return html`
    <div class="demo">
      <div class="controls">
        <${C.Group}>
          <${C.Btn} action=${true} onClick=${start}>Старт<//>
          <${C.Btn} disabled=${ui.finished} onClick=${pauza}>${ui.running ? 'Пауза' : 'Пуск'}<//>
        <//>
        <${C.Group} label="Темп:">
          <${C.Btn} active=${ui.speed === 1} onClick=${function () { temp(1); }}>×1<//>
          <${C.Btn} active=${ui.speed === 0.5} onClick=${function () { temp(0.5); }}>×½<//>
          <${C.Btn} active=${ui.speed === 0.25} onClick=${function () { temp(0.25); }}>×¼<//>
        <//>
        <${C.Slider} label="Наклон:" min=${TH_MIN} max=${TH_MAX} step=${1} value=${ui.thetaDeg}
                     onChange=${ugol} display=${'θ = ' + num(ui.thetaDeg, 0) + '°'} />
        <${C.Slider} label="Трение:" min=${0} max=${MU_MAX} step=${0.01} value=${ui.mu}
                     onChange=${tren} display=${'μ = ' + num(ui.mu, 2)} />
        <${C.Slider} label="Масса в спицах:" min=${0} max=${100} step=${1} value=${Math.round(ui.spoke * 100)}
                     onChange=${spicy} display=${num(ui.spoke * 100, 0) + ' %'} />
      </div>
      <canvas class="stage" ref=${ref}></canvas>
      <${C.Status} html=${slova()} />
    </div>`;
}

C.mount(Gonka);
</script>
</body>
</html>
