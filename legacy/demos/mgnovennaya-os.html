<script>
'use strict';
var C = window.DemoCore, html = C.html;
var useState = React.useState, useRef = React.useRef, useEffect = React.useEffect;

/* ══════════════════ физика ══════════════════

   Блоки главы `mgnovennaya-os` и `primer-koleso`, рисунок `ris-koleso`
   (бриф briefs/demki_nedelya06.md, № 6). Колесо радиуса R едет по прямой.
   Глава утверждает про верхнюю точку обода при качении без
   проскальзывания три числа: скорость 2v₀, расстояние до точки касания
   2R, радиус кривизны следа 4R, и одно про ускорения: у точек обода они
   смотрят к центру колеса, а не к точке касания, пока v₀ постоянна.
   Демка обязана выдать всё это счётом, а не подписью.

   ЧТО ЗАДАНО. Тело одно, твёрдое колесо. Центр идёт по высоте R со
   скоростью v₀, колесо поворачивается по часовой стрелке с угловой
   скоростью ω, обе постоянны. Числа взяты круглыми: R = 0,5 м,
   ω = 4 рад/с, ωR = 2 м/с. Ползунок проскальзывания меняет v₀ при
   неизменных ω и R: u = v₀ − ωR, скорость, с которой точка колеса у
   дороги скользит по дороге (u > 0 вперёд, колесо идёт юзом; u < 0 назад,
   колесо буксует). Качение без проскальзывания это u = 0, v₀ = ωR = 2 м/с.
   Положение любой точки тела задано одним выражением (функция
   polozhenie): центр плюс вектор длиной r, повёрнутый на угол ωt. Больше
   ничего в модель не входит: ни скорости, ни ускорения, ни ось, ни
   кривизна в неё не заложены.

   ЧТО ИЗМЕРЯЕТСЯ. Всё остальное снимается с движения численно, как
   измеряют по киносъёмке, а не берётся из формул главы.
   1. Скорость и ускорение точки: центральные разности положения по
      времени с шагом 1 мс и экстраполяцией Ричардсона (шаги h и 2h,
      погрешность порядка h⁴).
   2. Мгновенная ось: точка, в которой все перпендикуляры к найденным
      скоростям сходятся. Берутся восемь точек обода через 45° и
      центр, для каждой прямая через точку перпендикулярно её скорости;
      ось ищется методом наименьших квадратов, невязка (наибольшее
      расстояние найденной точки до прямых) печатается в __demoState как
      axisResidual. Это и есть содержание блока `mgnovennaya-os`:
      перпендикулярность скоростей радиус-векторам из одной точки. В поиск
      оси угловая скорость не входит: она есть только в законе движения и в
      проверке |v| = ωd.
   3. Радиус кривизны следа двумя независимыми путями. Первый, по форме
      следа и без скоростей: окружность через три точки следа с шагом
      до ±1 мс, радиус и центр, экстраполяция Ричардсона. Второй, по закону
      движения: |v|³/|v × a| с найденными v и a. Печатается первый, второй
      лежит в __demoState (rhoTopKin, B.rhoKin), расхождение печатается на
      сцене. Формула ρ = (v₀ + ωR)²/(Rω²) в демке не стоит: она нужна только
      автопроверке, чтобы сверить измерение.

   ЧТО ПОКАЗЫВАЕТ СЦЕНА. Камера едет с центром колеса: колесо стоит на
   экране, дорога идёт мимо. Стрелки скоростей и ускорений стоят в восьми
   положениях по циферблату, через 45°. В системе центра поле скоростей обода от
   времени не зависит (под каждой отметкой всякий раз оказывается другая
   материальная точка, но с той же скоростью), поэтому стрелки неподвижны,
   а крутятся только спицы и отмеченная точка B. B движется как материальная
   точка: её след (циклоида при качении, трохоида при проскальзывании),
   её скорость и её окружность кривизны. В момент 0 точка B на верху обода.
   Кнопка «К верху» возвращает её туда.

   ЧИСЛА ДЛЯ СВЕРКИ (качение, B наверху): скорость 4 м/с = 2v₀, расстояние до
   оси 1 м = 2R, радиус кривизны следа 2 м = 4R, ось в точке касания (высота
   0), ускорение всех точек обода ω²R = 8 м/с² = v₀²/R, к центру. Для
   проскальзывания s = v₀/ωR: ось на высоте R(1 − s) над дорогой, скорость
   верха ωR(1 + s), радиус кривизны следа вверху R(1 + s)². Они приведены
   в отчёте и в check-скрипте как ожидания; в самой демке нет ни одной из них.

   ТОЧНОСТЬ. Замеры 04.10, hcheck, страница целиком (check-скрипт и отчёт
   briefs/demki_nedelya06_mgnovennaya-os_REPORT.md). Качение, B наверху: ось
   на высоте −4·10⁻¹² м от дороги, скорость верха 4 м/с с ошибкой 2·10⁻¹¹,
   расстояние до оси 1 м (4·10⁻¹²), радиус кривизны следа 2 м по следу и по
   закону движения (4·10⁻¹¹ и 3·10⁻¹¹, расхождение путей 8·10⁻¹² м), ускорение
   обода 8 м/с² (7·10⁻¹¹), угол ускорения с направлением на центр 2·10⁻¹¹,
   косинус угла между скоростью и отрезком до оси не больше 4·10⁻¹⁴,
   |v| − ωd не больше 3·10⁻¹¹ м/с, невязка перпендикуляров 3·10⁻¹⁴ м. По всей
   шкале проскальзывания от −2 до +2 м/с все эти величины совпадают с
   формулами R(1 − s), ωR(1 + s), R(1 + s)² до 10⁻¹⁰. Радиус кривизны по
   следу при качении по всей шкале фазы: не хуже 4·10⁻⁹ м при |ψ| ≤ 170°,
   не хуже 2·10⁻⁷ м на всей шкале, у острия циклоиды, где радиус кривизны
   уходит в ноль и три точки следа его уже не держат (шаг там сокращается до
   20 мкс, без этого ошибка у острия доходила до 2·10⁻⁴ м). По закону
   движения радиус держится до 10⁻⁹ м и у острия.

   ОТРИЦАТЕЛЬНЫЙ КОНТРОЛЬ. В странице подкладывались дефекты (вращение в
   обратную сторону, радиус по трём точкам +0,1 %, скорость по x −0,1 %),
   и проверки их ловили: ось уходила на 1 м, расхождение двух путей
   вырастало до 2·10⁻³ м, невязки перпендикуляров до 2·10⁻⁴ м. */

var R = 0.5;                       /* радиус колеса, м */
var OM = 4;                        /* угловая скорость колеса, рад/с */
var WR = OM * R;                   /* скорость обода относительно центра, 2 м/с */
var HT = 1e-3;                     /* шаг численных производных по времени, с */
var NP = 8;                        /* точек обода со стрелками, через 45° */
var TWO_PI = 2 * Math.PI;
var SLOWMO = 0.25;                 /* показ вчетверо медленнее натуры: оборот
                                      длится 1,57 с, и глаз за точкой не
                                      успевает */

/* Положение материальной точки тела через tau секунд от «сейчас».
   th: угол точки по часовой стрелке от верха в момент «сейчас»;
   r: расстояние от центра (R для обода, 0 для самого центра).
   x отсчитывается от центра колеса в момент «сейчас», y это высота над
   дорогой. Движение тела целиком в этой строке: центр идёт со скоростью
   v0 по высоте R, тело вращается по часовой стрелке с ω. */
function polozhenie(v0, th, r, tau) {
  return { x: v0 * tau + r * Math.sin(th + OM * tau),
           y: R + r * Math.cos(th + OM * tau) };
}

/* Скорость и ускорение центральными разностями с шагом h. */
function raznosti(v0, th, r, h) {
  var pm = polozhenie(v0, th, r, -h), p0 = polozhenie(v0, th, r, 0), pp = polozhenie(v0, th, r, h);
  return { vx: (pp.x - pm.x) / (2 * h), vy: (pp.y - pm.y) / (2 * h),
           ax: (pp.x - 2 * p0.x + pm.x) / (h * h), ay: (pp.y - 2 * p0.y + pm.y) / (h * h) };
}
/* Экстраполяция Ричардсона по шагам h и 2h: ошибка усечения с h² падает до h⁴. */
function proizvodnye(v0, th, r) {
  var a = raznosti(v0, th, r, HT), b = raznosti(v0, th, r, 2 * HT);
  return { vx: (4 * a.vx - b.vx) / 3, vy: (4 * a.vy - b.vy) / 3,
           ax: (4 * a.ax - b.ax) / 3, ay: (4 * a.ay - b.ay) / 3 };
}

/* Окружность через три точки: радиус и центр. Точки берутся относительно
   средней, чтобы не терять разряды на разности больших координат. Три точки
   на прямой дают бесконечный радиус. */
function okruzhnost3(p1, p2, p3) {
  var ux = p1.x - p2.x, uy = p1.y - p2.y, wx = p3.x - p2.x, wy = p3.y - p2.y;
  var D = 2 * (ux * wy - uy * wx);
  if (Math.abs(D) < 1e-300) return { rho: Infinity, cx: NaN, cy: NaN };
  var u2 = ux * ux + uy * uy, w2 = wx * wx + wy * wy;
  var cx = (wy * u2 - uy * w2) / D, cy = (ux * w2 - wx * u2) / D;
  return { rho: Math.hypot(cx, cy), cx: p2.x + cx, cy: p2.y + cy };
}
/* Кривизна следа точки по форме следа: три точки в моменты −h, 0, +h и −2h, 0, +2h,
   радиус и центр с экстраполяцией Ричардсона. Шаг h берётся не больше 1 мс и не
   больше 0,1 от времени, за которое скорость точки меняется на саму себя, |v|/|a|,
   оба числа снимаются с движения. Вдали от острия циклоиды это 1 мс. У самого острия
   скорость идёт к нулю, трёх точек с шагом 1 мс уже мало, и шаг укорачивается
   (до 20 мкс), иначе у острия погрешность радиуса вырастала до 2·10⁻⁴ м. */
function krivizna(v0, th, r) {
  var d = raznosti(v0, th, r, HT), sp = Math.hypot(d.vx, d.vy), ac = Math.hypot(d.ax, d.ay);
  var h = Math.min(HT, Math.max(2e-5, 0.1 * sp / (ac || 1)));
  var p0 = polozhenie(v0, th, r, 0);
  var a = okruzhnost3(polozhenie(v0, th, r, -h), p0, polozhenie(v0, th, r, h));
  var b = okruzhnost3(polozhenie(v0, th, r, -2 * h), p0, polozhenie(v0, th, r, 2 * h));
  if (!isFinite(a.rho) || !isFinite(b.rho)) return { rho: Infinity, cx: NaN, cy: NaN };
  /* радиус не отрицателен: у острия экстраполяция может дать −10⁻¹⁰ вместо нуля */
  return { rho: Math.max(0, (4 * a.rho - b.rho) / 3), cx: (4 * a.cx - b.cx) / 3, cy: (4 * a.cy - b.cy) / 3 };
}

/* Всё, что снимается с точки обода, которая сейчас на угле th от верха. */
function izmerTochku(v0, th) {
  var d = proizvodnye(v0, th, R), p = polozhenie(v0, th, R, 0), k = krivizna(v0, th, R);
  var sp = Math.hypot(d.vx, d.vy), cr = d.vx * d.ay - d.vy * d.ax;
  return {
    th: th, x: p.x, y: p.y, vx: d.vx, vy: d.vy, v: sp,
    ax: d.ax, ay: d.ay, a: Math.hypot(d.ax, d.ay),
    rho: k.rho, cx: k.cx, cy: k.cy,                 /* по форме следа */
    rhoKin: cr === 0 ? Infinity : sp * sp * sp / Math.abs(cr)   /* по закону движения */
  };
}

/* Мгновенная ось по найденным скоростям: точка, лежащая на перпендикулярах
   к скоростям всех точек. Прямая i: n_i · (X − p_i) = 0, n_i единичный вектор
   скорости. Метод наименьших квадратов, нормальные уравнения 2×2. Точки с
   нулевой скоростью направления не имеют и в счёт не идут (сама ось среди
   них). Если все скорости параллельны, оси нет (чистый перенос). */
function osPoSkorostyam(pts) {
  var a11 = 0, a12 = 0, a22 = 0, b1 = 0, b2 = 0, n = 0, i, p, v, nx, ny, c;
  for (i = 0; i < pts.length; i++) {
    p = pts[i]; v = Math.hypot(p.vx, p.vy);
    if (v < 1e-3) continue;
    nx = p.vx / v; ny = p.vy / v; c = nx * p.x + ny * p.y;
    a11 += nx * nx; a12 += nx * ny; a22 += ny * ny; b1 += nx * c; b2 += ny * c; n++;
  }
  var det = a11 * a22 - a12 * a12;
  if (n < 2 || det < 1e-9) return null;
  var x = (a22 * b1 - a12 * b2) / det, y = (a11 * b2 - a12 * b1) / det;
  var res = 0;
  for (i = 0; i < pts.length; i++) {
    p = pts[i]; v = Math.hypot(p.vx, p.vy);
    if (v < 1e-3) continue;
    res = Math.max(res, Math.abs((p.vx * (x - p.x) + p.vy * (y - p.y)) / v));
  }
  return { x: x, y: y, res: res };
}

/* Все показания демки для проскальзывания u и момента t. Чистая функция:
   то же, что лежит в window.__demoState, пересчитывается по (u, t). */
function izmerit(u, t) {
  var v0 = WR + u, k, i;
  var rim = [];
  for (k = 0; k < NP; k++) rim.push(izmerTochku(v0, TWO_PI * k / NP));
  var cen = proizvodnye(v0, 0, 0);                  /* центр: точка тела на расстоянии 0 */
  var cp = polozhenie(v0, 0, 0, 0);
  var centre = { x: cp.x, y: cp.y, vx: cen.vx, vy: cen.vy };
  var os = osPoSkorostyam(rim.concat([centre]));

  var thB = OM * t;
  var B = izmerTochku(v0, thB);
  var top = rim[0], bottom = rim[NP / 2];
  var psi = ((thB + Math.PI) % TWO_PI + TWO_PI) % TWO_PI - Math.PI;

  var ox = os ? os.x : NaN, oy = os ? os.y : NaN;
  function dOs(p) { return os ? Math.hypot(p.x - ox, p.y - oy) : Infinity; }
  function dRho(p) { return (p.rho === Infinity && p.rhoKin === Infinity) ? 0 : Math.abs(p.rho - p.rhoKin); }

  /* Ускорения: сколько их, куда смотрят; перпендикулярность и пропорциональность скоростей. */
  var aSum = 0, aMin = Infinity, aMax = 0, aSide = 0, perp = 0, prop = 0, p, dd;
  for (i = 0; i < rim.length; i++) {
    p = rim[i];
    aSum += p.a; aMin = Math.min(aMin, p.a); aMax = Math.max(aMax, p.a);
    /* синус угла между ускорением и направлением от точки к центру: ноль, если смотрит точно на центр */
    var rx = -p.x, ry = R - p.y, rl = Math.hypot(rx, ry);
    aSide = Math.max(aSide, Math.abs(p.ax * ry - p.ay * rx) / (p.a * rl));
    if (os) {
      dd = dOs(p);
      if (p.v >= 1e-3 && dd > 1e-6) perp = Math.max(perp, Math.abs(p.vx * (p.x - ox) + p.vy * (p.y - oy)) / (p.v * dd));
      prop = Math.max(prop, Math.abs(p.v - OM * dd));
    }
  }
  var S = {
    R: R, omega: OM, v0: v0, omegaR: WR, slip: u,
    axisY: os ? os.y : null,                        /* высота мгновенной оси над дорогой, м; null — оси нет */
    axisX: os ? os.x : null,                        /* её сдвиг от вертикали через центр, м */
    axisResidual: os ? os.res : null,
    vTop: top.v, dTop: dOs(top), rhoTop: top.rho, rhoTopKin: top.rhoKin, rhoTopDiff: dRho(top),
    vContact: bottom.vx,                            /* скорость точки колеса у дороги относительно дороги */
    vCentre: centre.vx,
    aRim: aSum / rim.length, aRimSpread: aMax - aMin, aToCentre: aSide,
    perpMax: perp, propMax: prop,
    psiDeg: psi * 180 / Math.PI,
    B: { v: B.v, d: dOs(B), rho: B.rho, rhoKin: B.rhoKin, rhoDiff: dRho(B), a: B.a,
         rhoOverD: dOs(B) > 0 ? B.rho / dOs(B) : null, x: B.x, y: B.y, cx: B.cx, cy: B.cy }
  };
  /* геометрия для рисования: в JSON состояния не идёт */
  Object.defineProperty(S, 'rim', { value: rim, enumerable: false });
  Object.defineProperty(S, 'centre', { value: centre, enumerable: false });
  Object.defineProperty(S, 'os', { value: os, enumerable: false });
  Object.defineProperty(S, 'Bfull', { value: B, enumerable: false });
  return S;
}

/* Русская запятая и настоящий минус; крохи печатаются нулём. */
function num(v, d) {
  if (!isFinite(v)) return v > 0 ? '∞' : '—';
  if (Math.abs(v) < 0.5 * Math.pow(10, -d)) v = 0;
  return v.toFixed(d).replace('.', ',').replace('-', '−');
}
var SUP = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴',
            '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
function sup(n) { return String(n).split('').map(function (c) { return SUP[c] || c; }).join(''); }
/* Расхождение двух путей в метрах это доли нанометра: печатаем порядком. */
function poryadok(d) {
  if (!(d > 0)) return '0';
  var e = Math.floor(Math.log(d) / Math.LN10);
  return num(d / Math.pow(10, e), 1) + '·10' + sup(e);
}
function kx(tex) {
  try { return katex.renderToString(tex, { throwOnError: false }); }
  catch (e) { return tex; }
}

/* ══════════════════ сцена ══════════════════

   Слева поле сцены: дорога, колесо, стрелки, след точки B и её окружность
   кривизны; справа показания. Камера едет с центром, поэтому колесо
   стоит в точке (X0, Y0 − R·PX), а метки на дороге уезжают назад. */

var W = 1000, HGT = 460;
var FX0 = 14, FX1 = 700, FY0 = 10, FY1 = 452;      /* поле сцены, границы обрезки */
var X0 = 350, Y0 = 150, PX = 100;                  /* вертикаль центра, дорога, пикселей на метр */
var SV = 22, SA = 5;                               /* пикселей на 1 м/с и на 1 м/с² */
var TICK = 0.5;                                    /* метки на дороге через 0,5 м */

/* Цвета по словарю рисунков главы (кинематика): скорость бирюзовая, ускорение
   охряное, окружность кривизны и её радиус оливковые, как в
   krivizna-okruzhnost. Тема цвета данных не меняет. */
var CT = '#4db6c6';
var CA = '#e08a52';
var CR = '#a8c93f';

function X(x) { return X0 + x * PX; }
function Y(y) { return Y0 - y * PX; }
function vPole(x, y) { return x >= FX0 && x <= FX1 && y >= FY0 && y <= FY1; }

function strelka(ctx, x0, y0, x1, y1, color, width, dash) {
  var dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy);
  if (L < 2) return;
  var ux = dx / L, uy = dy / L, head = Math.min(12, L * 0.45);
  ctx.save();
  ctx.setLineDash(dash || []);
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x0, y0); ctx.lineTo(x1 - ux * head * 0.72, y1 - uy * head * 0.72);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x1 - ux * head - uy * head * 0.34, y1 - uy * head + ux * head * 0.34);
  ctx.lineTo(x1 - ux * head * 0.72, y1 - uy * head * 0.72);
  ctx.lineTo(x1 - ux * head + uy * head * 0.34, y1 - uy * head - ux * head * 0.34);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function otrezok(ctx, x1, y1, x2, y2, color, wide, dash) {
  ctx.save();
  ctx.setLineDash(dash || []);
  ctx.strokeStyle = color; ctx.lineWidth = wide;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.restore();
}
function tochkaNa(ctx, x, y, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TWO_PI); ctx.fill();
}
/* Последняя точка отрезка, ещё попавшая в поле: пометка «центр за кадром». */
function naSreze(x1, y1, x2, y2) {
  var best = null, i, u, x, y;
  for (i = 0; i <= 120; i++) {
    u = i / 120; x = x1 + (x2 - x1) * u; y = y1 + (y2 - y1) * u;
    if (vPole(x, y)) best = { x: x, y: y }; else break;
  }
  return best;
}

function Mgnovennaya() {
  var st = useRef({ t: 0, xC: 0, u: 0, run: false, acc: 0,
                    sl: { v: true, a: false, rho: true }, S: null }).current;
  var pair = useState({ u: 0, psi: 0, run: false, v: true, a: false, rho: true });
  var ui = pair[0], setUi = pair[1];

  function izm() {
    var S = izmerit(st.u, st.t);
    S.running = st.run;
    S.layers = { velocities: st.sl.v, accelerations: st.sl.a, curvature: st.sl.rho };
    st.S = S;
    window.__demoState = S;
  }
  if (!st.S) izm();

  /* Ручка «Поворот» стоит там, где её оставил палец: модель знает угол по
     модулю оборота, и на краю рейки −180° и 180° это одно положение, так что
     ручку, доведённую до правого края, пересчёт отправил бы на левый. Пока
     идёт показ, угол берётся из модели. */
  function psiSlider() { return Math.round(st.S.psiDeg); }
  function sinhro(psi) {
    var p = psi != null ? psi : psiSlider();
    if (psi == null && !st.run && Math.abs(p) >= 179 && Math.abs(ui.psi) >= 179) p = ui.psi;
    setUi({ u: st.u, psi: p, run: st.run, v: st.sl.v, a: st.sl.a, rho: st.sl.rho });
  }

  function step(dt) {
    var idet = st.run || st.force;
    if (idet) {
      var d = dt * SLOWMO;
      st.t += d; st.xC += (WR + st.u) * d;
    }
    izm();
    /* ручка ползунка поворота живёт в React: двигаем её десять раз в секунду */
    st.acc += dt;
    if (idet && st.acc > 0.1) { st.acc = 0; sinhro(); }
  }

  /* ── сцена ── */

  function draw(ctx) {
    var tone = C.tones(ctx);
    var ink = 'rgb(' + tone.ink + ')', muted = 'rgb(' + tone.muted + ')';
    var S = st.S, v0 = S.v0, os = S.os, B = S.Bfull;
    var rPx = R * PX, cxs = X(0), cys = Y(R);
    var i, k, p;

    ctx.save();
    ctx.beginPath(); ctx.rect(FX0, FY0, FX1 - FX0, FY1 - FY0); ctx.clip();

    /* дорога и метки: они уезжают назад вместе с ходом камеры */
    otrezok(ctx, FX0, Y0, FX1, Y0, 'rgba(' + tone.ink + ',.6)', 2);
    var k0 = Math.floor((st.xC - (X0 - FX0) / PX) / TICK) - 1;
    var k1 = Math.ceil((st.xC + (FX1 - X0) / PX) / TICK) + 1;
    for (k = k0; k <= k1; k++) {
      var tx = X0 + (k * TICK - st.xC) * PX;
      otrezok(ctx, tx, Y0, tx - 8, Y0 + 9, 'rgba(' + tone.muted + ',.55)', 1.4);
    }

    /* окружность кривизны следа точки B: центр, радиус и сама окружность */
    if (st.sl.rho) {
      var bx0 = X(B.x), by0 = Y(B.y);
      if (!isFinite(B.rho) || B.rho * PX >= 4000) {
        /* у точки перегиба окружность вырождается в прямую: рисуем касательную */
        var vl0 = Math.hypot(B.vx, B.vy) || 1, tux = B.vx / vl0, tuy = -B.vy / vl0;
        otrezok(ctx, bx0 - tux * 400, by0 - tuy * 400, bx0 + tux * 400, by0 + tuy * 400, CR, 2.4);
      } else {
        var ccx = X(B.cx), ccy = Y(B.cy), rr = B.rho * PX;
        ctx.save();
        ctx.strokeStyle = CR; ctx.lineWidth = 2.4; ctx.setLineDash([]);
        ctx.beginPath(); ctx.arc(ccx, ccy, rr, 0, TWO_PI); ctx.stroke();
        ctx.restore();
        otrezok(ctx, bx0, by0, ccx, ccy, CR, 1.4, [5, 6]);
        if (vPole(ccx, ccy)) {
          tochkaNa(ctx, ccx, ccy, 4.5, CR);
          /* подпись только вне колеса: у колеса, крутящегося на месте, центр кривизны
             лежит в его центре и подпись легла бы на стрелки */
          if (Math.hypot(ccx - cxs, ccy - cys) > rPx + 24) C.label(ctx, ccx + 10, ccy + 24, 'центр кривизны', 17, CR, 'left');
        } else {
          var srez = naSreze(bx0, by0, ccx, ccy);
          if (srez) C.label(ctx, srez.x + 10, srez.y - 10, 'центр за кадром', 17, CR, 'left');
        }
      }
    }

    /* след точки B: пройденное ярко, впереди бледно; два оборота в обе стороны */
    var T = 2 * TWO_PI / OM, N = 400;
    function sled(t0, t1, color, w) {
      ctx.save();
      ctx.strokeStyle = color; ctx.lineWidth = w; ctx.setLineDash([]); ctx.lineJoin = 'round';
      ctx.beginPath();
      for (i = 0; i <= N; i++) {
        var q = polozhenie(v0, B.th, R, t0 + (t1 - t0) * i / N);
        if (i) ctx.lineTo(X(q.x), Y(q.y)); else ctx.moveTo(X(q.x), Y(q.y));
      }
      ctx.stroke();
      ctx.restore();
    }
    sled(0, T, 'rgba(' + tone.ink + ',.28)', 2);
    sled(-T, 0, 'rgba(' + tone.ink + ',.9)', 2.6);

    /* отрезки от мгновенной оси к точкам обода: скорость перпендикулярна
       такому отрезку и растёт вместе с его длиной */
    if (st.sl.v && os) {
      var ox = X(os.x), oy = Y(os.y);
      for (i = 0; i < NP; i++) {
        p = S.rim[i];
        otrezok(ctx, ox, oy, X(p.x), Y(p.y), 'rgba(' + tone.muted + ',.4)', 1.2, [4, 5]);
      }
      otrezok(ctx, ox, oy, X(B.x), Y(B.y), 'rgba(' + tone.ink + ',.7)', 1.6, [6, 5]);
    }

    /* колесо: обод, спицы вместе с B, центр */
    ctx.save();
    ctx.strokeStyle = ink; ctx.lineWidth = 2.4; ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(cxs, cys, rPx, 0, TWO_PI); ctx.stroke();
    ctx.strokeStyle = 'rgba(' + tone.muted + ',.55)'; ctx.lineWidth = 1.4;
    for (k = 0; k < 6; k++) {
      var ga = B.th + k * Math.PI / 3;
      ctx.beginPath(); ctx.moveTo(cxs, cys);
      ctx.lineTo(cxs + rPx * Math.sin(ga), cys - rPx * Math.cos(ga)); ctx.stroke();
    }
    ctx.restore();
    tochkaNa(ctx, cxs, cys, 4, ink);

    /* скорости: двенадцать точек обода по циферблату, центр и точка B */
    if (st.sl.v) {
      for (i = 0; i < NP; i++) {
        p = S.rim[i];
        strelka(ctx, X(p.x), Y(p.y), X(p.x) + p.vx * SV, Y(p.y) - p.vy * SV, CT, 2.2);
      }
      strelka(ctx, cxs, cys, cxs + S.centre.vx * SV, cys - S.centre.vy * SV, CT, 2.6);
      if (v0 > 0.1) C.label(ctx, cxs + S.centre.vx * SV / 2, cys - 12, 'v₀', 19, CT, 'center');
    }

    /* ускорения: всё те же двенадцать точек и B; пунктир у B показывает,
       куда смотрело бы ускорение при вращении вокруг оси */
    if (st.sl.a) {
      if (os) {
        /* вращение вокруг оси с той же ω: центростремительное ω²d к оси */
        var gx = os.x - B.x, gy = os.y - B.y;
        strelka(ctx, X(B.x), Y(B.y), X(B.x) + gx * OM * OM * SA, Y(B.y) - gy * OM * OM * SA,
                'rgba(' + tone.muted + ',.95)', 2.2, [5, 4]);
      }
      for (i = 0; i < NP; i++) {
        p = S.rim[i];
        strelka(ctx, X(p.x), Y(p.y), X(p.x) + p.ax * SA, Y(p.y) - p.ay * SA, CA, 2.2);
      }
      strelka(ctx, X(B.x), Y(B.y), X(B.x) + B.ax * SA, Y(B.y) - B.ay * SA, CA, 3.6);
    }

    /* точки обода и B */
    for (i = 0; i < NP; i++) tochkaNa(ctx, X(S.rim[i].x), Y(S.rim[i].y), 3, 'rgba(' + tone.ink + ',.75)');
    var bx = X(B.x), by = Y(B.y);
    if (st.sl.v) {
      strelka(ctx, bx, by, bx + B.vx * SV, by - B.vy * SV, CT, 3.8);
      var vl = Math.hypot(B.vx, B.vy);
      if (vl > 0.05) {
        var dx = B.vx / vl, dy = -B.vy / vl;
        C.label(ctx, bx + B.vx * SV / 2 + dy * 18, by - B.vy * SV / 2 - dx * 18 + 6, 'v', 19, CT, 'center');
      }
    }
    C.glow(ctx, bx, by, 20, tone.accent, .4);
    tochkaNa(ctx, bx, by, 6.5, ink);
    var ox2 = Math.sin(B.th), oy2 = -Math.cos(B.th);
    C.label(ctx, bx + ox2 * 20, by + oy2 * 20 + 6, 'B', 20, ink, 'center');

    /* мгновенная ось: кольцо с крестом и подпись */
    if (os) {
      var ax0 = X(os.x), ay0 = Y(os.y);
      ctx.save();
      ctx.strokeStyle = ink; ctx.lineWidth = 2.4; ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(ax0, ay0, 8, 0, TWO_PI); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(ax0 - 5, ay0 - 5); ctx.lineTo(ax0 + 5, ay0 + 5);
      ctx.moveTo(ax0 - 5, ay0 + 5); ctx.lineTo(ax0 + 5, ay0 - 5);
      ctx.stroke();
      ctx.restore();
      if (os.y <= 0.12 * R) {
        C.label(ctx, ax0 + 16, ay0 + 36, 'мгновенная ось', 17, ink, 'left');
      } else {
        var lx = cxs - rPx - 16;
        otrezok(ctx, ax0 - 9, ay0, lx + 3, ay0, 'rgba(' + tone.ink + ',.5)', 1.2, [2, 4]);
        C.label(ctx, lx, ay0 + 6, 'мгновенная ось', 17, ink, 'right');
      }
    } else {
      C.label(ctx, cxs, cys + rPx + 60, 'оси нет', 18, muted, 'center');
    }
    ctx.restore();

    /* показания справа */
    var RX = 985;
    C.readout(ctx, RX, 34, 'ОСЬ НАД ДОРОГОЙ, м', os ? num(os.y, 3) : '—', ink);
    C.label(ctx, RX, 100, 'v₀ ' + num(v0, 2) + ' м/с, ωR ' + num(WR, 2) + ' м/с', 17, muted, 'right');
    C.readout(ctx, RX, 134, 'СКОРОСТЬ ТОЧКИ B, м/с', num(B.v, 3), CT);
    C.label(ctx, RX, 200, v0 > 0.02 ? num(B.v / v0, 2) + ' v₀' : num(B.v / WR, 2) + ' ωR', 17, muted, 'right');
    C.readout(ctx, RX, 234, 'ДО ОСИ, м', os ? num(S.B.d, 3) : '—', ink);
    C.label(ctx, RX, 300, os ? num(S.B.d / R, 2) + ' R' : '', 17, muted, 'right');
    /* в точке перегиба следа (проскальзывание вперёд, s > 1) радиус кривизны уходит
       в бесконечность, и числа обоих путей перестают что-либо значить */
    var peregib = !(B.rho < 1000);
    C.readout(ctx, RX, 334, 'РАДИУС КРИВИЗНЫ СЛЕДА, м', peregib ? '∞' : num(B.rho, 3), CR);
    C.label(ctx, RX, 400, peregib ? 'точка перегиба' : num(B.rho / R, 2) + ' R', 17, muted, 'right');
    C.label(ctx, RX, 436, peregib ? 'след здесь почти прямой' : 'два пути, расхождение ' + poryadok(S.B.rhoDiff) + ' м', 17, muted, 'right');
  }

  var ref = C.useStage(W, HGT, step, draw);

  /* __demoTick двигает модель и на паузе: автопроверке не нужно сперва нажимать
     «Пуск». Один тик на dt секунд сдвигает модель на dt·SLOWMO, как в других демках. */
  useEffect(function () {
    var orig = window.__demoTick;
    if (!orig) return;
    window.__demoTick = function (dt, n) {
      st.force = true;
      try { return orig(dt, n); } finally { st.force = false; }
    };
  }, []);

  /* ── управление ── */

  function izmeniU(v) {
    st.u = C.clamp(Math.round(v * 100) / 100, -WR, WR);
    izm(); sinhro();
  }
  function vesti(deg) {
    var tgt = deg * Math.PI / 180;
    var cur = ((OM * st.t + Math.PI) % TWO_PI + TWO_PI) % TWO_PI - Math.PI;
    var d = tgt - cur;
    st.t += d / OM; st.xC += (WR + st.u) * d / OM;
    st.run = false; izm(); sinhro(deg);
  }
  function pusk() { st.run = !st.run; izm(); sinhro(); }
  function sloy(key) { st.sl[key] = !st.sl[key]; izm(); sinhro(); }

  /* ── строка под сценой ── */

  function slova() {
    var S = st.S, A = function (t) { return '<span class="accent">' + t + '</span>'; };
    var u = S.slip, os = S.os, B = S.B, out = [];
    var kachenie = Math.abs(u) < 0.005;
    var naVerhu = Math.abs(S.psiDeg) < 1;
    if (kachenie) {
      if (naVerhu) {
        out.push('Колесо катится без проскальзывания: точка касания стоит, это мгновенная ось. Точка B наверху идёт со скоростью ' +
          A(num(B.v, 2) + ' м/с') + ', то есть ' + kx('2v_0') + ', до оси ' + A(num(B.d, 2) + ' м') + ', то есть ' + kx('2R') +
          '. Окружность, прилегающая к её следу, имеет радиус ' + A(num(B.rho, 2) + ' м') + ', то есть ' + kx('4R') +
          ', и центр на продолжении отрезка от B через ось, вдвое дальше.');
      } else {
        out.push('Колесо катится без проскальзывания, ось в точке касания. Скорость точки B ' + A(num(B.v, 2) + ' м/с') +
          ' перпендикулярна отрезку до оси и равна ' + kx('\\omega d') + ' при ' + kx('d') + ' = ' + A(num(B.d, 2) + ' м') +
          '; радиус кривизны следа ' + A(num(B.rho, 2) + ' м') +
          (Math.abs(B.rhoOverD - 2) < 0.005 ? ', вдвое больше ' + kx('d') + '.' : '.'));
      }
    } else {
      out.push((u > 0 ? 'Колесо идёт юзом: центр едет быстрее, чем обод крутится, поэтому точка касания скользит по дороге вперёд со скоростью '
                      : 'Колесо буксует: обод крутится быстрее, чем едет центр, поэтому точка касания скользит по дороге назад со скоростью ') +
        A(num(Math.abs(u), 2) + ' м/с') + '.');
      if (!os) out.push('Скорости всех точек одинаковы, оси нет.');
      else {
        if (os.y < -0.005) out.push('Скорость ноль у точки на ' + A(num(-os.y, 2) + ' м') + ' ниже дороги, вне колеса: мгновенная ось ушла из точки касания.');
        else if (Math.abs(os.y - R) < 0.005) out.push('Центр стоит, ось проходит через него: колесо крутится на месте, окружность кривизны совпала с ободом.');
        else out.push('Скорость ноль у точки на ' + A(num(os.y, 2) + ' м') + ' над дорогой, внутри колеса: мгновенная ось ушла из точки касания.');
        out.push('Правило осталось: скорость точки B ' + A(num(B.v, 2) + ' м/с') + ' перпендикулярна отрезку до оси и равна ' +
          kx('\\omega d') + ' при ' + kx('d') + ' = ' + A(num(B.d, 2) + ' м') + '.');
      }
    }
    if (st.sl.a) {
      out.push('Ускорение каждой точки обода идёт к центру и равно ' + kx('\\omega^2 R') + ' = ' + A(num(S.aRim, 2) + ' м/с²') +
        ', пока ' + kx('v_0') + ' постоянна; у точки касания скорость ноль, а ускорение нет. Серый пунктир у B показывает, ' +
        'куда оно смотрело бы при вращении вокруг оси.');
    }
    return out.join(' ');
  }

  return html`
    <div class="demo">
      <div class="controls">
        <${C.Group} label="Слои:">
          <${C.Btn} active=${ui.v} onClick=${function () { sloy('v'); }}>Скорости<//>
          <${C.Btn} active=${ui.a} onClick=${function () { sloy('a'); }}>Ускорения<//>
          <${C.Btn} active=${ui.rho} onClick=${function () { sloy('rho'); }}>Кривизна следа<//>
        <//>
        <${C.Slider} label="Проскальзывание:" min=${-WR} max=${WR} step=${0.01} value=${ui.u}
                     display=${(ui.u > 0.004 ? '+' : ui.u < -0.004 ? '−' : '') + num(Math.abs(ui.u), 2) + ' м/с'}
                     onChange=${izmeniU} />
        <${C.Group}>
          <${C.Btn} active=${Math.abs(ui.u) < 0.005} onClick=${function () { izmeniU(0); }}>Качение<//>
        <//>
        <${C.Slider} label="Поворот:" min=${-180} max=${180} step=${1} value=${ui.psi}
                     display=${num(ui.psi, 0) + '°'} onChange=${vesti} />
        <${C.Group}>
          <${C.Btn} action=${true} onClick=${function () { vesti(0); }}>К верху<//>
          <${C.Btn} onClick=${pusk}>${ui.run ? 'Пауза' : 'Пуск'}<//>
        <//>
      </div>
      <canvas class="stage" ref=${ref}></canvas>
      <${C.Status} html=${slova()} />
    </div>`;
}

C.mount(Mgnovennaya);
</script>
</body>
</html>
