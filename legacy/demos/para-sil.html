<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пара сил трения в двух системах отсчёта</title>
<link rel="stylesheet" href="../shared/demo.css">
</head>
<body>
<div id="root"></div>
<!-- возврат к неделе: виден только вне iframe колоды -->
<a class="demo-back" href="/week-04/">&larr; Неделя 04</a>
<script>if (window.self !== window.top) document.querySelector('.demo-back').hidden = true;</script>

<script src="../shared/vendor/react.production.min.js"></script>
<script src="../shared/vendor/react-dom.production.min.js"></script>
<script src="../shared/vendor/htm.js"></script>
<script src="../shared/demo-core.js"></script>

<script>
'use strict';
var C = window.DemoCore, html = C.html;
var useRef = React.useRef, useState = React.useState;

/* ══════════════════ физика ══════════════════

   Блок главы `rabota-vnutrennih-sil`, тезис первого акта: силы пары равны
   и противоположны, в импульсе они сокращаются, в работе остаются, и
   работа пары одна у всех наблюдателей. Написана генеральной сессией
   15.09 (билдера оборвал лимит), бриф briefs/demki_nedelya04.md, № 1.

   ЧИСЛА ИЗ ГЛАВЫ. Лента идёт с постоянной скоростью u = 1,5 м/с, её
   держит мотор. Коробку массой 2 кг кладут на ленту без начальной
   скорости, коэффициент трения 0,4, g = 9,81 м/с². Пока коробка
   скользит, сила трения μmg тянет её вперёд, а ленту с той же силой назад;
   мотор, чтобы лента не сбавила ход, тянет её вперёд той же силой.
   Скольжение длится u/(μg) ≈ 0,382 с, коробка проходит u²/(2μg) ≈ 0,287 м,
   лента вдвое больше. В системе земли: над коробкой +2,25 Дж, над лентой
   −4,50 Дж, пара −2,25 Дж, мотор +4,50 Дж, тепло 2,25 Дж. Для
   наблюдателя со скоростью V: над коробкой 2,25 − 3V, над лентой
   −4,5 + 3V, мотор 4,5 − 3V, пара −2,25 при любом V. От μ не зависит ни
   одна работа: от него зависит только время скольжения.

   СЧЁТ. Сила постоянна на скольжении и нулевая после, скорости внутри
   шага линейны, и работы копятся точно, как ∫F·v dt со скоростью тела у
   наблюдателя. Шаг, в котором коробка догоняет ленту, делится на две
   части в момент догона, иначе хвост силы на лишнюю долю шага испортил
   бы четвёртый знак. Опыт идёт до конца скольжения и ещё полсекунды. */

var M = 2;                               /* кг, коробка */
var U = 1.5;                             /* м/с, лента */
var G = 9.81;                            /* м/с² */
var MU0 = 0.4;                           /* коэффициент трения главы */
var H = 1 / 2400;                        /* с, шаг */
var T_POSLE = 0.5;                       /* с, сколько идёт опыт после догона */
var V_MIN = -3, V_MAX = 3;               /* м/с, ползунок наблюдателя */

function tSkolzh(mu) { return U / (mu * G); }
function nKon(mu) { return Math.ceil((tSkolzh(mu) + T_POSLE) / H); }

function novaya(V, mu) {
  return { V: V, mu: mu, n: 0, t: 0, xb: 0, vb: 0, xl: 0, slip: true,
           aBox: 0, aBelt: 0, aMotor: 0, sRel: 0 };
}

/* Участок постоянной силы F длительностью dt: скорость коробки линейна,
   средняя на участке точно равна полусумме концов. */
function uchastok(m, F, dt) {
  if (dt <= 0) return;
  var vb0 = m.vb, vb1 = vb0 + F / M * dt, vsr = (vb0 + vb1) / 2;
  m.xb += vsr * dt;
  m.xl += U * dt;
  m.aBox += F * (vsr - m.V) * dt;        /* сила на коробку, скорость коробки у наблюдателя */
  m.aBelt += -F * (U - m.V) * dt;        /* та же сила назад на ленту */
  m.aMotor += F * (U - m.V) * dt;        /* мотор держит ленту той же силой вперёд */
  m.sRel += (U - vsr) * dt;              /* сдвиг ленты относительно коробки */
  m.vb = vb1;
}

function shag(m) {
  if (m.n >= nKon(m.mu)) return;
  if (m.slip) {
    var F = m.mu * M * G;
    var tDo = (U - m.vb) / (F / M);      /* сколько осталось до догона */
    if (tDo <= H) {
      uchastok(m, F, tDo);
      m.vb = U; m.slip = false;
      uchastok(m, 0, H - tDo);
    } else uchastok(m, F, H);
  } else uchastok(m, 0, H);
  m.n++; m.t = m.n * H;
}

function progon(V, mu, n) {
  var m = novaya(V, mu);
  for (var i = 0; i < n; i++) shag(m);
  return m;
}

function svodka(m) {
  var F = m.mu * M * G;
  return {
    t: m.t, V: m.V, mu: m.mu,
    vBox: m.vb - m.V, vBelt: U - m.V,
    sRel: m.sRel,
    workBox: m.aBox, workBelt: m.aBelt,
    workPair: m.aBox + m.aBelt,
    workMotor: m.aMotor,
    heat: F * m.sRel,
    slipping: m.slip && m.n > 0,
    tSlip: tSkolzh(m.mu),
    done: m.n >= nKon(m.mu)
  };
}

/* Размах коробки у наблюдателя за весь опыт: по нему ставится камера. */
function razmah(V, mu) {
  var m = novaya(V, mu), lo = 0, hi = 0, n = nKon(mu);
  for (var i = 0; i < n; i++) {
    shag(m);
    var x = m.xb - V * m.t;
    lo = Math.min(lo, x); hi = Math.max(hi, x);
  }
  return { lo: lo, hi: hi };
}

/* ══════════════════ сцена ══════════════════

   Сверху лента глазами наблюдателя: полотно с шевронами, которые едут
   вместе с лентой, и коробка на ней. Камера охватывает весь путь коробки
   у выбранного наблюдателя. Под лентой четыре счётчика работы и строка
   тепла. Коробка нарисована крупнее масштаба: на полосе в несколько
   метров тридцатисантиметровый ящик был бы едва виден. */

var W = 1000, HGT = 440;
var X0 = 90, X1 = 910;
var Y_BELT = 150;
var TAU = 6.2832;
var SHAG_SHEVRONA = 0.3;                 /* м между шевронами */

function num(v, d) {
  if (Math.abs(v) < 0.5 * Math.pow(10, -d)) v = 0;
  return v.toFixed(d).replace('.', ',').replace('-', '−');
}
function sZnakom(v, d) {
  var s = num(v, d);
  return (v > 0 && s !== num(0, d)) ? '+' + s : s;
}

function ParaSil() {
  var ref0 = useRef(null);
  if (!ref0.current) {
    ref0.current = { V: 0, mu: MU0, m: novaya(0, MU0), run: false, kadr: razmah(0, MU0), sv: null };
  }
  var S = ref0.current;
  var pair = useState({ run: false, V: 0, mu: MU0, done: false });
  var ui = pair[0], setUi = pair[1];

  function pokazaniya() {
    var s = svodka(S.m);
    s.run = S.run;
    S.sv = s;
    window.__demoState = s;
  }
  if (!S.sv) pokazaniya();

  /* подпись под рисунком перерисовывается, когда меняется её смысл:
     коробку отпустили, коробка догнала ленту, опыт кончился */
  function faza(m) { return m.n === 0 ? 'start' : m.slip ? 'skolzit' : 'edet'; }

  function step(dt) {
    if (!S.run) return;
    var k = Math.round(dt / H), bylo = faza(S.m);
    for (var i = 0; i < k; i++) shag(S.m);
    if (S.m.n >= nKon(S.mu)) {
      S.run = false;
      setUi({ run: false, V: S.V, mu: S.mu, done: true });
    } else if (faza(S.m) !== bylo) {
      setUi({ run: true, V: S.V, mu: S.mu, done: false });
    }
    pokazaniya();
  }

  function draw(ctx) {
    var tone = C.tones(ctx);
    var ink = tone.ink, muted = tone.muted, acc = tone.accent;
    var m = S.m, V = S.V, sv = S.sv;
    var lo = S.kadr.lo, hi = S.kadr.hi;
    var pad = Math.max(0.6, 0.12 * (hi - lo));
    lo -= pad; hi += pad;
    if (hi - lo < 2.4) { var c = (lo + hi) / 2; lo = c - 1.2; hi = c + 1.2; }
    function sx(x) { return X0 + (x - lo) / (hi - lo) * (X1 - X0); }
    var mut = 'rgba(' + muted + ',.95)';

    /* Полотно ленты и два барабана. */
    C.roundRect(ctx, X0 - 40, Y_BELT, X1 - X0 + 80, 18, 9);
    ctx.fillStyle = 'rgba(' + ink + ',.10)'; ctx.fill();
    ctx.strokeStyle = 'rgba(' + ink + ',.5)'; ctx.lineWidth = 2; ctx.stroke();
    [X0 - 31, X1 + 31].forEach(function (x) {
      ctx.beginPath(); ctx.arc(x, Y_BELT + 9, 8, 0, TAU);
      ctx.strokeStyle = 'rgba(' + ink + ',.6)'; ctx.stroke();
    });
    /* Шевроны едут вместе с лентой: её точка, стоявшая в нуле, у
       наблюдателя сейчас в xl − V·t. */
    var xl = m.xl - V * m.t;
    var sd = ((xl - lo) % SHAG_SHEVRONA + SHAG_SHEVRONA) % SHAG_SHEVRONA;
    ctx.strokeStyle = 'rgba(' + muted + ',.8)'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (var x = lo + sd; x <= hi; x += SHAG_SHEVRONA) {
      var px = sx(x);
      ctx.moveTo(px - 4, Y_BELT + 4); ctx.lineTo(px + 2, Y_BELT + 9); ctx.lineTo(px - 4, Y_BELT + 14);
    }
    ctx.stroke();

    /* Коробка. */
    var xb = sx(m.xb - V * m.t);
    C.roundRect(ctx, xb - 28, Y_BELT - 52, 56, 52, 5);
    ctx.fillStyle = 'rgba(224,138,82,.9)'; ctx.fill();
    C.label(ctx, xb, Y_BELT - 62, '2 кг', 17, 'rgb(224,138,82)');

    /* Силы трения, пока коробка скользит: на коробку вперёд, на ленту назад. */
    if (sv.slipping && !sv.done) {
      ctx.strokeStyle = 'rgb(' + acc + ')'; ctx.fillStyle = 'rgb(' + acc + ')'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(xb, Y_BELT - 26); ctx.lineTo(xb + 50, Y_BELT - 26); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(xb + 60, Y_BELT - 26); ctx.lineTo(xb + 48, Y_BELT - 33);
      ctx.lineTo(xb + 48, Y_BELT - 19); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(xb, Y_BELT + 28); ctx.lineTo(xb - 50, Y_BELT + 28); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(xb - 60, Y_BELT + 28); ctx.lineTo(xb - 48, Y_BELT + 21);
      ctx.lineTo(xb - 48, Y_BELT + 35); ctx.closePath(); ctx.fill();
      C.label(ctx, xb + 64, Y_BELT - 20, 'трение на коробку', 17, 'rgb(' + acc + ')', 'left');
      C.label(ctx, xb - 64, Y_BELT + 34, 'на ленту', 17, 'rgb(' + acc + ')', 'right');
    }

    C.label(ctx, X0 - 40, 30, V === 0 ? 'наблюдатель стоит на земле' :
            Math.abs(V - U) < 1e-9 ? 'наблюдатель едет вместе с лентой' :
            'наблюдатель едет со скоростью ' + num(V, 1) + ' м/с', 18, mut, 'left');
    C.label(ctx, X1 + 40, 30, 'коробка ' + num(sv.vBox, 2) + ' м/с, лента ' + num(sv.vBelt, 2) + ' м/с',
            18, mut, 'right');

    /* ── счётчики работы ── */
    C.label(ctx, W / 2, 246, 'работа за опыт, Дж', 18, mut);
    var cols = [
      [250, 'над коробкой', sZnakom(sv.workBox, 2), 'rgb(224,138,82)'],
      [460, 'над лентой', sZnakom(sv.workBelt, 2), 'rgb(77,182,198)'],
      [670, 'пара', sZnakom(sv.workPair, 2), 'rgb(' + acc + ')'],
      [880, 'мотор', sZnakom(sv.workMotor, 2), 'rgb(' + ink + ')']
    ];
    cols.forEach(function (c) { C.readout(ctx, c[0], 280, c[1], c[2], c[3]); });
    C.label(ctx, W / 2, 380, 'во внутреннюю энергию ' + num(sv.heat, 2) + ' Дж · относительный сдвиг ' +
            num(sv.sRel, 3) + ' м · скольжение ' + num(sv.tSlip, 3) + ' с', 18, mut);
  }

  var ref = C.useStage(W, HGT, step, draw);

  window.__demoModel = { novaya: novaya, shag: shag, progon: progon, svodka: svodka,
                         razmah: razmah, tSkolzh: tSkolzh, nKon: nKon, H: H };
  window.__demoRun = function (V, mu) {
    var mm = mu == null ? MU0 : mu;
    return svodka(progon(V, mm, nKon(mm)));
  };

  function sbros() {
    S.m = novaya(S.V, S.mu); S.run = false; S.kadr = razmah(S.V, S.mu);
    pokazaniya();
    setUi({ run: false, V: S.V, mu: S.mu, done: false });
  }
  function pusk() {
    if (S.m.n >= nKon(S.mu)) S.m = novaya(S.V, S.mu);
    S.run = !S.run;
    pokazaniya();
    setUi({ run: S.run, V: S.V, mu: S.mu, done: false });
  }
  /* Смена наблюдателя на ходу: опыт тот же, интегралы пересчитываются с
     начала для нового V. */
  function nablyudatel(V) {
    V = Math.round(V * 10) / 10;
    S.V = V;
    S.m = progon(V, S.mu, S.m.n);
    S.kadr = razmah(V, S.mu);
    pokazaniya();
    setUi({ run: S.run, V: V, mu: S.mu, done: S.m.n >= nKon(S.mu) });
  }
  function trenie(mu) {
    S.mu = Math.round(mu * 20) / 20;
    sbros();
  }

  function slova() {
    var A = function (s) { return '<span class="accent">' + s + '</span>'; };
    var sv = S.sv;
    if (S.m.n === 0) {
      return 'Лента идёт со скоростью ' + A('1,5 м/с') + ', её держит мотор. Коробку ' + A('2 кг') +
        ' кладут на ленту без скорости, коэффициент трения ' + A(num(S.mu, 2)) +
        '. «Пуск» отпускает коробку.';
    }
    if (!sv.done && sv.slipping) {
      return 'Коробка скользит: трение тянет её вперёд, а ленту с той же силой назад. ' +
        'Пара сил не меняет суммарный импульс коробки и ленты, а работа пары копится на относительном сдвиге.';
    }
    var s = 'Над коробкой ' + A(sZnakom(sv.workBox, 2) + ' Дж') + ', над лентой ' +
      A(sZnakom(sv.workBelt, 2) + ' Дж') + ', пара ' + A(sZnakom(sv.workPair, 2) + ' Дж') +
      ', ровно столько ушло во внутреннюю энергию. ';
    if (S.V === 0) s += 'Мотор заплатил ' + A(num(sv.workMotor, 2) + ' Дж') +
      ': половина в движение коробки, половина во внутреннюю энергию. Пересадите наблюдателя на ленту.';
    else s += 'Работы над каждым телом у этого наблюдателя свои, работа пары та же, что у земли.';
    return s;
  }

  return html`
    <div class="demo">
      <div class="controls">
        <${C.Group}>
          <${C.Btn} action=${true} onClick=${pusk}>${ui.run ? 'Пауза' : 'Пуск'}<//>
          <${C.Btn} onClick=${sbros}>Сброс<//>
        <//>
        <${C.Group} label="Наблюдатель:">
          <${C.Btn} active=${ui.V === 0} onClick=${function () { nablyudatel(0); }}>земля<//>
          <${C.Btn} active=${Math.abs(ui.V - U) < 1e-9} onClick=${function () { nablyudatel(U); }}>лента<//>
        <//>
        <${C.Slider} label="Скорость наблюдателя:" min=${V_MIN} max=${V_MAX} step=${0.1}
                     value=${ui.V} onChange=${nablyudatel} display=${num(ui.V, 1) + ' м/с'} />
        <${C.Slider} label="Трение μ:" min=${0.1} max=${1} step=${0.05}
                     value=${ui.mu} onChange=${trenie} display=${num(ui.mu, 2)} />
      </div>
      <canvas class="stage" ref=${ref}></canvas>
      <${C.Status} html=${slova()} />
    </div>`;
}

C.mount(ParaSil);
</script>
</body>
</html>
