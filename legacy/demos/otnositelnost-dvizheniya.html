<script>
'use strict';
var C = window.DemoCore, html = C.html;
var useRef = React.useRef, useState = React.useState;

/* ══════════════════ физика ══════════════════

   Блок главы `otnositelnost-dvizheniya`, третья договорённость. Пока тело
   отсчёта не названо, у слова «движется» нет содержания; рисунка у блока
   нет вовсе, и до сих пор это место держалось словами лектора.

   Считать здесь нечего сверх одного вычитания, и ровно поэтому вычитание
   делается честно, а не печатается готовым. Три участника идут по прямому
   шоссе с постоянными скоростями

       u₁ = 100 км/ч,   u₂ = ползунок (80…120 км/ч),   u_ф = 0,

   их координаты интегрируются по времени, и скорость участника i
   относительно выбранного тела r снимается с этого прогона как приращение
   разности координат, делённое на время:

       v(i отн. r) = Δ(x_i − x_r) / Δt.

   Ни одно из тел при этом не выделено. Тройка u выписана в осях, где фонарь
   стоит, но это бухгалтерия: в каждое показание входит разность координат,
   и общая добавка ко всем трём скоростям из неё выпадает. Это проверяется,
   а не утверждается — __demoCheck(тело, u₂, boost) гоняет ту же модель,
   прибавив ко всем скоростям boost м/с, и обязан вернуть те же три числа.

   ОПОРНЫЕ ТОЧКИ ИЗ ТЕКСТА ГЛАВЫ. При u₂ = 100 и теле отсчёта «первая
   машина» вторая стоит (0 км/ч), а относительно фонаря идёт 100. При
   u₂ = 110 вторая ползёт вперёд на 10, относительно фонаря идёт 110. Если
   тело отсчёта — вторая машина, фонарь уезжает назад на −110 км/ч, и это
   число верно наравне с остальными.

   ЧЕГО ЗДЕСЬ НЕТ. Ускорений: скорости постоянны, а ползунок задаёт скорость
   второй машины, а не разгоняет её. Причины движения появятся через неделю,
   и намёк на них здесь сломал бы границу главы. Скорости складываются
   просто, и оговорка о том, когда простого сложения мало, уже прозвучала на
   первой договорённости. */

/* ── числа модели ── */

var KMH = 1 / 3.6;                 /* метров в секунду на один км/ч */
var V1 = 100;                      /* км/ч, первая машина; число главы, не двигается */
var V2_MIN = 80, V2_MAX = 120, V2_SHAG = 5, V2_NACH = 100;

/* Цвета данных: от темы не зависят, как у остальных демок недели. Взяты из
   палитры рисунков главы — бирюза, лайм, охра. Фонарю досталась охра:
   тёплый свет читается как свет, а не как ещё одна машина. */
var C1 = '77,182,198';             /* первая машина */
var C2 = '134,171,46';             /* вторая машина */
var CF = '224,138,82';             /* фонарь */

var UCH = [
  { imya: 'первая машина', korotko: 'первая', capt: 'ПЕРВАЯ МАШИНА, КМ/Ч', rgb: C1 },
  { imya: 'вторая машина', korotko: 'вторая', capt: 'ВТОРАЯ МАШИНА, КМ/Ч', rgb: C2 },
  { imya: 'фонарь',        korotko: 'фонарь', capt: 'ФОНАРЬ, КМ/Ч',        rgb: CF }
];

/* ── измерение ───────────────────────────────────────────────
   Показания снимаются с прогона модели, а не выписываются как u_i − u_r.
   Прогон свой: те же уравнения интегрируются заново со своего нуля, и от
   нарисованной модели он независим — тем и годится в проверку. Совпадение
   с живыми координатами меряно, расхождение не выходит за 3·10⁻¹¹ км/ч.

   Отрезок в две секунды и 480 шагов на нём взяты с запасом: движение
   равномерное, и метод здесь ошибки не вносит вовсе, накапливается только
   сложение в последних знаках. По всей сетке (три тела на девять положений
   ползунка) худшее расхождение с формулой 1,3·10⁻¹² км/ч, то есть порядок
   10⁻¹²; ближе к 10⁻¹³ счёт держится только в лёгких случаях. Показания
   сравниваются с формулой в __demoState.rashozhdenie, и это число обязано
   быть нулём в пределах счёта. */

var TIZM = 2, NIZM = 480;

function progon(v2, ref, boost) {
  var u = [V1 * KMH + boost, v2 * KMH + boost, boost];
  var x = [0, 0, 0], h = TIZM / NIZM, i, s;
  for (s = 0; s < NIZM; s++) for (i = 0; i < 3; i++) x[i] += u[i] * h;
  var out = [];
  for (i = 0; i < 3; i++) out[i] = (x[i] - x[ref]) / TIZM / KMH;
  return out;
}

/* Та же тройка, выписанная формулой. В счёт не идёт, нужна для сверки. */
function poFormule(v2, ref) {
  var u = [V1, v2, 0];
  return [u[0] - u[ref], u[1] - u[ref], u[2] - u[ref]];
}

/* Русская запятая и настоящий минус; остатки счёта в последних знаках
   печатались бы как «−0», а ноль есть ноль. */
function num(v, d) {
  if (Math.abs(v) < 0.5 * Math.pow(10, -d)) v = 0;
  return v.toFixed(d).replace('.', ',').replace('-', '−');
}

/* Знак в показаниях не украшение: он говорит, в какую сторону вдоль шоссе.
   У нуля знака нет, и это главное число кадра. */
function znak(v) {
  var s = num(v, 0);
  return s === '0' ? '0' : (v > 0 ? '+' + s : s);
}

/* ══════════════════ сцена ══════════════════

   Вид сверху: две полосы шоссе и обочина под ними. Сцена перерисовывается
   так, как её видит наблюдатель, привязанный к выбранному телу, — выбранное
   тело стоит на месте, а мимо едет всё остальное, включая асфальт с
   разметкой и фонарь на обочине. Иначе разница между телами отсчёта
   осталась бы разговором: движение-то одно.

   МИР ПЕРИОДИЧЕН. Фонари стоят вдоль обочины через шаг L, и пара машин
   повторяется с тем же шагом. Без периодичности сцена пустела бы через
   четыре с половиной секунды: ровно за это время при 100 км/ч фонарь
   пролетает окно насквозь.

   ШАГ РАВЕН ОКНУ МИНУС ГАШЕНИЕ, и это главное число раскладки. Первая
   редакция брала шаг шире окна (140 м против 125 м), чтобы в кадре никогда
   не висело двух экземпляров разом. Цена такого выбора — зазор: уходящий
   экземпляр уже погас, следующий ещё не пришёл, и в полосе пусто. Зазор
   постоянен в пикселях (84 px), а во времени растёт обратно относительной
   скорости: при 100 км/ч это полсекунды из пяти, при 10 км/ч — пять с
   половиной секунд из пятидесяти. Вторая цифра и есть приговор такому
   шагу. Главный кадр главы — тело отсчёта «первая машина», ползунок 110 —
   стоит ровно на десятке: показания печатают «+10», а машины в полосе в
   это время нет вовсе. Найдено аудитом 08.09, до того зазор считался
   украшением.

   При шаге PER = OKNO − FADE уходящий экземпляр гаснет у левой кромки
   ровно с той скоростью, с какой сосед разгорается у правой, и сумма их
   прозрачностей всё время равна единице. В кадре поэтому всегда ровно один
   экземпляр: либо один яркий, либо тот же самый, поделённый между двумя
   кромками. Полоса не пустеет ни на кадр, двух ярких копий разом не
   бывает, и показания нечем опровергнуть. Подпись и стрелка едут на каждом
   экземпляре со своей прозрачностью — иначе на стыке они перепрыгивали бы
   через весь кадр.

   Края окна гасятся прозрачностью (см. kraj и gradient): у самой кромки
   всё растворяется, а не обрезается, включая стрелки скоростей, которые
   при ста километрах в час длиннее ста пикселей и у края не помещаются.

   МАСШТАБ ВДОЛЬ И ПОПЕРЁК РАЗНЫЙ. Вдоль шоссе он честный, 5,6 px на метр, и
   только он что-то значит: по нему считаются все места и все смещения.
   Поперёк полосы растянуты, иначе на слайде не разобрать, какая
   машина в какой полосе. Кузов и вовсе нарисован крупнее натурального (44 на
   20 px — это 7,9 на 3,6 м): настоящая машина в четыре с половиной метра
   вышла бы кляксой в двадцать пять пикселей и с задних рядов пропала. Кузов
   здесь значок, а измерение — место его середины и то, как это место
   меняется со временем. */

/* Высота кадра и вся вертикальная раскладка сведены так, чтобы содержимое
   стояло в кадре по центру: сверху 42 px пусто и снизу столько же. Раньше
   HGT было 420 при содержимом от 91 до 392 — картинка сидела низко и
   съедала четверть отведённой ей высоты. */
var W = 1000, HGT = 400;
var RX0 = 24, RX1 = 724;           /* окно шоссе по горизонтали */
var ANCH = (RX0 + RX1) / 2;        /* место выбранного тела на экране */
var SC = 5.6;                      /* px на метр вдоль шоссе */
var OKNO = RX1 - RX0;
var FADE = 62;                     /* ширина гашения у краёв окна, px */
var PER = OKNO - FADE;             /* период мира в пикселях, см. выше */
var L = PER / SC;                  /* он же в метрах, 113,9 */

var ROAD_T = 80, ROAD_B = 244;     /* кромки асфальта */
var MID = 162;                     /* осевая */
var LAMP_Y = 236, LAMP_BASE = 284; /* лампа над кромкой и основание столба */
var Y_UCH = [121, 203, LAMP_BASE]; /* где живёт каждый участник */
var CAR_L = 44, CAR_W = 20;
var ARR = 1.15;                    /* px на км/ч в стрелках скорости */
var PODP_M = CAR_W / 2 + 12;       /* подпись машины — над кузовом */
/* Подпись фонаря — под основанием столба, и ниже пунктирного обвода
   выбранного тела: при отступе 27 дуга обвода садилась на верхушки букв. */
var PODP_F = 31;
var OTVES_T = 63, OTVES_B = 324;   /* отвес тела отсчёта, сверху и снизу */
var LIN_Y = 348;                   /* линейка «50 м» под сценой */

var RXC = 968;                     /* правый край столбца показаний */
/* Строки показаний стоят на высоте своих участников: число у дальней полосы,
   число у ближней, число у обочины. Так строка находится глазом без поисков. */
var ROW = [94, 176, 257];
var TAU = 6.2832;

function Otnositelnost() {
  var st = useRef({
    v2: V2_NACH, ref: 2, run: true, t: 0,
    /* координаты вдоль шоссе, м. Машины стартуют рядом, фонарь впереди. */
    x: [0, 0, 45],
    u: [V1 * KMH, V2_NACH * KMH, 0],
    pokaz: [0, 0, 0], formula: [0, 0, 0], rashozhdenie: 0
  }).current;
  var got = useRef({ est: false }).current;
  /* Пара берётся из одного вызова useState: два отдельных дают два
     независимых состояния, и рейка перестаёт отзываться на ползунок. */
  var pair = useState({ v2: V2_NACH, ref: 2, run: true });
  var ui = pair[0], setUi = pair[1];

  function perestroit() {
    st.u[1] = st.v2 * KMH;
    st.pokaz = progon(st.v2, st.ref, 0);
    st.formula = poFormule(st.v2, st.ref);
    var m = 0;
    for (var i = 0; i < 3; i++) m = Math.max(m, Math.abs(st.pokaz[i] - st.formula[i]));
    st.rashozhdenie = m;
  }
  if (!got.est) { got.est = true; perestroit(); }

  /* Время идёт в реальном темпе, скорости постоянны, поэтому шаг Эйлера
     здесь точен: приращение координаты за кадр равно u·dt без остатка. */
  function step(dt) {
    if (!st.run) return;
    st.t += dt;
    for (var i = 0; i < 3; i++) st.x[i] += st.u[i] * dt;
  }

  /* ── раскладка мира по экрану ── */

  /* Место мировой точки s на экране. Наблюдатель сидит в выбранном теле,
     поэтому от s вычитается место этого тела: стоит он, едет всё прочее. */
  function ekr(s) { return ANCH + (s - st.x[st.ref]) * SC; }

  /* Периодическая деталь дороги (разметка, риски обочины): все её
     экземпляры, попадающие в окно. Дорога покоится вместе с фонарём, и
     когда выбрана машина, весь узор уезжает назад. */
  function poUzoru(period, fn) {
    var base = st.x[st.ref];
    var s0 = base + (RX0 - ANCH) / SC, s1 = base + (RX1 - ANCH) / SC;
    var k = Math.floor(s0 / period) - 1;
    for (var s = k * period; s <= s1 + period; s += period) fn(ekr(s));
  }

  /* Основной экземпляр участника: тот из периодического ряда, что ближе всех
     к телу отсчёта. От него отсчитываются соседние копии; у выбранного тела
     разность координат равна нулю, поэтому оно стоит на отвесе и копий в
     кадре не имеет вовсе. */
  function osnovnoj(i) {
    var d = st.x[i] - st.x[st.ref];
    return ANCH + (d - L * Math.round(d / L)) * SC;
  }

  function kopii(i, fn) {
    var x = osnovnoj(i);
    for (var k = -1; k <= 1; k++) {
      var xx = x + k * PER;
      if (xx > RX0 - 70 && xx < RX1 + 70) fn(xx);
    }
  }

  /* Гашение у кромки окна: объект у самого края растворяется, а не
     обрезается пополам. Оно же держит стык между экземплярами: при шаге
     мира OKNO − FADE уходящий гаснет ровно с той скоростью, с какой
     приходящий разгорается. */
  function kraj(x) { return C.clamp(Math.min(x - RX0, RX1 - x) / FADE, 0, 1); }

  /* То же гашение для сплошных линий дороги, которые тянутся через всё окно. */
  function gradient(ctx, rgb, a) {
    var g = ctx.createLinearGradient(RX0, 0, RX1, 0), f = FADE / OKNO;
    g.addColorStop(0, 'rgba(' + rgb + ',0)');
    g.addColorStop(f, 'rgba(' + rgb + ',' + a + ')');
    g.addColorStop(1 - f, 'rgba(' + rgb + ',' + a + ')');
    g.addColorStop(1, 'rgba(' + rgb + ',0)');
    return g;
  }

  /* ── примитивы сцены ── */

  /* Остриё ужимается вместе со стрелкой. Полное остриё в тринадцать пикселей
     съедало короткую стрелку целиком, и десять километров в час относительно
     первой машины выходили такими же на вид, как ноль. А это ровно тот случай,
     ради которого глава и написана.

     kraska — заливка, а не цвет: стрелки сцены красятся оконным градиентом.
     Стрелка в сто километров в час длиннее ста пикселей, и у кромки окна она
     не помещается; резаный край выглядел бы поломкой, растворение — тем, что
     и есть, выходом за край кадра.

     Круглый торец нужен древку стрелки и больше никому, поэтому вся функция
     обёрнута в save/restore. Без обёртки lineCap утекал на весь остальной
     кадр: штрихи осевой, риски обочины и линейка «50 м» получали круглые
     концы и выходили длиннее объявленного, линейка — 282 px вместо 280. */
  function strelka(ctx, x0, x1, y, kraska, w) {
    var dl = Math.abs(x1 - x0), dir = x1 >= x0 ? 1 : -1;
    var gol = Math.min(13, Math.max(4, dl * 0.55));
    ctx.save();
    ctx.strokeStyle = kraska; ctx.fillStyle = kraska;
    ctx.lineWidth = w; ctx.lineCap = 'round';
    if (dl > gol) {
      ctx.beginPath();
      ctx.moveTo(x0, y); ctx.lineTo(x1 - dir * (gol - 1), y); ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(x1, y);
    ctx.lineTo(x1 - dir * gol, y - gol * 0.5);
    ctx.lineTo(x1 - dir * gol, y + gol * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  /* Подпись участника не выпускается за кромку окна: у края она обрезалась
     бы на середине числа («фонарь, −100 к»). Дальше кромки она не едет, а
     тело к этому времени уже гаснет, так что расхождение видно недолго. */
  function podpis(ctx, x, y, text, rgb) {
    ctx.font = '17px "Golos Text", system-ui, sans-serif';
    var pol = ctx.measureText(text).width / 2 + 6;
    C.label(ctx, C.clamp(x, RX0 + pol, RX1 - pol), y, text, 17, 'rgb(' + rgb + ')');
  }

  function mashina(ctx, x, y, rgb) {
    C.roundRect(ctx, x - CAR_L / 2, y - CAR_W / 2, CAR_L, CAR_W, 4.5);
    ctx.fillStyle = 'rgba(' + rgb + ',.92)'; ctx.fill();
    /* Лобовое стекло смотрит вправо всегда: куда машина повёрнута, от
       выбора тела отсчёта не зависит, вперёд по шоссе она идёт в любом. */
    C.roundRect(ctx, x + CAR_L / 2 - 12, y - CAR_W / 2 + 3, 7, CAR_W - 6, 2);
    ctx.fillStyle = 'rgba(8,12,20,.45)'; ctx.fill();
  }

  function fonar(ctx, x, muted) {
    /* Пятно света на асфальте: по нему видно, что фонарь стоит именно
       здесь, даже когда сам столб уехал к краю кадра. Пятно ужато против
       первой редакции (было 100 px при .17): на тёмном слайде оно читалось
       светом, а на светлом полотне главы охра такой плотности выглядела
       разводом на бумаге. Головке хватает своего ореола. */
    C.glow(ctx, x, MID + 20, 84, CF, .12);
    ctx.strokeStyle = 'rgba(' + muted + ',.85)'; ctx.lineWidth = 3.4;
    ctx.beginPath(); ctx.moveTo(x, LAMP_BASE); ctx.lineTo(x, LAMP_Y); ctx.stroke();
    ctx.fillStyle = 'rgba(' + muted + ',.9)';
    ctx.beginPath(); ctx.arc(x, LAMP_BASE, 6.5, 0, TAU); ctx.fill();
    C.glow(ctx, x, LAMP_Y, 27, CF, .55);
    ctx.fillStyle = 'rgb(' + CF + ')';
    ctx.beginPath(); ctx.arc(x, LAMP_Y, 8.5, 0, TAU); ctx.fill();
  }

  /* ── кадр ── */

  function draw(ctx) {
    var tone = C.tones(ctx);
    var ink = tone.ink, muted = tone.muted, acc = tone.accent;
    var i;

    /* Отвес тела отсчёта. Выбранное тело стоит на нём весь кадр, и это
       первое, чем демка отвечает на вопрос «движется ли эта машина».

       В строке подписи выбранного тела отвес прерывается. Подпись стоит на
       той же вертикали и той же краской, поэтому сплошной штрих читался не
       линией позади текста, а знаком внутри слова: «первая,|0 км/ч».
       Огрызок короче двенадцати пикселей не рисуется — от него остаётся
       висящая чёрточка, а не отвес. */
    var bl = st.ref < 2 ? Y_UCH[st.ref] - PODP_M : LAMP_BASE + PODP_F;
    ctx.save();
    ctx.setLineDash([7, 7]);
    ctx.strokeStyle = 'rgba(' + acc + ',.4)'; ctx.lineWidth = 1.6;
    ctx.beginPath();
    [[OTVES_T, bl - 17], [bl + 7, OTVES_B]].forEach(function (o) {
      if (o[1] - o[0] >= 12) { ctx.moveTo(ANCH, o[0]); ctx.lineTo(ANCH, o[1]); }
    });
    ctx.stroke();
    ctx.restore();
    C.label(ctx, ANCH, OTVES_T - 9, 'тело отсчёта', 17, 'rgba(' + acc + ',.95)');

    ctx.save();
    ctx.beginPath(); ctx.rect(RX0, 0, OKNO, HGT); ctx.clip();

    /* ── асфальт и разметка ──
       Всё это принадлежит дороге, то есть покоится вместе с фонарём. */
    ctx.fillStyle = gradient(ctx, ink, .085);
    ctx.fillRect(RX0, ROAD_T, OKNO, ROAD_B - ROAD_T);

    ctx.strokeStyle = gradient(ctx, ink, .38); ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(RX0, ROAD_T); ctx.lineTo(RX1, ROAD_T);
    ctx.moveTo(RX0, ROAD_B); ctx.lineTo(RX1, ROAD_B);
    ctx.stroke();

    /* Осевая: куски по 6 м через 6 м. Гладкая линия ползла бы незаметно, и
       без штрихов не было бы видно, что уезжает сам асфальт. */
    ctx.strokeStyle = gradient(ctx, ink, .3); ctx.lineWidth = 3;
    ctx.beginPath();
    poUzoru(12, function (x) { ctx.moveTo(x, MID); ctx.lineTo(x + 6 * SC, MID); });
    ctx.stroke();

    /* Риски обочины через 25 м: мелкий отсчёт для глаза; фонари стоят через
       весь период мира и одни на такую роль не годятся. */
    ctx.strokeStyle = gradient(ctx, muted, .5); ctx.lineWidth = 1.6;
    ctx.beginPath();
    poUzoru(25, function (x) { ctx.moveTo(x, ROAD_B); ctx.lineTo(x, ROAD_B + 9); });
    ctx.stroke();

    /* ── участники ── */
    kopii(2, function (x) {
      var a = kraj(x); if (a <= 0) return;
      ctx.save(); ctx.globalAlpha = a; fonar(ctx, x, muted); ctx.restore();
    });
    [0, 1].forEach(function (j) {
      kopii(j, function (x) {
        var a = kraj(x); if (a <= 0) return;
        ctx.save(); ctx.globalAlpha = a; mashina(ctx, x, Y_UCH[j], UCH[j].rgb); ctx.restore();
      });
    });

    /* ── скорости на сцене ──
       Стрелка у каждого участника показывает его скорость относительно
       выбранного тела: длина пропорциональна числу, направление — знаку.
       У выбранного тела стрелки нет, вместо неё стоит ноль.

       Подпись и стрелка едут на каждом экземпляре, а не на одном основном.
       Иначе на стыке, когда экземпляр уходит за кромку и его сменяет
       соседний, подпись перепрыгивала бы через весь кадр разом. */
    [0, 1, 2].forEach(function (i) {
      var y = Y_UCH[i], svoj = i === st.ref;
      var rgb = svoj ? acc : UCH[i].rgb, v = st.pokaz[i];
      kopii(i, function (x) {
        var a = kraj(x);
        if (a <= 0) return;
        ctx.save();
        ctx.globalAlpha = a;

        /* Имя и число одной подписью, и держится она за само тело. У острия
           стрелки числу не место: при ста километрах в час остриё уходит от
           машины на сто пятнадцать пикселей, у кромки окна вылезает наружу и
           обрезается на середине. */
        podpis(ctx, x, i < 2 ? y - PODP_M : LAMP_BASE + PODP_F,
               UCH[i].korotko + ', ' + znak(v) + ' км/ч', rgb);

        if (svoj) {
          /* Обвод у выбранного тела: оно стоит, и стрелки у него нет вовсе. */
          ctx.setLineDash([5, 5]);
          ctx.strokeStyle = 'rgba(' + acc + ',.85)'; ctx.lineWidth = 1.8;
          ctx.beginPath();
          if (i < 2) C.roundRect(ctx, x - CAR_L / 2 - 7, y - CAR_W / 2 - 7,
                                 CAR_L + 14, CAR_W + 14, 8);
          else ctx.arc(x, LAMP_BASE, 15, 0, TAU);
          ctx.stroke();
          ctx.setLineDash([]);
        } else {
          /* Длина стрелки пропорциональна числу, направление — знаку; шкала
             объявлена риской в левом верхнем углу. Ничего не подтягивается до
             заметного: рядом с фонарной стрелкой в сто десять километров в час
             десятка обязана выглядеть тем, что она есть. */
          var dir = v > 0 ? 1 : -1;
          var x0 = x + dir * ((i < 2 ? CAR_L / 2 : 13) + 7);
          var len = Math.abs(v) * ARR;
          if (len >= 3) strelka(ctx, x0, x0 + dir * len, y, gradient(ctx, rgb, 1), 3.4);
        }
        ctx.restore();
      });
    });
    ctx.restore();

    /* ── показания: три строки, по одной на участника ──
       Ноль выбранного тела стоит в его собственной строке, обведённой
       рамкой. Он и есть весь смысл кадра.

       Ширина рамки меряется, а не назначается: берётся то, что в строке
       шире, подпись или число, и поля слева и справа от него равны.
       Жёсткие 248 px сажали число впритык к правой кромке рамки, а слева
       оставляли от шестидесяти до ста тридцати пикселей пустоты. Рамка в
       кадре всегда одна и меряется по своей строке. Шрифты обязаны
       совпадать с теми, которыми печатает C.readout. */
    var POLE = 14;
    function shirina(i) {
      var w1, w2;
      ctx.save();
      ctx.font = '600 15px "JetBrains Mono", ui-monospace, monospace';
      w1 = ctx.measureText(UCH[i].capt).width;
      ctx.font = '600 32px "JetBrains Mono", ui-monospace, monospace';
      w2 = ctx.measureText(znak(st.pokaz[i])).width;
      ctx.restore();
      return Math.max(w1, w2);
    }

    for (i = 0; i < 3; i++) {
      if (i === st.ref) {
        var wr = shirina(i);
        ctx.save();
        ctx.strokeStyle = 'rgba(' + acc + ',.5)'; ctx.lineWidth = 1.4;
        C.roundRect(ctx, RXC - wr - POLE, ROW[i] - 24, wr + 2 * POLE, 74, 10);
        ctx.stroke(); ctx.restore();
      }
      C.readout(ctx, RXC, ROW[i], UCH[i].capt, znak(st.pokaz[i]),
                i === st.ref ? 'rgb(' + acc + ')' : 'rgb(' + UCH[i].rgb + ')');
    }

    /* ── масштабные риски ──
       Стрелки меряются в км/ч, шоссе в метрах, и обе шкалы объявлены явно:
       иначе длина стрелки и смещение машины ничего не значат. */
    var mut = 'rgba(' + muted + ',.95)';
    strelka(ctx, RX0, RX0 + 100 * ARR, OTVES_T - 12, 'rgb(' + muted + ')', 2.6);
    C.label(ctx, RX0 + 100 * ARR + 12, OTVES_T - 6, '100 км/ч', 17, mut, 'left');

    /* Линейка меряется по расстоянию между засечками, и оно обязано быть
       ровно 50·SC = 280 px. Торцы здесь тупые: круглые прибавляли к полосе
       по пикселю с каждого конца и врали на 0,7%. */
    ctx.strokeStyle = mut; ctx.lineWidth = 2; ctx.lineCap = 'butt';
    ctx.beginPath();
    ctx.moveTo(RX0, LIN_Y); ctx.lineTo(RX0 + 50 * SC, LIN_Y);
    ctx.moveTo(RX0, LIN_Y - 6); ctx.lineTo(RX0, LIN_Y + 6);
    ctx.moveTo(RX0 + 50 * SC, LIN_Y - 6); ctx.lineTo(RX0 + 50 * SC, LIN_Y + 6);
    ctx.stroke();
    C.label(ctx, RX0 + 50 * SC + 12, LIN_Y + 6, '50 м', 17, mut, 'left');
  }

  var ref = C.useStage(W, HGT, step, draw);

  /* Объект показаний живёт весь сеанс и правится на месте: автопроверка
     читает его после __demoTick, когда рендера компонента не было. */
  window.__demoState = st;

  /* Проверка на месте. Первое: показания сняты с прогона, а не выписаны
     формулой, и обязаны с ней совпасть. Второе, важнее: с общей добавкой
     boost ко всем трём скоростям ответ не меняется вовсе — выбор осей, в
     которых ведётся счёт, в показания не входит. */
  window.__demoCheck = function (telo, v2, boost) {
    var r = telo == null ? st.ref : telo;
    var v = v2 == null ? st.v2 : v2;
    var b = boost || 0;
    var p = progon(v, r, b), f = poFormule(v, r), m = 0;
    for (var i = 0; i < 3; i++) m = Math.max(m, Math.abs(p[i] - f[i]));
    return { telo: UCH[r].imya, v2: v, boost: b, pokaz: p, formula: f, rashozhdenie: m };
  };

  function vzyat(i) {
    st.ref = i; perestroit();
    setUi({ v2: st.v2, ref: i, run: st.run });
  }
  function vesti(v) {
    st.v2 = Math.round(v); perestroit();
    setUi({ v2: st.v2, ref: st.ref, run: st.run });
  }
  function pusk() {
    st.run = !st.run;
    setUi({ v2: st.v2, ref: st.ref, run: st.run });
  }

  /* Строка показаний пересказывает кадр словами и меняется вместе с ним.
     Числа в неё подставляются те же, что напечатаны на сцене. */
  function slova(r, v2) {
    var d = v2 - V1;
    var A = function (s) { return '<span class="accent">' + s + '</span>'; };
    if (r === 2)
      return 'Тело отсчёта — фонарь на обочине. Мимо него первая машина идёт ' +
        A('100') + ' км/ч, вторая ' + A(String(v2)) + '. Эти числа и называют ' +
        'скоростью машины, когда тело отсчёта не называют вовсе.';
    if (r === 0)
      return 'Тело отсчёта — первая машина. ' +
        (d === 0
          ? 'Вторая стоит рядом, расстояние до неё не меняется, и надпись на её двери ' +
            'читается спокойно. '
          : 'Вторая ' + (d > 0 ? 'ползёт вперёд на ' : 'отстаёт на ') +
            A(String(Math.abs(d))) + ' км/ч, хотя относительно фонаря идёт ' +
            A(String(v2)) + '. ') +
        'Фонарь уезжает назад, и его скорость ' + A(znak(-V1)) + ' км/ч. ' +
        'Все три числа верны одновременно, каждое для своего тела.';
    return 'Тело отсчёта — вторая машина. ' +
      (d === 0
        ? 'Первая машина стоит рядом. '
        : 'Первая ' + (d > 0 ? 'отстаёт на ' : 'уходит вперёд на ') +
          A(String(Math.abs(d))) + ' км/ч. ') +
      'Фонарь уезжает назад со скоростью ' + A(znak(-v2)) + ' км/ч. Знак у него ' +
      'сменился оттого, что сменилось тело, а движение осталось прежним.';
  }

  return html`
    <div class="demo">
      <div class="controls">
        <${C.Group} label="Тело отсчёта:">
          ${UCH.map(function (u, i) { return html`
            <${C.Btn} key=${u.korotko} active=${ui.ref === i}
                      onClick=${function () { vzyat(i); }}>${u.korotko}<//>`; })}
        <//>
        <${C.Slider} label="Вторая машина:" min=${V2_MIN} max=${V2_MAX} step=${V2_SHAG}
                     value=${ui.v2} onChange=${vesti}
                     display=${ui.v2 + ' км/ч'} />
        <${C.Group}>
          <${C.Btn} action=${true} onClick=${pusk}>${ui.run ? 'Пауза' : 'Пуск'}<//>
        <//>
      </div>
      <canvas class="stage" ref=${ref}></canvas>
      <${C.Status} html=${slova(ui.ref, ui.v2)} />
    </div>`;
}

C.mount(Otnositelnost);
</script>
</body>
</html>
