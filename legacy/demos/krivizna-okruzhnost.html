<script>
'use strict';
var C = window.DemoCore, html = C.html;
var useRef = React.useRef, useState = React.useState;

/* ══════════════════ физика ══════════════════

   Неделя 02, блоки `normalnoe-i-tangencialnoe` и `radius-krivizny`,
   рисунок `ris-parabola-krivizna`.

   Числа взяты из исходника рисунка (pics/parabola_krivizna.tex) и
   пересчитаны здесь заново: v₀ = 10 м/с, α₀ = 45°, g = 9,81 м/с². Отсюда
   v_x = v₀·cos45° = 7,0711 м/с, парабола y = x − 0,0981x², дальность
   10,1937 м, вершина (5,0968; 2,5484).

   ГЛАВНОЕ УТВЕРЖДЕНИЕ ДЕМКИ. Радиус кривизны считается двумя маршрутами,
   и в любой точке они обязаны дать одно число. Маршруты различаются
   исходными данными ровно так, как в блоке `radius-krivizny`:

     первый  — известен закон движения r(t). Со скорости и ускорения
               снимаются a_t = (a·v)/v и a_n = |v × a|/v, дальше R = v²/a_n.
               Уравнение кривой не нужно;
     второй  — известно уравнение кривой y(x). Берутся y′ и y″, дальше
               R = (1 + y′²)^{3/2}/|y″|. Ни скорость, ни ускорение не нужны.

   Ни один маршрут не подставляет готовый ответ: производные берутся
   ЧИСЛЕННО, центральными разностями (шаг 0,01 с по времени и 0,01 м по
   координате). У параболы третья и четвёртая производные равны нулю,
   поэтому у центральной разности нет ошибки усечения, остаётся одно
   округление, порядка 10⁻¹⁰ м. Расхождение маршрутов печатается на сцене
   и лежит в __demoState — это и есть проверка, а не украшение.

   Что демка производит сверх этого. В вершине скорость горизонтальна,
   всё g идёт поперёк неё, и окружность там самая тесная на всей параболе,
   R_A = v_x²/g = 5,0968 м. При наклоне 25° (x = 7,4735) поперечная часть
   меньше, a_n = g·cos25° = 8,8909 м/с², вдоль скорости остаётся
   a_t = g·sin25° = 4,1459 м/с², и радиус вырастает до 6,8466 м. Вершинная
   окружность оставлена на сцене бледной: бегущая сравнивается с ней.

   __demoState — живой объект показаний: x, y, t, v, alfaDeg, an, at,
   R_kin, R_geom, dR, yp, ypp, cx, cy (центр кривизны), tx, ty, nx, ny.
   Две внутренние проверки лежат там же: tauDotN (τ ⊥ n) и a_nevyazka
   (сходится ли a = a_t·τ + a_n·n с самим ускорением). Автопроверка может
   поставить __demoState.x = 7.473535, дёрнуть __demoTick() и прочитать
   пересчитанные показания. */

var V0 = 10;                        /* начальная скорость, м/с */
var ALFA0 = Math.PI / 4;            /* угол броска 45° */
var G = 9.81;                       /* м/с² */
var VX = V0 * Math.cos(ALFA0);      /* 7,0710678 м/с, за полёт не меняется */
var VY0 = V0 * Math.sin(ALFA0);     /* начальная вертикальная, она меняется */
var TG0 = Math.tan(ALFA0);          /* тангенс угла броска, ровно 1 */
var KP = G / (2 * VX * VX);         /* 0,0981 1/м — коэффициент при x² */
var LEN = TG0 / KP;                 /* дальность 10,193680 м */
var XA = LEN / 2;                   /* вершина 5,096840 м */
var X25 = (TG0 + Math.tan(25 * Math.PI / 180)) / (2 * KP);  /* наклон 25° вниз */

var HT = 0.01;                      /* шаг численной производной по времени, с */
var HX = 0.01;                      /* шаг численной производной по координате, м */
var SLOWMO = 0.25;                  /* прогон вчетверо медленнее натуры: весь
                                       полёт длится 1,44 с, и глаз за ним
                                       не успевает */

/* Закон движения и уравнение кривой заданы порознь, каждый своим маршрутом.
   Совпадают они не по построению, а потому что описывают один полёт:
   подстановка t = x/v_x переводит одно в другое. */
function rx(t){ return VX * t; }
function ry(t){ return VY0 * t - G * t * t / 2; }
function yx(x){ return TG0 * x - KP * x * x; }

/* Все показания в точке x. Функция пишет их прямо в переданный объект:
   тот же объект лежит в window.__demoState, и автопроверке достаточно
   поменять в нём x. */
function izmerit(s){
  var x = s.x, t = x / VX;

  /* ── маршрут первый: скорость и ускорение с закона движения ── */
  var vx = (rx(t + HT) - rx(t - HT)) / (2 * HT);
  var vy = (ry(t + HT) - ry(t - HT)) / (2 * HT);
  var ax = (rx(t + HT) - 2 * rx(t) + rx(t - HT)) / (HT * HT);
  var ay = (ry(t + HT) - 2 * ry(t) + ry(t - HT)) / (HT * HT);
  var v = Math.sqrt(vx * vx + vy * vy);
  var at = (ax * vx + ay * vy) / v;             /* вдоль скорости, со знаком:
                                                   на подъёме тормозит */
  var an = Math.abs(vx * ay - vy * ax) / v;     /* поперёк, это |v × a|/v */
  var Rkin = v * v / an;

  /* ── маршрут второй: те же производные, но у кривой y(x) ── */
  var yp = (yx(x + HX) - yx(x - HX)) / (2 * HX);
  var ypp = (yx(x + HX) - 2 * yx(x) + yx(x - HX)) / (HX * HX);
  var Rgeo = Math.pow(1 + yp * yp, 1.5) / Math.abs(ypp);

  /* Единичная нормаль смотрит туда, куда изгибается кривая: знак берётся
     у второй производной, поэтому формула работает по обе стороны вершины
     и не требует знать, поднимается точка или падает. */
  var q = Math.sqrt(1 + yp * yp), sgn = ypp < 0 ? -1 : 1;
  s.nx = sgn * (-yp) / q;
  s.ny = sgn / q;
  s.tx = vx / v;
  s.ty = vy / v;

  s.y = yx(x);
  s.t = t;
  s.v = v;
  s.alfaDeg = Math.atan2(vy, vx) * 180 / Math.PI;   /* наклон скорости, со знаком */
  s.an = an;
  s.at = at;
  s.R_kin = Rkin;
  s.R_geom = Rgeo;
  s.dR = Math.abs(Rkin - Rgeo);
  s.yp = yp;
  s.ypp = ypp;
  s.cx = x + Rgeo * s.nx;          /* центр кривизны строится по второму
                                      маршруту: если бы маршруты разошлись,
                                      окружность съехала бы с кривой */
  s.cy = s.y + Rgeo * s.ny;

  /* Две проверки, которые демка обязана проходить всюду. Базис ортогонален,
     и ускорение целиком раскладывается по нему: третьему направлению
     взяться неоткуда. */
  s.tauDotN = s.tx * s.nx + s.ty * s.ny;
  s.a_nevyazka = Math.sqrt(
    Math.pow(ax - (at * s.tx + an * s.nx), 2) +
    Math.pow(ay - (at * s.ty + an * s.ny), 2));
  return s;
}

/* Вершинная окружность считается один раз тем же счётом: на сцене она
   стоит бледной мерой, с которой сравнивается бегущая. */
var VERSH = izmerit({ x: XA });

/* Русский разделитель и типографский минус. Ноль печатается нулём:
   «−0,0000» в вершине выглядит измеренным значением, а его там нет. */
function num(v, d){
  if (Math.abs(v) < 0.5 * Math.pow(10, -d)) v = 0;
  return v.toFixed(d).replace('.', ',').replace('-', '−');
}

var SUP = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴',
            '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
function sup(n){ return String(n).split('').map(function(c){ return SUP[c] || c; }).join(''); }

/* Расхождение маршрутов в метрах — доли нанометра, и обычной записью
   оно не читается. Печатаем порядком. */
function poryadok(d){
  var e = Math.floor(Math.log(d) / Math.LN10);
  return num(d / Math.pow(10, e), 1) + '·10' + sup(e);
}

function kx(tex){
  try { return katex.renderToString(tex, { throwOnError: false }); }
  catch (e) { return tex; }
}
var F_KIN = kx('R = v^2 / a_n');
var F_GEO = kx("R = (1 + y'^2)^{3/2} / |y''|");
var MARSHRUTY = 'Радиус кривизны считается дважды. В первом маршруте известны скорость и ' +
  'ускорение, ' + F_KIN + '. Во втором известно уравнение кривой, ' + F_GEO +
  '. Производные берутся численно, и справа два числа совпадают в шестом знаке.';

/* ══════════════════ сцена ══════════════════ */

var W = 1000, HGT = 460;
var PL = { x0: 34, x1: 706, y0: 16, y1: 444 };   /* поле рисунка */
var SC = (PL.x1 - PL.x0) / 11.5;                 /* пикселей на метр */
var XMIN = -0.55, YMAX = 2.85;                   /* левый верхний угол поля, м */
var RX = 985;                                    /* правый край показаний */
var APX = 96 / G;                                /* пикселей на м/с²: g рисуется
                                                    отрезком в 96 px */
var BAZIS = 44;                                  /* длина единичных τ и n, px */

/* Цвета по словарю рисунков главы: τ и скорость бирюзовые (figa), нормаль
   и ускорение охряные (figb) — так же, как в soprovozhdayushchij_bazis и
   parabola_krivizna. Нормаль от ускорения отличает длина: базис единичный
   и короткий, составляющие ускорения длинные. Оттенки сдвинуты к середине,
   чтобы читаться и на светлом полотне главы, и на тёмном слайде колоды. */
var CT = '#4db6c6';    /* касательная и скорость */
var CN = '#e0a878';    /* нормаль: тот же охряный, светлее */
var CA = '#e08a52';    /* ускорение и его составляющие */
/* Окружность кривизны и её радиус — оливковый figconst, как вершинная
   окружность в pics/parabola_krivizna.tex. Решение автора 07.09: в демке
   окружность одна, значит и цвет один; на рисунке их две, и там они
   остаются разведёнными по цвету. Радиус кривизны — геометрический
   инвариант кривой, и оливковый в словаре стоит как раз за инвариантами. */
var CR = '#a8c93f';    /* окружность кривизны, её радиус и оба показания R */

function px(xm){ return PL.x0 + (xm - XMIN) * SC; }
function py(ym){ return PL.y0 + (YMAX - ym) * SC; }
function vRamke(x, y){ return x >= PL.x0 && x <= PL.x1 && y >= PL.y0 && y <= PL.y1; }

/* Стрелка в экранных координатах. Наконечник не длиннее половины вектора:
   у вершины тангенциальная составляющая обращается в ноль, и наконечник
   не должен пережить сам вектор. */
function strelka(ctx, x1, y1, x2, y2, color, wide){
  var dx = x2 - x1, dy = y2 - y1, L = Math.sqrt(dx * dx + dy * dy);
  if (L < 2.5) return;
  var h = Math.min(12, L * 0.45), a = Math.atan2(dy, dx);
  ctx.save();
  ctx.setLineDash([]);
  ctx.strokeStyle = color; ctx.lineWidth = wide; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - h * Math.cos(a - 0.38), y2 - h * Math.sin(a - 0.38));
  ctx.lineTo(x2 - h * Math.cos(a + 0.38), y2 - h * Math.sin(a + 0.38));
  ctx.closePath();
  ctx.fillStyle = color; ctx.fill();
  ctx.restore();
}

function okruzhnost(ctx, cx, cy, r, color, wide, dash){
  ctx.save();
  ctx.setLineDash(dash || []);
  ctx.strokeStyle = color; ctx.lineWidth = wide;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.284); ctx.stroke();
  ctx.restore();
}

function otrezok(ctx, x1, y1, x2, y2, color, wide, dash){
  ctx.save();
  ctx.setLineDash(dash || []);
  ctx.strokeStyle = color; ctx.lineWidth = wide;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.restore();
}

/* Последняя точка отрезка, ещё попавшая в рамку. Нужна для пометки там,
   где центр кривизны ушёл за кадр: у краёв параболы радиус втрое больше
   вершинного, и центр опускается на десять метров вниз. */
function naSreze(x1, y1, x2, y2){
  var best = null;
  for (var i = 0; i <= 120; i++) {
    var u = i / 120, x = x1 + (x2 - x1) * u, y = y1 + (y2 - y1) * u;
    if (vRamke(x, y)) best = { x: x, y: y }; else break;
  }
  return best;
}

function Krivizna(){
  var st = useRef({ x: XA, run: false, acc: 0 }).current;
  if (st.R_kin === undefined) izmerit(st);      /* показания до первого кадра */

  var [ui, setUi] = useState({ x: XA, run: false });
  var tone = null;

  function step(dt){
    if (st.run) {
      st.x += VX * SLOWMO * dt;                 /* натуральный ход, замедленный */
      if (st.x > LEN) st.x -= LEN;              /* добежала — бросаем заново */
    }
    izmerit(st);
    /* Ручка ползунка живёт в React. Во время прогона двигаем её десять раз
       в секунду: чаще незачем, число на такой скорости всё равно не прочесть,
       а перерисовка сцены идёт своим чередом каждый кадр. */
    st.acc += dt;
    if (st.run && st.acc > 0.1) { st.acc = 0; setUi({ x: st.x, run: true }); }
  }

  /* ── сцена ── */

  function ris(ctx){
    var ink = 'rgb(' + tone.ink + ')';
    var muted = 'rgb(' + tone.muted + ')';
    var acc = 'rgb(' + tone.accent + ')';
    var Px = px(st.x), Py = py(st.y);

    /* уровень броска */
    otrezok(ctx, PL.x0, py(0), PL.x1, py(0), 'rgba(' + tone.muted + ',.22)', 1);

    /* Опорная окружность вершины снята по правке автора 07.09: рядом
       с бегущей она читалась вторым объектом со своей жизнью, а нужна была
       мерой. Сравнение осталось там, где ему место, — в показаниях: радиус
       в вершине 5,0968 м против 6,8466 м на наклонном участке. */

    /* Бегущая окружность кривизны с радиусом и центром */
    okruzhnost(ctx, px(st.cx), py(st.cy), st.R_geom * SC, CR, 2.4);
    otrezok(ctx, Px, Py, px(st.cx), py(st.cy), CR, 1.4, [5, 6]);
    if (vRamke(px(st.cx), py(st.cy))) {
      ctx.beginPath(); ctx.arc(px(st.cx), py(st.cy), 4.5, 0, 6.284);
      ctx.fillStyle = CR; ctx.fill();
    } else {
      var srez = naSreze(Px, Py, px(st.cx), py(st.cy));
      if (srez) C.label(ctx, srez.x, srez.y - 10, 'центр за кадром', 17, muted);
    }

    /* Парабола поверх окружностей: там, где они прилегают, видно,
       что линия у точки касания одна. */
    ctx.save();
    ctx.setLineDash([]);
    ctx.strokeStyle = ink; ctx.lineWidth = 3; ctx.lineJoin = 'round';
    ctx.beginPath();
    for (var i = 0; i <= 240; i++) {
      var xm = LEN * i / 240;
      if (i) ctx.lineTo(px(xm), py(yx(xm))); else ctx.moveTo(px(xm), py(yx(xm)));
    }
    ctx.stroke();
    ctx.restore();

    ctx.beginPath(); ctx.arc(px(XA), py(VERSH.y), 4, 0, 6.284);
    ctx.fillStyle = muted; ctx.fill();
    C.label(ctx, px(XA) - 13, py(VERSH.y) - 11, 'A', 19, muted, 'right');

    /* Наклон скорости к горизонту: пунктирная горизонталь и дужка угла */
    var sa = Math.atan2(-st.ty, st.tx);          /* угол τ на экране */
    if (Math.abs(st.alfaDeg) > 2) {
      otrezok(ctx, Px, Py, Px + 82, Py, 'rgba(' + tone.muted + ',.55)', 1, [4, 5]);
      ctx.save();
      ctx.setLineDash([]);
      ctx.strokeStyle = muted; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(Px, Py, 46, 0, sa, sa < 0); ctx.stroke();
      ctx.restore();
      C.label(ctx, Px + 64 * Math.cos(sa / 2) + 4, Py + 64 * Math.sin(sa / 2) + 6,
              num(Math.abs(st.alfaDeg), 1) + '°', 18, muted, 'left');
    }

    /* Разложение ускорения. Векторы складываются хвост к голове: сначала
       поперечная часть от точки, потом продольная от её конца, и вместе
       они обязаны прийти в конец самого g. Треугольник закрывается сам,
       без подгонки: a_t и a_n сняты с ускорения проекциями. */
    var nsx = st.nx, nsy = -st.ny;               /* нормаль на экране */
    var tsx = st.tx, tsy = -st.ty;               /* касательная на экране */
    var Qx = Px + nsx * st.an * APX, Qy = Py + nsy * st.an * APX;
    var Gx = Px, Gy = Py + G * APX;

    strelka(ctx, Px, Py, Gx, Gy, CA, 3);
    strelka(ctx, Px, Py, Qx, Qy, 'rgba(255,122,102,.8)', 2.2);
    otrezok(ctx, Qx, Qy, Gx, Gy, 'rgba(255,122,102,.8)', 2.2, [5, 5]);
    strelka(ctx, Qx + (Gx - Qx) * 0.75, Qy + (Gy - Qy) * 0.75, Gx, Gy,
            'rgba(255,122,102,.8)', 2.2);

    var storona = Qx > Px ? -1 : 1;              /* подпись g — с пустой стороны */
    C.label(ctx, Gx + storona * 13, Gy - 2, 'g', 20, CA, storona > 0 ? 'left' : 'right');
    /* Подпись ставится сбоку от стрелки, а не поверх неё (правка автора
       07.09): смещаемся от оси стрелки вдоль касательной и выравниваем
       текст от точки смещения наружу, чтобы он рос прочь от стрелки. */
    var sgnT = st.at < 0 ? 1 : -1;               /* уводим наружу треугольника */
    var lx = Px + nsx * st.an * APX * 0.55 + sgnT * tsx * 15;
    var ly = Py + nsy * st.an * APX * 0.55 + sgnT * tsy * 15 + 6;
    C.label(ctx, lx, ly, 'поперёк', 18, CA, sgnT * tsx > 0 ? 'left' : 'right');
    if (Math.abs(st.at) > 0.35) {
      C.label(ctx, (Qx + Gx) / 2 + nsx * 20, (Qy + Gy) / 2 + nsy * 20 + 6,
              'вдоль', 18, CA);
    }

    /* Сопровождающий базис. Он единичный, поэтому короче составляющих
       ускорения: длина здесь ничего не меряет, меряет направление. */
    strelka(ctx, Px, Py, Px + tsx * BAZIS, Py + tsy * BAZIS, CT, 2.2);
    strelka(ctx, Px, Py, Px + nsx * BAZIS, Py + nsy * BAZIS, CN, 2.2);
    C.label(ctx, Px + tsx * BAZIS - nsx * 17, Py + tsy * BAZIS - nsy * 17 + 6,
            'τ', 21, CT);
    C.label(ctx, Px + nsx * BAZIS - sgnT * tsx * 17, Py + nsy * BAZIS - sgnT * tsy * 17 + 6,
            'n', 20, CN);

    C.glow(ctx, Px, Py, 22, tone.accent, .4);
    ctx.beginPath(); ctx.arc(Px, Py, 6, 0, 6.284);
    ctx.fillStyle = ink; ctx.fill();
  }

  function draw(ctx){
    tone = C.tones(ctx);
    var muted = 'rgb(' + tone.muted + ')';
    var acc = 'rgb(' + tone.accent + ')';

    /* Окружность у краёв параболы вылезает далеко за поле: без обрезки она
       прошла бы прямо по показаниям. */
    ctx.save();
    ctx.beginPath();
    ctx.rect(PL.x0, PL.y0, PL.x1 - PL.x0, PL.y1 - PL.y0);
    ctx.clip();
    ris(ctx);
    ctx.restore();

    C.readout(ctx, RX, 44, 'R по скорости и ускорению, м', num(st.R_kin, 6), CR);
    C.readout(ctx, RX, 128, 'R по уравнению кривой, м', num(st.R_geom, 6), CR);
    C.label(ctx, RX, 196, st.dR > 0 ? 'расхождение ' + poryadok(st.dR) + ' м'
                                    : 'расхождение ноль', 17, muted, 'right');
    C.readout(ctx, RX, 246, 'a поперёк v, м/с²', num(st.an, 4), CA);
    C.readout(ctx, RX, 316, 'a вдоль v, м/с²', num(st.at, 4), CA);
    C.readout(ctx, RX, 386, '|v|, м/с', num(st.v, 4), CT);
  }

  /* ── управление ── */

  /* Показания пересчитываются здесь же, а не ждут ближайшего кадра: строка
     под сценой собирается при отрисовке React и без этого отставала бы
     на один ход ползунка. */
  function vedi(x){ st.x = x; st.run = false; izmerit(st); setUi({ x: x, run: false }); }
  function pusk(){ st.run = !st.run; setUi({ x: st.x, run: st.run }); }

  /* Окрестность вершины для строки под сценой: в полуметре от вершины
     радиус отличается от R_A на треть процента, и слова про горизонтальную
     скорость там ещё правда. Подсветка кнопки — дело другое, она означает
     «стоим ровно на пресете», и допуск у неё свой. */
  var uVershiny = Math.abs(st.x - XA) < 0.3;
  var zaKadrom = !vRamke(px(st.cx), py(st.cy));
  var slovo = uVershiny
    ? 'В вершине скорость горизонтальна, и всё ускорение идёт поперёк неё. '
    : (zaKadrom ? 'Ближе к краю парабола распрямляется, окружность растёт, и центр кривизны уходит за кадр. ' : '');

  var ref = C.useStage(W, HGT, step, draw);
  window.__demoState = st;

  return html`
    <div class="demo">
      <div class="controls">
        <${C.Slider} label="Точка" min=${0} max=${LEN} step=${0.01} value=${ui.x}
                     display=${num(ui.x, 2) + ' м'}
                     onChange=${vedi} />
        <${C.Group}>
          <${C.Btn} active=${Math.abs(st.x - XA) < 0.02}
                    onClick=${function(){ vedi(XA); }}>В вершину<//>
          <${C.Btn} active=${Math.abs(st.x - X25) < 0.02}
                    onClick=${function(){ vedi(X25); }}>Наклон 25°<//>
        <//>
        <${C.Group}>
          <${C.Btn} action=${true} onClick=${pusk}>${ui.run ? 'Пауза' : 'Пуск'}<//>
        <//>
      </div>
      <canvas class="stage" ref=${ref}></canvas>
      <${C.Status} html=${slovo + MARSHRUTY} />
    </div>`;
}

C.mount(Krivizna);
</script>
</body>
</html>
