<script>
'use strict';
var C = window.DemoCore, html = C.html;
var useRef = React.useRef, useState = React.useState;

/* ══════════════════ физика ══════════════════

   Блоки главы `tenzor-inercii` и `ellipsoid-inercii` (бриф
   briefs/demki_nedelya06.md, № 9; семинарская задача методички «Главные оси
   пластинки»). Тонкая однородная пластинка 2×1 м массой 1 кг лежит в плоскости
   xy, центр в начале координат, длинная сторона вдоль x. Ползунок поворачивает
   оси x', y' против часовой стрелки на угол α (в главе он назван φ, на экране
   подписан φ); пластинка, сечение эллипсоида инерции и главные оси стоят на месте.

   ЧТО СЧИТАЕТСЯ. Тензор не печатается из таблицы, он складывается из
   распределения массы. Пластинка разбита на 40×20 клеток по 0,05×0,05 м, масса
   клетки 1/800 кг. Для клетки с центром (x, y) в повёрнутых осях

       x' =  x·cos α + y·sin α,      y' = −x·sin α + y·cos α,

   и компоненты берутся по определению главы (tenzor-inercii#komponenty),
   плоская пластинка, z = 0:

       I_x'x' = Σ dm·y'²,    I_y'y' = Σ dm·x'²,    I_x'y' = −Σ dm·x'y'.

   Знак центробежного момента. Минус входит в определение компоненты тензора,
   как в главе (I_ik = ∫(r²δ_ik − x_i x_k) dm, Ландау и Лифшиц, т. 1, § 32). В
   части литературы центробежным моментом зовут +∫x'y' dm, и минус тогда
   стоит в матрице; число на экране при этом одно и то же, но слова разные.
   Определение напечатано на сцене. Оси повёрнуты против часовой стрелки на
   +45°: точки на длинной стороне, вдоль старой оси x, имеют x'>0 и y'<0,
   Σ dm·x'y' < 0, и компонента I_x'y' = +0,125.

   К точечной массе клетки добавлен момент самой клетки: у квадрата h²/12 вокруг
   каждой оси через его центр, и в любых осях он одинаков. Без него сумма
   занижала бы осевые моменты на m·h²/12 = 2,1·10⁻⁴ кг·м² (0,0831 вместо
   0,0833); с ним квадратичная форма на клетке интегрируется без остатка, и
   сумма по клеткам для прямоугольника точна при любом α.

   Главные моменты, главные оси и сечение эллипсоида берутся из ЖИВОЙ матрицы при текущем
   угле, а не из констант. Главные моменты — корни уравнения
   det(Î' − I·1) = 0:

       I₁,₂ = (I_x'x' + I_y'y')/2 ∓ √[((I_x'x' − I_y'y')/2)² + I_x'y'²],

   меньший из них I₁. Направление оси I₁ от оси x' даёт
   φ = ½·atan2(−2 I_x'y', I_y'y' − I_x'x'): на нём квадратичная форма
   I(φ) = I_x'x' cos²φ + 2 I_x'y' sinφ cosφ + I_y'y' sin²φ достигает минимума.
   Оси лежат в плоскости пластинки; третья главная ось (z) перпендикулярна ей,
   I_zz = I_x'x' + I_y'y' = I₁ + I₂ (правило перпендикулярных осей плоской
   пластинки), поэтому «след» на экране — это след плоского блока 2×2.

   Эллипсоид инерции и его сечение (замечание автора 25: «может, не эллипс
   инерции, а сечение эллипсоида?»). Эллипсоид инерции тела относительно
   центра масс есть поверхность {r : rᵀÎr = K²}: её радиус вдоль единичного
   направления s равен K/√I(s), где I(s) = Σ I_ij s_i s_j момент инерции вокруг
   оси s (ellipsoid-inercii: полуоси 1/√I). Масштаб K условный: на экране
   K = 0,5, радиус в метрах при I в кг·м². Эллипсоид трёхмерный, у пластинки он
   имеет полуоси K/√I₁ = 1,732 м вдоль длинной стороны, K/√I₂ = 0,866 м вдоль
   короткой и K/√I₃ = K/√I_zz = 0,775 м по нормали, самую короткую, потому что
   вдоль нормали момент инерции наибольший. Плоскость пластинки z = 0 проходит
   через центр и содержит две самые длинные оси, а тензор в ней блочно
   диагонален (I_xz = I_yz = 0), поэтому сечение эллипсоида этой плоскостью
   есть эллипс {(x, y) : (x, y)·Î₂ₓ₂·(x, y)ᵀ = K²} с матрицей 2×2 из показаний.
   Он и нарисован на сцене фиолетовым, отдельного «эллипса инерции» нет.
   Кривая строится из матрицы при текущем α и поворачивается обратно в
   неподвижную систему, так что неподвижность сечения получается счётом, его
   никто не придерживает. Там, где ось x' (или y') пересекает сечение, радиус
   равен K/√I_x'x' (K/√I_y'y'): осевой момент читается по сечению.

   Схема внизу слева показывает весь эллипсоид и секущую плоскость: ортогональный
   вид сверху под азимутом 24° и наклоном 34°, плоскость пластинки (серый
   параллелограмм), сама пластинка, контур эллипсоида с двумя меридианами и
   сечение жирным цветом сечения. Контур строится как образ единичного шара при
   линейном отображении: Σ = Σ_k a_k² (A e_k)(A e_k)ᵀ, где A = [r1; r2] задаёт
   экранные оси в мировых координатах, точки контура √Σ·(cos t, sin t). Сечение
   на схеме считается той же функцией radius и той же матрицей, что и кривая на
   сцене, а полуоси берутся из живых I₁, I₂ и I_zz = I_x'x' + I_y'y'.

   Слова. Диагональ матрицы в любых осях называется осевыми моментами; главными
   моментами называются собственные значения, они же диагональ в главных осях.
   Поэтому на экране «главные» стоит у чисел, которые от осей не зависят, а у
   диагонали это слово появляется только в строке «оси главные», когда
   центробежный момент ноль (меньше половины единицы последнего знака на
   экране, 5·10⁻⁴).

   ПОКАЗАНИЯ __demoState, кг·м² и градусы: angle (против часовой стрелки),
   angleRad, Ixx, Iyy, Ixy (= −∫x'y' dm), trace = Ixx + Iyy (след плоского блока,
   он же I_zz), I1 ≤ I2, principal, axisI1 (направление оси I₁ в осях
   пластинки), ellipse (полуоси сечения, м), ellipsoid (полуоси эллипсоида
   инерции, м: вдоль I₁, вдоль I₂ и по нормали), definition.

   ПРОВЕРКА. Три независимых пути к одной матрице: (1) сумма по клеткам в
   повёрнутых осях (на экране), (2) ручные формулы для прямоугольника
   I_x'x' = I_xx cos²α + I_yy sin²α, I_y'y' = I_xx sin²α + I_yy cos²α,
   I_x'y' = (I_yy − I_xx) sinα cosα при I_xx = m b²/12, I_yy = m a²/12,
   (3) закон преобразования тензора Î' = R·Î·Rᵀ от матрицы в осях по сторонам.
   window.__demoProverka(шаг) возвращает наибольшие расхождения по углам от
   −90° до 90°. Прогон 04.10 (hcheck.mjs, шаг 0,5°, 361 угол): сетка против
   формул 5,6·10⁻¹⁶, сетка против закона 7,2·10⁻¹⁶, формулы против закона
   2,2·10⁻¹⁶; след против 5/12 6,1·10⁻¹⁶, I₁ против 1/12 2,8·10⁻¹⁶, I₂ против
   1/3 5,0·10⁻¹⁶, след против I_zz = ∫(x²+y²) dm 5,6·10⁻¹⁶; смещение радиуса
   эллипса по 360 направлениям относительно α = 0 не больше 4,4·10⁻¹⁵ м; ось
   I₁ в осях пластинки 0° с точностью 5,7·10⁻¹⁴ градуса. Числа брифа: 0,0833 и
   0,3333 при 0°, по 0,2083 при 45° с центробежным +0,1250 (−0,1250 при −45°),
   след 0,4167. Независимая сетка 400×200 из точечных масс подтверждает числа и
   знак: Σ dm·x'y' = −0,1250 при +45°, а осевые у неё отстают на m·h²/12 =
   2,1·10⁻⁶ при h = 0,005 м (при h = 0,05 м, как на экране без поправки на
   клетку, было бы 2,1·10⁻⁴). Эллипс на канве: 144 из 144 проверенных точек
   контура лежат в пикселях цвета сечения на радиусе, посчитанном независимо
   по ρ = 0,5/√(I_xx cos²t + I_yy sin²t), при пяти углах осей.
   Схема эллипсоида (05.10, __demoProverka): опорная функция контура √(uᵀΣu)
   против перебора 180 000 точек поверхности по 360 направлениям расходится
   на 4,1·10⁻⁵ м (шаг сетки); точки контура лежат на эллипсе Σ с точностью
   1,8·10⁻¹⁵; проекция сечения не выходит за контур; полуоси 1,732 > 0,866 >
   0,775 м, и третья равна K/√I_zz. Числа матрицы и все прежние проверки при
   правке не изменились. */

var RAD = Math.PI / 180, TWO_PI = 2 * Math.PI;

var M = 1, A = 2, B = 1;               /* масса, кг; стороны вдоль x и y, м */
var NX = 40, NY = 20;                  /* клеток по сторонам */
var HX = A / NX, HY = B / NY;          /* размер клетки, м */
var NCELL = NX * NY, DM = M / NCELL;   /* число клеток и масса клетки, кг */
var KEL = 0.5;                         /* масштаб эллипсоида инерции, см. выше */
var EPS_GLAV = 5e-4;                   /* центробежный меньше половины единицы последнего знака: оси главные */

/* Центры клеток. */
var KX = new Float64Array(NCELL), KY = new Float64Array(NCELL);
(function () {
  var k = 0;
  for (var i = 0; i < NX; i++) for (var j = 0; j < NY; j++) {
    KX[k] = -A / 2 + (i + 0.5) * HX;
    KY[k] = -B / 2 + (j + 0.5) * HY;
    k++;
  }
})();

/* Путь 1. Компоненты тензора в осях, повёрнутых на a радиан против часовой
   стрелки, суммой по клеткам. */
function tenzor(a) {
  var c = Math.cos(a), s = Math.sin(a), xx = 0, yy = 0, xy = 0;
  for (var k = 0; k < NCELL; k++) {
    var u = KX[k] * c + KY[k] * s;         /* x' клетки */
    var v = -KX[k] * s + KY[k] * c;        /* y' клетки */
    xx += v * v; yy += u * u; xy -= u * v;
  }
  /* собственный момент клетки: вокруг осей, параллельных x и y, jx и jy;
     в повёрнутых осях это тот же тензор, повёрнутый на α */
  var jx = DM * HY * HY / 12, jy = DM * HX * HX / 12;
  return {
    xx: DM * xx + NCELL * (jx * c * c + jy * s * s),
    yy: DM * yy + NCELL * (jx * s * s + jy * c * c),
    xy: DM * xy + NCELL * (jy - jx) * c * s
  };
}

/* Путь 2. Ручные формулы для однородного прямоугольника, центробежный в
   осях по сторонам ноль по симметрии. */
function formuly(a) {
  var c = Math.cos(a), s = Math.sin(a), p = M * B * B / 12, r = M * A * A / 12;
  return { xx: p * c * c + r * s * s, yy: p * s * s + r * c * c, xy: (r - p) * c * s };
}

/* Путь 3. Закон преобразования Î' = R·Î·Rᵀ, R = [[c, s], [−s, c]], от
   матрицы в осях по сторонам (она тоже получена суммой по клеткам). */
function zakon(a) {
  var T = tenzor(0), c = Math.cos(a), s = Math.sin(a);
  return {
    xx: T.xx * c * c + 2 * T.xy * c * s + T.yy * s * s,
    yy: T.xx * s * s - 2 * T.xy * c * s + T.yy * c * c,
    xy: (T.yy - T.xx) * c * s + T.xy * (c * c - s * s)
  };
}

/* Главные моменты и направление оси меньшего из них от оси x', по матрице
   [[a, b], [b, d]]. */
function glavnye(a, d, b) {
  var m = (a + d) / 2, r = Math.hypot((a - d) / 2, b);
  return { I1: m - r, I2: m + r, phi: 0.5 * Math.atan2(-2 * b, d - a) };
}

/* Радиус сечения эллипсоида инерции вдоль направления phi (от оси x') по матрице. */
function radius(a, d, b, phi) {
  var c = Math.cos(phi), s = Math.sin(phi);
  return KEL / Math.sqrt(a * c * c + 2 * b * c * s + d * s * s);
}

/* Направление (не стрелка) в градусах приводится к (−90°; 90°]. */
function pol90(deg) {
  var d = deg % 180;
  if (d > 90) d -= 180;
  if (d <= -90) d += 180;
  return d;
}

/* Русская запятая и настоящий минус; крохи печатаются нулём. */
function num(v, d) {
  if (Math.abs(v) < 0.5 * Math.pow(10, -d)) v = 0;
  return v.toFixed(d).replace('.', ',').replace('-', '−');
}

/* Правило курса: буквы величин и формулы — только KaTeX. Результаты кэшируются:
   при вращении подписи пересобираются каждый кадр, а разметка у них одна. */
var kxCache = {};
function kx(tex) {
  if (kxCache[tex]) return kxCache[tex];
  var out;
  try { out = katex.renderToString(tex, { throwOnError: false }); }
  catch (e) { out = tex; }
  kxCache[tex] = out;
  return out;
}
function kxc(tex, col) { return kx('\\textcolor{' + col + '}{' + tex + '}'); }
/* Малый кегль для подписей рядом со словами на канве: KaTeX сам крупнее
   текста на 21 процент, и без \small формула в ряду слов торчала бы выше строки. */
function kxs(tex, col) { return kx('\\small ' + (col ? '\\textcolor{' + col + '}{' + tex + '}' : tex)); }

/* Прогон для автопроверки: расхождения трёх путей, инварианты и эллипс по
   сетке углов от −90° до 90°, плюс самопроверка главных осей на случайных
   матрицах (перебором по углу). */
function proverka(shag) {
  shag = shag || 0.5;
  var r = { uglov: 0, setkaFormuly: 0, setkaZakon: 0, formulyZakon: 0, sled: 0, I1: 0, I2: 0,
            Izz: 0, elDrift: 0, glavUgol: 0, perebUgol: 0, perebI1: 0, bezKletki: 0,
            shemaOpora: 0, shemaForma: 0, shemaVnutri: 0, shemaPolosi: 0 };
  var T0 = tenzor(0);
  var I1c = M * B * B / 12, I2c = M * A * A / 12, i, k, deg;
  var Izz = 0;
  for (k = 0; k < NCELL; k++) Izz += KX[k] * KX[k] + KY[k] * KY[k];
  Izz = DM * Izz + NCELL * DM * (HX * HX + HY * HY) / 12;
  var ell0 = [];
  for (i = 0; i < 360; i++) ell0.push(radius(T0.xx, T0.yy, T0.xy, i * RAD));
  for (deg = -90; deg <= 90 + 1e-9; deg += shag) {
    var a = deg * RAD, T = tenzor(a), F = formuly(a), Z = zakon(a), G = glavnye(T.xx, T.yy, T.xy);
    r.uglov++;
    r.setkaFormuly = Math.max(r.setkaFormuly, Math.abs(T.xx - F.xx), Math.abs(T.yy - F.yy), Math.abs(T.xy - F.xy));
    r.setkaZakon = Math.max(r.setkaZakon, Math.abs(T.xx - Z.xx), Math.abs(T.yy - Z.yy), Math.abs(T.xy - Z.xy));
    r.formulyZakon = Math.max(r.formulyZakon, Math.abs(F.xx - Z.xx), Math.abs(F.yy - Z.yy), Math.abs(F.xy - Z.xy));
    r.sled = Math.max(r.sled, Math.abs(T.xx + T.yy - (I1c + I2c)));
    r.I1 = Math.max(r.I1, Math.abs(G.I1 - I1c));
    r.I2 = Math.max(r.I2, Math.abs(G.I2 - I2c));
    r.Izz = Math.max(r.Izz, Math.abs(T.xx + T.yy - Izz));
    /* эллипс: радиус по направлению t в неподвижных осях, матрица взята при угле a */
    for (i = 0; i < 360; i++) {
      var rho = radius(T.xx, T.yy, T.xy, i * RAD - a);
      r.elDrift = Math.max(r.elDrift, Math.abs(rho - ell0[i]));
    }
    /* ось I₁ в неподвижных осях: пластинка — длинная сторона вдоль x, то есть 0° */
    var th = pol90(deg + G.phi / RAD);
    r.glavUgol = Math.max(r.glavUgol, Math.abs(th));
    /* то же без поправки на клетку: недобор осевых из-за точечных масс */
    var c = Math.cos(a), s = Math.sin(a), pxx = 0;
    for (k = 0; k < NCELL; k++) { var v = -KX[k] * s + KY[k] * c; pxx += v * v; }
    r.bezKletki = Math.max(r.bezKletki, Math.abs(DM * pxx - T.xx));
  }
  /* самопроверка glavnye(): случайные симметричные матрицы, ось I₁ против
     перебора минимума квадратичной формы по углу с шагом 0,001° */
  var seed = 12345;
  function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
  for (i = 0; i < 20; i++) {
    var a2 = 0.5 + rnd(), d2 = 0.5 + rnd(), b2 = rnd() - 0.5, G2 = glavnye(a2, d2, b2);
    var best = 1e9, bestPhi = 0;
    for (var p = -90; p < 90; p += 0.001) {
      var cp = Math.cos(p * RAD), sp = Math.sin(p * RAD);
      var Iq = a2 * cp * cp + 2 * b2 * cp * sp + d2 * sp * sp;
      if (Iq < best) { best = Iq; bestPhi = p; }
    }
    r.perebUgol = Math.max(r.perebUgol, Math.abs(pol90(G2.phi / RAD - bestPhi)));
    r.perebI1 = Math.max(r.perebI1, Math.abs(best - G2.I1));
  }
  /* схема эллипсоида: (1) опорная функция контура h(u) = √(uᵀΣu) против перебора
     точек поверхности (сетка 300×600), (2) точки контура лежат на эллипсе Σ,
     (3) проекция сечения не выходит за контур, (4) полуоси: нормаль самая короткая
     и a3 = K/√I_zz */
  var K0 = kadr(0), ae = K0.ell, S2 = sigmaKontura(ae, K0.os1 * RAD), th0 = K0.os1 * RAD;
  var P = [], j, g, th, ph, X3, Y3, Z3, e1x = Math.cos(th0), e1y = Math.sin(th0);
  for (i = 0; i < 300; i++) for (j = 0; j < 600; j++) {

/* ══════════════════ сцена ══════════════════

   Слева пластинка, сечение эллипсоида инерции плоскостью пластинки
   (фиолетовое), главные оси (пунктир) и повёрнутые оси x' (оранжевая) и y'
   (бирюзовая): точки их пересечения с сечением лежат на расстоянии K/√I от
   центра; внизу слева схема всего эллипсоида с секущей плоскостью. Справа матрица в повёрнутых
   осях, под ней что в матрице как называется, ниже то, что от осей не зависит:
   сумма осевых (след блока 2×2) и главные моменты. Слова «осевые» и «главные»
   разведены: диагональ матрицы всегда осевые моменты, «главными» они
   называются только там, где центробежный момент ноль. Слова стоят на канве,
   а буквы и формулы слоем KaTeX поверх (правило курса); слой стоит по центру
   кадра с его пропорцией, как в pushka-nyutona, поэтому не уезжает от чисел
   в широком окне. Отчёт: briefs/demki_nedelya06_tenzor-povorot_REPORT.md. */

var W = 1000, HGT = 460;
var CX = 292, CY = 232, S = 100;       /* центр пластинки на канве и пикселей на метр */
var AXL = 1.95;                        /* полудлина осей, м */
var C_X = '#d9772f', C_Y = '#2ba3b8', C_XY = '#6fa030', C_EL = '#9a72e8';
var SPIN = 24, ANIM = 45;              /* градусов в секунду у крутилки и у поворота к главным осям */

/* Правая панель: числа и слова живут на канве, буквы и формулы слоем KaTeX поверх. */
var PX0 = 548, PX1 = 984;              /* левый и правый края */
var COL1 = 722, COL2 = 886;            /* центры столбцов матрицы */
var CAPY = 34, HDR = 66;               /* подпись панели (базовая линия) и заголовки столбцов (центр) */
var ROW1 = 108, ROW2 = 162;            /* базовые линии строк матрицы */
var LEG = [204, 230, 258];             /* ряды «что в матрице как называется» (центры), третий — формула */
var NOTE = 284, BADGE = 314;           /* про знак (базовая линия) и «оси главные / не главные» */
var SEP = 332, NZ = 358;               /* черта и подпись к тому, что от осей не зависит */
var RY = [388, 419, 450];              /* базовые линии строк инвариантов */
/* Схема эллипсоида инерции внизу слева (замечание автора 25): косой вид сверху,
   поворот вокруг вертикали AZ и наклон EL; u пикселей на метр, центр схемы (x, y). */
var AZ = 24 * RAD, EL = 34 * RAD;
var SKX = 150, SKY = 369, SKU = 44;
var SKT = [430, 452];                  /* базовые линии двух подписей под схемой */

function mono(ctx, x, y, text, size, col, align) {
  ctx.fillStyle = col;
  ctx.font = '600 ' + size + 'px "JetBrains Mono", ui-monospace, monospace';
  ctx.textAlign = align || 'center';
  ctx.fillText(text, x, y);
  ctx.textAlign = 'center';
}

/* Стрелка с наконечником, как в sharik-na-niti. */
function strelka(ctx, x0, y0, x1, y1, color, width) {
  var dx = x1 - x0, dy = y1 - y0, Ln = Math.hypot(dx, dy);
  if (Ln < 1) return;
  var ux = dx / Ln, uy = dy / Ln, head = Math.min(14, Ln * 0.32);
  ctx.setLineDash([]);
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x0, y0); ctx.lineTo(x1 - ux * head * 0.72, y1 - uy * head * 0.72);
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x1 - ux * head - uy * head * 0.34, y1 - uy * head + ux * head * 0.34);
  ctx.lineTo(x1 - ux * head * 0.72, y1 - uy * head * 0.72);
  ctx.lineTo(x1 - ux * head + uy * head * 0.34, y1 - uy * head - ux * head * 0.34);
  ctx.closePath(); ctx.fill();

/* Круглая скобка матрицы; sg = 1 левая, −1 правая. */
function skobka(ctx, x, y0, y1, sg, col) {
  var h = y1 - y0;
  ctx.setLineDash([]);
  ctx.strokeStyle = col; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x + 10 * sg, y0);
  ctx.bezierCurveTo(x - 3 * sg, y0 + h * 0.2, x - 3 * sg, y1 - h * 0.2, x + 10 * sg, y1);
  ctx.stroke();
}

function tochka(ctx, x, y, r, col) {
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TWO_PI); ctx.fill();
}

/* Схема эллипсоида инерции. Тензор пластинки в её осях диагонален, главные
   оси: две в плоскости (e1 вдоль оси меньшего момента I₁, e2) и нормаль z.
   Эллипсоид {r : rᵀÎr = K²} имеет полуоси a1 = K/√I₁, a2 = K/√I₂ и
   a3 = K/√I₃ с I₃ = I_zz = I₁ + I₂ (плоская пластинка), то есть вдоль нормали
   он короче всего. Плоскость пластинки z = 0 проходит через центр и содержит
   две самые длинные полуоси: её сечение есть эллипс с полуосями a1 и a2, тот
   же, что на сцене. Вид ортогональный: экранные оси в мировых координатах
   r1 = (cos AZ, sin AZ, 0) и r2 = (−sin AZ·sin EL, cos AZ·sin EL, cos EL).
   Контур эллипсоида в таком виде есть эллипс с матрицей Σ = Σ_k a_k² (A e_k)(A e_k)ᵀ,
   A = [r1; r2] (образ единичного шара при линейном отображении). */
function pr3(x, y, z) {
  var X = x * Math.cos(AZ) + y * Math.sin(AZ);
  var Yv = (-x * Math.sin(AZ) + y * Math.cos(AZ)) * Math.sin(EL) + z * Math.cos(EL);
  return [SKX + SKU * X, SKY - SKU * Yv];
}
/* Матрица контура Σ (p, q, r) и полуоси a = [a1, a2, a3] при направлении e1 под углом th (рад) */
function sigmaKontura(a, th) {
  var r1 = [Math.cos(AZ), Math.sin(AZ), 0];
  var r2 = [-Math.sin(AZ) * Math.sin(EL), Math.cos(AZ) * Math.sin(EL), Math.cos(EL)];
  var e = [[Math.cos(th), Math.sin(th), 0], [-Math.sin(th), Math.cos(th), 0], [0, 0, 1]];
  var p = 0, q = 0, r = 0;
  for (var k = 0; k < 3; k++) {
    var u = r1[0] * e[k][0] + r1[1] * e[k][1] + r1[2] * e[k][2];
    var v = r2[0] * e[k][0] + r2[1] * e[k][1] + r2[2] * e[k][2];
    p += a[k] * a[k] * u * u; q += a[k] * a[k] * u * v; r += a[k] * a[k] * v * v;
  }

}
/* Точка контура по параметру t: образ шара, главные полуоси Σ в метрах схемы */
function tochkaKontura(S2, t) {
  var m = (S2.p + S2.r) / 2, d = Math.hypot((S2.p - S2.r) / 2, S2.q);
  var psi = 0.5 * Math.atan2(2 * S2.q, S2.p - S2.r);
  var l1 = Math.sqrt(m + d), l2 = Math.sqrt(Math.max(m - d, 0));
  var X = l1 * Math.cos(t) * Math.cos(psi) - l2 * Math.sin(t) * Math.sin(psi);
  var Yv = l1 * Math.cos(t) * Math.sin(psi) + l2 * Math.sin(t) * Math.cos(psi);
  return [SKX + SKU * X, SKY - SKU * Yv];

/* Рисует схему: плоскость пластинки (параллелограмм), пластинку, контур
   эллипсоида с двумя меридианами и жирным сечением плоскостью пластинки. Всё
   прозрачно, без удаления скрытых линий: схема читается как каркас. Сечение

  var c1 = Math.cos(th), s1 = Math.sin(th);

    for (var j = 0; j < pts.length; j++) { if (j === 0) ctx.moveTo(pts[j][0], pts[j][1]); else ctx.lineTo(pts[j][0], pts[j][1]); }

    return pr3(q[0] * c1 - q[1] * s1, q[0] * s1 + q[1] * c1, 0);
  }), 'rgba(' + ink + ',.06)', 'rgba(' + ink + ',.4)', 1.4);

  poly([[-A / 2, -B / 2], [A / 2, -B / 2], [A / 2, B / 2], [-A / 2, B / 2]].map(function (q) {
    return pr3(q[0], q[1], 0);
  }), 'rgba(' + ink + ',.12)', 'rgba(' + ink + ',.7)', 1.6);
  /* меридианы x–z и y–z: каркас эллипсоида */
  [[0, 2], [1, 2]].forEach(function (pr) {
    ctx.beginPath();
    for (i = 0; i <= n; i++) {
      t = i * TWO_PI / n;
      var u = a[pr[0]] * Math.cos(t), w = a[pr[1]] * Math.sin(t);
      pt = pr[0] === 0 ? pr3(u * c1, u * s1, w) : pr3(-u * s1, u * c1, w);
      if (i === 0) ctx.moveTo(pt[0], pt[1]); else ctx.lineTo(pt[0], pt[1]);

  ctx.fillStyle = 'rgba(' + muted + ',.07)'; ctx.fill();
  ctx.strokeStyle = 'rgba(' + muted + ',.85)'; ctx.lineWidth = 1.8; ctx.stroke();
  /* сечение плоскостью пластинки: та же кривая, что на сцене */
  ctx.beginPath();
  for (i = 0; i <= n; i++) {
    t = i * TWO_PI / n;
    var rho = radius(K.T.xx, K.T.yy, K.T.xy, t - K.a);
    pt = pr3(rho * Math.cos(t), rho * Math.sin(t), 0);
    if (i === 0) ctx.moveTo(pt[0], pt[1]); else ctx.lineTo(pt[0], pt[1]);
  }

  ctx.fillStyle = 'rgba(154,114,232,.16)'; ctx.fill();

/* Один кадр: всё, что рисуется и что уходит в __demoState, берётся отсюда. */
function kadr(alphaDeg) {
  var a = alphaDeg * RAD, T = tenzor(a), G = glavnye(T.xx, T.yy, T.xy);
  return {
    alpha: alphaDeg, a: a, T: T, G: G,
    sled: T.xx + T.yy,
    glavnye: Math.abs(T.xy) < EPS_GLAV,
    os1: pol90(alphaDeg + G.phi / RAD),       /* ось I₁ в осях пластинки, градусы */
    /* полуоси эллипсоида инерции, м: вдоль I₁, вдоль I₂ и по нормали (I₃ = I_zz = I₁ + I₂) */
    ell: [KEL / Math.sqrt(G.I1), KEL / Math.sqrt(G.I2), KEL / Math.sqrt(T.xx + T.yy)]

function Demka() {
  var st = useRef({ alpha: 0, dir: 1, spin: false, target: null }).current;
  var pair = useState({ alpha: 0, spin: false, anim: false });
  var ui = pair[0], setUi = pair[1];

  function snimok() {
    var K = kadr(st.alpha);
    return {
      angle: st.alpha,                      /* градусы, против часовой стрелки */
      angleRad: K.a,
      Ixx: K.T.xx, Iyy: K.T.yy, Ixy: K.T.xy,  /* кг·м², Ixy = −∫x'y' dm */
      trace: K.sled,                        /* I_x'x' + I_y'y' */
      I1: K.G.I1, I2: K.G.I2,               /* главные моменты, I1 ≤ I2 */
      principal: K.glavnye,                 /* центробежный ноль: оси главные */
      axisI1: K.os1,                        /* направление оси I1 в осях пластинки, градусы */
      ellipse: [K.ell[0], K.ell[1]],        /* полуоси сечения эллипсоида плоскостью пластинки, м */
      ellipsoid: K.ell,                     /* полуоси эллипсоида инерции, м: вдоль I₁, I₂ и нормали */
      mass: M, sides: [A, B], cells: NCELL, definition: 'Ixy = −∫x\'y\' dm'
    };
  }
  function sync() {
    window.__demoState = snimok();
    setUi({ alpha: st.alpha, spin: st.spin, anim: st.target != null });
  }

  function step(dt) {
    var moved = false;
    if (st.target != null) {
      var d = st.target - st.alpha, mx = ANIM * dt;
      if (Math.abs(d) <= mx) { st.alpha = st.target; st.target = null; }
      else st.alpha += (d > 0 ? 1 : -1) * mx;
      moved = true;
    } else if (st.spin) {
      /* Крутилка ходит туда и обратно: на краю диапазона она разворачивается,
         а не перескакивает с 90° на −90°, иначе стрелки осей прыгали бы. */
      st.alpha += st.dir * SPIN * dt;
      if (st.alpha >= 90) { st.alpha = 90; st.dir = -1; }
      if (st.alpha <= -90) { st.alpha = -90; st.dir = 1; }
      moved = true;
    }
    if (moved) sync();
  }

  /* ── сцена ───────────────────────────────────────────── */

  function draw(ctx) {
    var tone = C.tones(ctx), ink = tone.ink, muted = tone.muted;
    var inkC = 'rgb(' + ink + ')', mutC = 'rgb(' + muted + ')', accC = 'rgb(' + tone.accent + ')';
    var K = kadr(st.alpha), T = K.T, G = K.G, a = K.a, i;
    function X(x) { return CX + x * S; }
    function Y(y) { return CY - y * S; }

    /* пластинка */
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(' + ink + ',.08)';
    ctx.strokeStyle = 'rgba(' + ink + ',.65)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.rect(X(-A / 2), Y(B / 2), A * S, B * S); ctx.fill(); ctx.stroke();

    /* сечение эллипсоида инерции плоскостью пластинки: из матрицы при текущем
       угле, в неподвижных осях */
    ctx.beginPath();
    for (i = 0; i <= 180; i++) {
      var t = i * TWO_PI / 180, rho = radius(T.xx, T.yy, T.xy, t - a);
      var ex = X(rho * Math.cos(t)), ey = Y(rho * Math.sin(t));
      if (i === 0) ctx.moveTo(ex, ey); else ctx.lineTo(ex, ey);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(154,114,232,.07)'; ctx.fill();
    ctx.strokeStyle = C_EL; ctx.lineWidth = 2.6; ctx.stroke();

    /* главные оси, найденные по матрице: пунктир */
    var th = (a + G.phi);
    ctx.setLineDash([7, 6]); ctx.strokeStyle = 'rgba(154,114,232,.7)'; ctx.lineWidth = 1.5;
    [th, th + Math.PI / 2].forEach(function (q) {
      ctx.beginPath();
      ctx.moveTo(X(-AXL * Math.cos(q)), Y(-AXL * Math.sin(q)));
      ctx.lineTo(X(AXL * Math.cos(q)), Y(AXL * Math.sin(q)));
      ctx.stroke();
    });
    ctx.setLineDash([]);

    /* повёрнутые оси: хвост бледно, наконечник на положительной стороне */
    var e1 = { x: Math.cos(a), y: Math.sin(a) }, e2 = { x: -Math.sin(a), y: Math.cos(a) };
    [[e1, C_X], [e2, C_Y]].forEach(function (p) {
      var e = p[0];
      ctx.strokeStyle = p[1]; ctx.globalAlpha = 0.28; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(X(-e.x * AXL * 0.5), Y(-e.y * AXL * 0.5)); ctx.lineTo(CX, CY); ctx.stroke();
      ctx.globalAlpha = 1;
      strelka(ctx, CX, CY, X(e.x * AXL), Y(e.y * AXL), p[1], 3.4);
    });

    /* где оси пересекают сечение: расстояние K/√I */
    tochka(ctx, X(e1.x * radius(T.xx, T.yy, T.xy, 0)), Y(e1.y * radius(T.xx, T.yy, T.xy, 0)), 6, C_X);
    tochka(ctx, X(e2.x * radius(T.xx, T.yy, T.xy, Math.PI / 2)), Y(e2.y * radius(T.xx, T.yy, T.xy, Math.PI / 2)), 6, C_Y);

    /* дуга угла от исходного направления x до оси x' */
    if (Math.abs(K.alpha) >= 2) {
      ctx.strokeStyle = 'rgba(' + ink + ',.7)'; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.arc(CX, CY, 0.62 * S, -0, -a, a > 0); ctx.stroke();
    }
    tochka(ctx, CX, CY, 4, inkC);

    /* схема эллипсоида инерции внизу слева: сюда не доходят ни подписи осей (они в
       правой и верхней половине сцены), ни хвосты осей (они вдвое короче) */
    shema(ctx, K, ink, muted);
    C.label(ctx, 14, SKT[0], 'эллипсоид инерции', 17, mutC, 'left');
    C.label(ctx, 14, SKT[1], 'сечение плоскостью пластинки', 17, C_EL, 'left');
    C.label(ctx, 10, 26, 'пластинка 2×1 м, 1 кг', 17, mutC, 'left');

    /* ── правая панель: числа и значки; слова стоят слоем KaTeX ── */
    var offCol = K.glavnye ? 'rgba(' + muted + ',.9)' : C_XY;
    mono(ctx, COL1, ROW1, num(T.xx, 3), 34, C_X);
    mono(ctx, COL2, ROW1, num(T.xy, 3), 34, offCol);
    mono(ctx, COL1, ROW2, num(T.xy, 3), 34, offCol);
    mono(ctx, COL2, ROW2, num(T.yy, 3), 34, C_Y);
    skobka(ctx, 640, ROW1 - 32, ROW2 + 12, 1, inkC);
    skobka(ctx, 968, ROW1 - 32, ROW2 + 12, -1, inkC);

    C.label(ctx, PX0, CAPY, 'тензор в повёрнутых осях, блок 2×2, кг·м²', 17, mutC, 'left');

    /* что в матрице как называется: осевые и центробежный названы разными словами */
    tochka(ctx, PX0 + 8, LEG[0], 5.5, C_X); tochka(ctx, PX0 + 22, LEG[0], 5.5, C_Y);
    C.label(ctx, PX0 + 38, LEG[0] + 6, 'осевые моменты, диагональ', 17, inkC, 'left');
    tochka(ctx, PX0 + 8, LEG[1], 5.5, C_XY);
    C.label(ctx, PX0 + 38, LEG[1] + 6, 'центробежный момент, вне диагонали', 17, inkC, 'left');
    C.label(ctx, PX0 + 38, NOTE, 'минус входит в определение, как в главе', 17, mutC, 'left');
    if (K.glavnye) C.label(ctx, PX0, BADGE, 'Оси главные: осевые моменты здесь главные', 17, accC, 'left');
    else C.label(ctx, PX0, BADGE, 'Оси не главные: осевые моменты не главные', 17, mutC, 'left');

    ctx.strokeStyle = 'rgba(' + ink + ',.14)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PX0, SEP); ctx.lineTo(PX1, SEP); ctx.stroke();

    /* то, что от выбора осей не зависит: символ слева (слой KaTeX), слова, число */
    C.label(ctx, PX0, NZ, 'от выбора осей не зависят, кг·м²', 17, mutC, 'left');
    var WX = PX0 + 135;
    C.label(ctx, WX, RY[0], 'сумма осевых (след)', 17, inkC, 'left');
    C.label(ctx, WX, RY[1], 'главный момент', 17, inkC, 'left');
    C.label(ctx, WX, RY[2], 'главный момент', 17, inkC, 'left');
    mono(ctx, PX1, RY[0], num(K.sled, 3), 28, inkC, 'right');
    mono(ctx, PX1, RY[1], num(G.I1, 3), 28, C_EL, 'right');
    mono(ctx, PX1, RY[2], num(G.I2, 3), 28, C_EL, 'right');

  }

  /* ── управление ──────────────────────────────────────── */

  function setAlpha(v) { st.alpha = v; st.spin = false; st.target = null; sync(); }
  function poStoronam() { setAlpha(0); }
  function pod45() { setAlpha(45); }
  function krutit() {
    if (st.spin) { st.spin = false; st.alpha = Math.round(st.alpha); }
    else { st.spin = true; st.target = null; }
    sync();
  }
  /* К главным осям: оси поворачиваются до ближайшего угла, где центробежный
     момент ноль. Угол берётся из текущей матрицы, не из констант. */
  function kGlavnym() {
    var K = kadr(st.alpha), d = K.G.phi / RAD;
    d -= 90 * Math.round(d / 90);                 /* ближайшая главная ориентация: (−45°; 45°] */
    var cel = st.alpha + d;
    if (cel > 90 + 1e-9) cel -= 180;
    if (cel < -90 - 1e-9) cel += 180;
    if (Math.abs(cel - Math.round(cel)) < 1e-6) cel = Math.round(cel);
    if (Math.abs(cel - st.alpha) < 1e-9) return;
    st.spin = false; st.target = cel;
    sync();
  }

  var ref = C.useStage(W, HGT, step, draw);
  var K0 = kadr(st.alpha);
  window.__demoState = snimok();

  /* ── подписи слоем KaTeX поверх канвы ─────────────────── */

  function span(key, x, y, inner, cls) {
    return html`<span key=${key} class=${cls || null}
      style=${{ left: (x / W * 100) + '%', top: (y / HGT * 100) + '%' }}
      dangerouslySetInnerHTML=${{ __html: inner }}></span>`;
  }
  var a = K0.a, labs = [];
  var tip = AXL + 0.23;
  labs.push(span('xs', CX + tip * S * Math.cos(a), CY - tip * S * Math.sin(a), kxc("x'", C_X)));
  labs.push(span('ys', CX - tip * S * Math.sin(a), CY - tip * S * Math.cos(a), kxc("y'", C_Y)));
  if (Math.abs(K0.alpha) >= 6)
    labs.push(span('al', CX + 0.92 * S * Math.cos(a / 2), CY - 0.92 * S * Math.sin(a / 2), kx('\\varphi')));
  /* подписи главных осей стоят внутри сечения, слева от пересечения пунктиров, под
     горизонтальным и левее вертикального: здесь не проходят стрелки повёрнутых осей
     (они уходят вправо и вверх), а хвосты короткие и бледные */
  labs.push(span('p1', CX - 132, 251, 'ось ' + kxs('I_1', C_EL)));
  labs.push(span('p2', CX - 36, 301, 'ось ' + kxs('I_2', C_EL)));
  /* правая панель: слова стоят на канве, здесь только буквы и формулы */
  labs.push(span('c1', COL1, HDR, kxc("x'", C_X)));
  labs.push(span('c2', COL2, HDR, kxc("y'", C_Y)));
  labs.push(span('r1', 604, ROW1 - 12, kxc("x'", C_X)));
  labs.push(span('r2', 604, ROW2 - 12, kxc("y'", C_Y)));
  labs.push(span('def', PX0 + 38, LEG[2], kxs("I_{x'y'} = -\\int x'y'\\,dm"), 'ax-left'));
  labs.push(span('t0', PX0, RY[0] - 6, kxs("I_{x'x'} + I_{y'y'}"), 'ax-left'));
  labs.push(span('t1', PX0, RY[1] - 6, kxs('I_1', C_EL), 'ax-left'));
  labs.push(span('t2', PX0, RY[2] - 6, kxs('I_2', C_EL), 'ax-left'));

  /* Строка показаний: что стало с матрицей и что осталось. */
  var Ac = function (t) { return '<span class="accent">' + t + '</span>'; };
  var s;
  if (K0.glavnye)
    s = 'Оси идут по сторонам пластинки. Центробежный момент ноль, оси главные, и осевые моменты ' +
        Ac(num(K0.T.xx, 3)) + ' и ' + Ac(num(K0.T.yy, 3)) + ' совпадают с главными. ' +
        'Если повернуть оси, пластинка и сечение эллипсоида останутся на месте, а числа в матрице изменятся.';
  else
    s = 'Оси повёрнуты на ' + Ac(num(K0.alpha, 0) + '°') + '. Осевые моменты ' + Ac(num(K0.T.xx, 3)) + ' и ' +
        Ac(num(K0.T.yy, 3)) + ' не главные, потому что центробежный момент ' + Ac(num(K0.T.xy, 3)) + ' не ноль. ' +
        'Сумма осевых ' + Ac(num(K0.sled, 3)) + ' и главные моменты ' + Ac(num(K0.G.I1, 3)) + ' и ' +
        Ac(num(K0.G.I2, 3)) + ' те же, что в осях по сторонам, от поворота они не зависят.';

  return html`
    <div class="demo">
      <div class="controls">
        <${C.Slider} label="Поворот осей:" min=${-90} max=${90} step=${1}
                     value=${ui.alpha} onChange=${setAlpha}
                     display=${num(ui.alpha, 0) + '°'} />
        <${C.Group}>
          <${C.Btn} active=${ui.alpha === 0} onClick=${poStoronam}>По сторонам<//>
          <${C.Btn} active=${ui.alpha === 45} onClick=${pod45}>Под 45°<//>
          <${C.Btn} action=${true} disabled=${K0.glavnye && !ui.anim} onClick=${kGlavnym}>К главным осям<//>
          <${C.Btn} action=${true} onClick=${krutit}>${ui.spin ? 'Стоп' : 'Крутить'}<//>
        <//>
      </div>
      <div class="stage-wrap"
           style=${{ aspectRatio: W + ' / ' + HGT, flex: '0 1 auto', minHeight: 0,
                     height: '100%', width: 'auto', maxWidth: '100%',
                     alignSelf: 'center' }}>
        <canvas class="stage" ref=${ref}></canvas>
        ${/* Слой подписей держит пропорцию кадра и стоит по центру, как в
              pushka-nyutona. Когда страница широкая, обёртка упирается в
              ширину, а по высоте тянется на весь столбец; канва рисует кадр
              по центру (paint в demo-core), а слой с inset: 0 растягивался
              бы на всю обёртку, и подписи уезжали бы от чисел (замер 04.10
              в окне 1280×800: обёртка 1248×671 при кадре 1248×574). Когда
              ведёт высота, обёртка и так равна кадру. */''}
        <div class="ax is-on"
             style=${{ top: '50%', bottom: 'auto', height: 'auto',
                       aspectRatio: W + ' / ' + HGT, transform: 'translateY(-50%)' }}>${labs}</div>
      </div>
      <${C.Status} html=${s} />
    </div>`;
}

C.mount(Demka);
</script>
</body>
</html>
