'use strict';
var C = window.DemoCore, html = C.html;
var useState = React.useState, useRef = React.useRef;

/* ══════════════════ физика ══════════════════

   Блок главы `vrashchenie-vokrug-osi`, шаг «Скамья» (бриф
   briefs/demki_nedelya06.md, № 4; рамка шестой лекции, §4). Вид сверху.
   Человек стоит на скамье Жуковского с двумя гантелями в разведённых руках
   и сводит руки к груди. Числа брифа демка обязана выдать счётом:
   I от 3,85 до 1,76 кг·м², ω от 3,14 до 6,87 рад/с, K от 19,0 до 41,6 Дж,
   работа рук 22,6 Дж, L_z не меняется.

   МОДЕЛЬ. Скамья крутится на оси без трения, внешних моментов нет. Человек
   со скамьёй, без гантелей, твёрдое тело с моментом инерции I₀ = 1,6 кг·м²
   относительно оси (руки учтены в нём). Гантели по m = 2 кг, обе точечные,
   на расстоянии r от оси, на одной прямой через ось; руки двигают их вдоль
   этой прямой, а сама прямая повёрнута на тот же угол φ, что и человек.
   Момент инерции всей системы I(r) = I₀ + 2mr². Степеней свободы две: r
   задаёт человек, φ получается из динамики.

   УРАВНЕНИЕ ДЛЯ φ. Это уравнение моментов dL_z/dt = M_z при M_z = 0: подшипник
   скамьи без трения, тяжесть и реакция платформы параллельны оси или
   пересекают её, а силы рук внутренние. L_z = I(r) φ̇, поэтому
       dω/dt = −(İ/I) ω,    İ = 4 m r ṙ.
   Оно интегрируется. Момент импульса в модель не закладывается: он снимается
   с состояния как I ω и стоит потому, что внешнего момента нет, как момент
   шарика на нити пятой недели.

   РАБОТА РУК. Рука держит гантель на радиусе r(t). Из радиальной части второго
   закона m(r̈ − rω²) = −F, где F натяжение руки вдоль неё:
       F = m (r ω² − r̈).
   Поперечная часть силы руки работы над системой в сумме не даёт: момент этой
   силы действует на гантели и на туловище с противоположными знаками, а
   угловая скорость у них одна, и мощности сокращаются. Она есть: F_t =
   m (r dω/dt + 2ṙω), на ходу кнопки не больше 4,4 Н на гантель при
   натяжении 15–23 Н, а момент пары на туловище I₀ dω/dt равен −2 r F_t с
   точностью 10⁻¹⁵. Через неё работа рук перетекает в туловище: энергия
   вращения человека со скамьёй растёт с 7,90 до 37,78 Дж, а гантелей падает
   с 11,10 до 3,78 Дж, их скорости r ω уменьшаются с 2,36 до 1,37 м/с. На
   сцене поперечная сила не рисуется, стрелка показывает натяжение. Остаётся
   радиальная часть, и мощность двух рук
       dA/dt = 2 F (−ṙ) = 2 m (r ω² − r̈)(−ṙ).
   Работа набирается интегралом по ходу сведения, вместе с остальным
   состоянием, а не берётся разностью энергий. Энергия K всей системы:
       K = ½ I ω² + m ṙ²
   (вращение и радиальное движение двух гантелей; пока руки стоят, остаётся
   первое слагаемое, L_z²/2I). Подстановкой dK/dt = −2 m r ω² ṙ + 2 m ṙ r̈ =
   dA/dt при любом r̈: тождество следует из уравнения для ω и от закона
   движения рук не зависит. Поэтому печатаемая разность K − K₀ − A проверяет
   согласованность формул и шаг интегрирования и не доказывает закон, а
   показывает, что счёт его не нарушает: K берётся из состояния, A из
   интеграла по силе, и друг друга они не знают.

   КАК ДВИЖУТСЯ РУКИ. Радиус r(t) задаёт человек, это ввод, а не вывод физики.
   Ползунок и кнопки задают команду r_ком. Команда идёт к цели с ограниченной
   скоростью: 0,6 м/с, если руки ведёт ползунок, и (0,75 − 0,20)/3 м/с, если
   нажата «Свести плавно» или «Развести плавно», то есть весь путь за 3 с. Рука
   следит за командой как критически задемпфированный осциллятор,
       r̈ = −2Ω ṙ − Ω² (r − r_ком),    Ω = 20 рад/с.
   Так r и ṙ непрерывны при любых действиях с ползунком, ускорение гантелей
   ограничено, и натяжение руки конечно: рывок команды не превращается в удар. Пять
   уравнений состояния (r, ṙ, φ, ω, A) интегрируются методом Рунге — Кутты
   четвёртого порядка с шагом 1/8000 с.

   ЧИСЛА. I₀ = 1,6 кг·м², гантели по 2 кг, r от 0,75 до 0,20 м (числа
   предложены в lekciya06_demki_minuty.md, № 4); старт при разведённых руках,
   ω = π рад/с, 0,5 оборота в секунду. Тогда I = 1,6 + 4·0,75² = 3,85 и
   1,6 + 4·0,20² = 1,76 кг·м²; L_z = 3,85π = 12,095 кг·м²/с; ω в конце
   12,095/1,76 = 6,872 рад/с, 1,094 оборота в секунду; K = L_z²/2I от 18,999 до
   41,560 Дж, прирост 22,561 Дж. Независимый пересчёт замкнутыми формулами и
   квадратурой Симпсона по силе m r ω² dr даёт те же 22,5613.

   ПРОВЕРКА (04.10, platform/tools/hcheck.mjs: __demoProgon, __demoTick и
   чтение __demoState). «Свести плавно» и подождать до 10 с при шаге 1/8000 с:
   I = 1,76 кг·м², ω = 6,872234 рад/с (1,094 об/с), L_z = 12,095132 кг·м²/с,
   K = 41,560287 Дж, работа рук 22,561299 Дж. Замкнутая формула K₂ − K₁ и
   квадратура Симпсона по силе m r ω² dr, написанные отдельно от демки, дают
   22,5612988. Разность K − K₀ − A за весь ход не больше 7,3·10⁻¹² Дж, уход
   L_z в долях 1,8·10⁻¹³. Сходимость по шагу, ошибка работы против точной:
   6,7·10⁻⁴ Дж при 1/100 с, 1,5·10⁻⁵ при 1/250, 9,0·10⁻⁷ при 1/500,
   5,5·10⁻⁸ при 1/1000, 3,4·10⁻⁹ при 1/2000, 2,1·10⁻¹⁰ при 1/4000,
   2,1·10⁻¹¹ при 1/8000: четвёртый порядок, шаг 1/8000 взят с запасом на
   быстрые ходы ползунка. Размер кадра на результат не влияет: при 1/240, 1/60,
   0,05 и 0,5 с он одинаков до девятого знака. Отрицательный контроль, копия
   правой части с ошибкой 0,1 %: в İ уход L_z 7,8·10⁻⁴ и невязка энергии
   0,045 Дж, в мощности рук невязка 0,023 Дж; проверка такие ошибки ловит.
   Туда и обратно: после «Развести плавно» или ползунка назад ω = π и работа
   0 с точностью не хуже 1·10⁻¹⁰ Дж; 100 циклов за 1400 с при шаге по умолчанию дают уход L_z
   9,3·10⁻¹³ и невязку не больше 3,6·10⁻⁹ Дж. Работа не зависит от пути: к
   0,45 м прямо, через 0,20 м и зигзагом выходит 11,352093 Дж с разбросом
   7,8·10⁻¹¹ (точное 11,352093). Ползунок на краях и в быстрой протяжке с
   разворотами: r остаётся в пределах 0,20 до 0,75 м без заступа, радиальная
   часть энергии не больше 0,72 Дж (по кнопке 0,067), натяжение руки от 6 до 38 Н и
   положительная всё время. */

var I0 = 1.6;                       /* кг·м², человек со скамьёй без гантелей */
var M = 2;                          /* кг, одна гантель; гантелей две */
var R_FAR = 0.75, R_NEAR = 0.20;    /* м, руки разведены и руки у груди */
var W0 = Math.PI;                   /* рад/с, старт: 0,5 оборота в секунду */
var OM_F = 20;                      /* 1/с, частота следящего привода руки: постоянная времени 50 мс */
var T_SVOD = 3;                     /* с, весь путь по кнопке «плавно» */
var V_KNOPKA = (R_FAR - R_NEAR) / T_SVOD;   /* м/с, скорость команды по кнопке */
var V_POLZ = 0.6;                   /* м/с, самая быстрая команда от ползунка */
var SHAG_POLZ = 0.01;               /* шаг ползунка, м */
var H_SUB = 1 / 8000;               /* шаг интегрирования, с */
var EPS_POKOJ = 2e-4;               /* м: руки считаются остановившимися, глаз 0,05 px не различает */
var TWO_PI = 2 * Math.PI;

function inertia(r) { return I0 + 2 * M * r * r; }

/* Правая часть: y = [r, ṙ, φ, ω, A], rc постоянна на шаге. */
function prav(rc, y) {
  var r = y[0], v = y[1], w = y[3];
  var a = -2 * OM_F * v - OM_F * OM_F * (r - rc);      /* ускорение гантелей */
  return [v, a, w, -4 * M * r * v * w / inertia(r), -2 * M * (r * w * w - a) * v];
}
function rk4(rc, y, h) {
  var k1 = prav(rc, y);
  var y2 = y.map(function (x, i) { return x + h / 2 * k1[i]; });
  var k2 = prav(rc, y2);
  var y3 = y.map(function (x, i) { return x + h / 2 * k2[i]; });
  var k3 = prav(rc, y3);
  var y4 = y.map(function (x, i) { return x + h * k3[i]; });
  var k4 = prav(rc, y4);
  return y.map(function (x, i) { return x + h / 6 * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]); });
}

function energiya(s) { return 0.5 * inertia(s.r) * s.w * s.w + M * s.v * s.v; }

function nachalo() {
  var s = {
    t: 0, r: R_FAR, v: 0, fi: 0, w: W0, A: 0,
    rc: R_FAR,                      /* команда на этот момент, после ограничителя скорости */
    cmd: R_FAR,                     /* куда команда идёт: цель */
    vlim: V_POLZ                    /* предельная скорость команды */
  };
  s.K0 = energiya(s);
  return s;
}

/* Один шаг модели на h секунд. */
function shag(s, h) {
  var d = s.cmd - s.rc, lim = s.vlim * h;
  s.rc += d > lim ? lim : d < -lim ? -lim : d;
  var y = rk4(s.rc, [s.r, s.v, s.fi, s.w, s.A], h);
  s.t += h; s.r = y[0]; s.v = y[1]; s.fi = y[2]; s.w = y[3]; s.A = y[4];
}

function velichiny(s) {
  var I = inertia(s.r);
  var Krot = 0.5 * I * s.w * s.w, Krad = M * s.v * s.v;
  var a = -2 * OM_F * s.v - OM_F * OM_F * (s.r - s.rc);
  return {
    I: I, Lz: I * s.w, Krot: Krot, Krad: Krad, K: Krot + Krad,
    a: a, F: M * (s.r * s.w * s.w - a),
    balans: Krot + Krad - s.K0 - s.A
  };
}

/* Руки стоят: команда дошла, рука её догнала. */
function pokoj(s, eps) {
  eps = eps || EPS_POKOJ;
  return Math.abs(s.cmd - s.r) < eps && Math.abs(s.v) < 5 * eps;
}

/* far | near | mid | in | out */
function faza(s) {
  if (pokoj(s)) {
    if (Math.abs(s.r - R_FAR) < 1e-3) return 'far';
    if (Math.abs(s.r - R_NEAR) < 1e-3) return 'near';
    return 'mid';
  }
  var d = Math.abs(s.cmd - s.r) > 1e-3 ? s.cmd - s.r : s.v;
  return d < 0 ? 'in' : 'out';
}

/* Прогон без анимации для автопроверки. opt.legs: список участков
   { cmd, vlim, t }: куда вести руки, с какой скоростью команды и сколько
   секунд считать; opt.h: шаг. По умолчанию один участок: свести по кнопке и
   подождать, пока рука остановится. Отдаёт состояние в конце и худшие
   отклонения за весь прогон. */
function progon(opt) {
  opt = opt || {};
  var h = opt.h || H_SUB;
  var legs = opt.legs || [{ cmd: R_NEAR, vlim: V_KNOPKA, t: 10 }];
  var s = nachalo();
  var L0 = velichiny(s).Lz;
  var worst = { dL: 0, balance: 0, Krad: 0, Fmin: Infinity, Fmax: -Infinity, rmin: s.r, rmax: s.r };
  var ends = [];
  legs.forEach(function (leg) {
    s.cmd = leg.cmd; s.vlim = leg.vlim || V_POLZ;
    var n = Math.round(leg.t / h);
    for (var i = 0; i < n; i++) {
      shag(s, h);
      var q = velichiny(s);
      var dL = Math.abs(q.Lz - L0) / L0;
      if (dL > worst.dL) worst.dL = dL;
      if (Math.abs(q.balans) > worst.balance) worst.balance = Math.abs(q.balans);
      if (q.Krad > worst.Krad) worst.Krad = q.Krad;
      if (q.F < worst.Fmin) worst.Fmin = q.F;
      if (q.F > worst.Fmax) worst.Fmax = q.F;
      if (s.r < worst.rmin) worst.rmin = s.r;
      if (s.r > worst.rmax) worst.rmax = s.r;
    }
    var e = velichiny(s);
    ends.push({ t: s.t, r: s.r, I: e.I, omega: s.w, Lz: e.Lz, K: e.K, work: s.A, balance: e.balans });
  });
  var q1 = velichiny(s);
  return {
    L0: L0, K0: s.K0, end: ends[ends.length - 1], ends: ends, worst: worst,
    I: q1.I, omega: s.w, Lz: q1.Lz, K: q1.K, work: s.A, balance: q1.balans, r: s.r, v: s.v
  };
}

/* Русская запятая и настоящий минус; крохи печатаются нулём. */
function num(v, d) {
  if (Math.abs(v) < 0.5 * Math.pow(10, -d)) v = 0;
  return v.toFixed(d).replace('.', ',').replace('-', '−');
}
function kx(tex) {
  try { return katex.renderToString(tex, { throwOnError: false }); }
  catch (e) { return tex; }
}

/* ══════════════════ сцена ══════════════════

   Слева скамья сверху. Платформа с рисками крутится вместе с человеком:
   плечи, голова с носом, руки и две гантели на концах рук. Пунктиром
   окружности 0,75 и 0,20 м, тонкой линией следы гантелей в неподвижной
   системе: при сведении рук они закручиваются в спираль. У гантелей
   бирюзовые стрелки скоростей и оранжевые стрелки натяжения руки, оно направлено
   к оси. Бирюзовая дуга показывает угловую скорость: её длина растёт вместе
   с ω. Справа показания.

   Размеры человека и платформы (радиус 0,5 м, плечи ±0,19 м) только для вида:
   в счёт они не входят, считаются I₀, m и r. */

var W = 1000, HGT = 440;
var CX = 225, CY = 220, SC = 250;   /* центр сцены на канве и пикселей на метр */
var R_PL = 0.5;                     /* радиус платформы, м */
var SH = 0.19, TOLSH = 0.15;        /* полуширина плеч и толщина туловища, м */
var R_GOL = 0.085;                  /* радиус головы, м */
var SV = 30, SF = 2;                /* пикселей на 1 м/с и на 1 Н */
var DUGA_NA_RAD = 14 * Math.PI / 180;   /* длина дуги ω: 14° на каждый рад/с */
var CV = '#4db6c6', CF = '#e08a52', CL = '#a6c35a';

function strelka(ctx, x0, y0, x1, y1, color, width) {
  var dx = x1 - x0, dy = y1 - y0, Ln = Math.hypot(dx, dy);
  if (Ln < 1) return;
  var ux = dx / Ln, uy = dy / Ln;
  var head = Math.min(12, Ln * 0.42);
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x0, y0); ctx.lineTo(x1 - ux * head * 0.72, y1 - uy * head * 0.72);
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x1 - ux * head - uy * head * 0.34, y1 - uy * head + ux * head * 0.34);
  ctx.lineTo(x1 - ux * head * 0.72, y1 - uy * head * 0.72);
  ctx.lineTo(x1 - ux * head + uy * head * 0.34, y1 - uy * head - ux * head * 0.34);
  ctx.closePath(); ctx.fill();
}

/* Дуга со стрелкой: от угла a0 к углу a1 (углы канвы), наконечник на a1. */
function duga(ctx, x, y, R, a0, a1, color, width) {
  var dir = a1 > a0 ? 1 : -1;
  var head = 12, dA = head / R;
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(x, y, R, a0, a1 - dir * dA * 0.7, dir < 0); ctx.stroke();
  var ex = x + R * Math.cos(a1), ey = y + R * Math.sin(a1);
  var tx = -Math.sin(a1) * dir, ty = Math.cos(a1) * dir;     /* касательная по ходу */
  var nx = Math.cos(a1), ny = Math.sin(a1);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(ex, ey);
  ctx.lineTo(ex - tx * head + nx * head * 0.42, ey - ty * head + ny * head * 0.42);
  ctx.lineTo(ex - tx * head - nx * head * 0.42, ey - ty * head - ny * head * 0.42);
  ctx.closePath(); ctx.fill();
}

function Skamya() {
  var st = useRef({
    s: nachalo(), idet: true, mode: 'polzunok', slider: R_FAR,
    sled: [], sig: '', slovaKey: '', slovaHtml: ''
  }).current;
  var pair = useState({ slider: R_FAR, idet: true, cmd: R_FAR });
  var ui = pair[0], setUi = pair[1];

  function podpis() {
    return faza(st.s) + '|' + (st.mode === 'knopka' ? Math.round(st.slider / SHAG_POLZ) : '') + '|' + st.idet;
  }

  function pokazaniya() {
    var s = st.s, q = velichiny(s);
    window.__demoState = {
      I: q.I, omega: s.w, Lz: q.Lz, K: q.K, work: s.A,
      r: s.r, rDot: s.v, rCommand: s.rc, rTarget: s.cmd, t: s.t, phi: s.fi,
      Krot: q.Krot, Krad: q.Krad, K0: s.K0, balanceError: q.balans,
      tension: q.F, revPerSec: s.w / TWO_PI, phase: faza(s), running: st.idet
    };
  }

  function obnovit() {
    st.sig = podpis();
    setUi({ slider: st.slider, idet: st.idet, cmd: st.s.cmd });
    pokazaniya();
  }

  function step(dt) {
    if (!st.idet) return;
    var s = st.s;
    var n = Math.max(1, Math.round(dt / H_SUB));
    for (var i = 0; i < n; i++) shag(s, dt / n);
    st.sled.push([s.r * Math.cos(s.fi), s.r * Math.sin(s.fi)]);
    if (st.sled.length > 300) st.sled.shift();
    if (st.mode === 'knopka') st.slider = s.rc;
    if (podpis() !== st.sig) obnovit(); else pokazaniya();
  }

  function draw(ctx) {
    var tone = C.tones(ctx), ink = tone.ink, muted = tone.muted, mut = 'rgb(' + muted + ')', inkc = 'rgb(' + ink + ')';
    var acc = 'rgb(' + tone.accent + ')';
    var s = st.s, q = velichiny(s), i;
    function X(x) { return CX + x * SC; }
    function Y(y) { return CY - y * SC; }
    var co = Math.cos(s.fi), si = Math.sin(s.fi);

    /* окружности начального и конечного положения рук */
    ctx.save();
    ctx.setLineDash([5, 6]); ctx.strokeStyle = 'rgba(' + muted + ',.55)'; ctx.lineWidth = 1.2;
    [R_FAR, R_NEAR].forEach(function (R) { ctx.beginPath(); ctx.arc(CX, CY, R * SC, 0, TWO_PI); ctx.stroke(); });
    ctx.restore();
    C.label(ctx, X(R_FAR * 0.71) + 8, Y(-R_FAR * 0.71) + 14, num(R_FAR, 2) + ' м', 17, mut, 'left');
    C.label(ctx, X(R_NEAR * 0.71) + 6, Y(-R_NEAR * 0.71) + 20, num(R_NEAR, 2) + ' м', 17, mut, 'left');

    /* платформа: крутится вместе с человеком, риски показывают скорость */
    ctx.save();
    ctx.translate(CX, CY); ctx.rotate(-s.fi);
    ctx.fillStyle = 'rgba(' + ink + ',.045)'; ctx.strokeStyle = 'rgba(' + muted + ',.55)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(0, 0, R_PL * SC, 0, TWO_PI); ctx.fill(); ctx.stroke();
    for (i = 0; i < 24; i++) {
      var ai = i * TWO_PI / 24, long = i % 6 === 0;
      var r1 = R_PL * SC - (long ? 14 : 7), r2 = R_PL * SC;
      ctx.strokeStyle = long ? 'rgba(' + muted + ',.9)' : 'rgba(' + muted + ',.5)';
      ctx.lineWidth = long ? 2 : 1.2;
      ctx.beginPath();
      ctx.moveTo(r1 * Math.cos(ai), r1 * Math.sin(ai)); ctx.lineTo(r2 * Math.cos(ai), r2 * Math.sin(ai));
      ctx.stroke();
    }
    ctx.restore();

    /* следы гантелей в неподвижной системе */
    if (st.sled.length > 1) {
      ctx.strokeStyle = 'rgba(' + ink + ',.30)'; ctx.lineWidth = 1.5;
      [1, -1].forEach(function (sg) {
        ctx.beginPath();
        for (i = 0; i < st.sled.length; i++) {
          var px = X(sg * st.sled[i][0]), py = Y(sg * st.sled[i][1]);
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
      });
    }

    /* человек: плечи, голова с носом, руки; в системе, повёрнутой на φ */
    ctx.save();
    ctx.translate(CX, CY); ctx.rotate(-s.fi);
    ctx.strokeStyle = 'rgba(' + ink + ',.6)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-SH * SC, 0); ctx.lineTo(-s.r * SC, 0); ctx.moveTo(SH * SC, 0); ctx.lineTo(s.r * SC, 0); ctx.stroke();
    ctx.fillStyle = 'rgba(' + ink + ',.10)'; ctx.strokeStyle = 'rgba(' + ink + ',.7)'; ctx.lineWidth = 1.6;
    C.roundRect(ctx, -(SH * SC + 4), -TOLSH * SC / 2, 2 * (SH * SC + 4), TOLSH * SC, 16);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(' + ink + ',.22)'; ctx.strokeStyle = 'rgba(' + ink + ',.85)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(0, 0, R_GOL * SC, 0, TWO_PI); ctx.fill(); ctx.stroke();
    ctx.fillStyle = acc;
    ctx.beginPath(); ctx.moveTo(-6, -R_GOL * SC + 1); ctx.lineTo(6, -R_GOL * SC + 1); ctx.lineTo(0, -R_GOL * SC - 9); ctx.closePath(); ctx.fill();
    ctx.restore();

    /* гантели, их скорости и натяжение руки; вторая гантель симметрична первой.
       Стрелки рисуются поверх гантели и начинаются в её центре. */
    var tension = q.F;
    [1, -1].forEach(function (sg) {
      var x = sg * s.r * co, y = sg * s.r * si;
      var vx = sg * (s.v * co - s.r * s.w * si), vy = sg * (s.v * si + s.r * s.w * co);
      var bx = X(x), by = Y(y);
      ctx.fillStyle = inkc;
      ctx.beginPath(); ctx.arc(bx, by, 11, 0, TWO_PI); ctx.fill();
      strelka(ctx, bx, by, bx + vx * SV, by - vy * SV, CV, 3);
      if (Math.abs(tension) > 0.3) {
        var Lf = tension * SF;             /* вдоль руки, к оси при F > 0 */
        strelka(ctx, bx, by, bx - sg * co * Lf, by + sg * si * Lf, CF, 3);
      }
    });

    /* угловая скорость: дуга против часовой стрелки, длина растёт с ω */
    var a0 = -0.45, span = Math.max(0.02, s.w * DUGA_NA_RAD);
    duga(ctx, CX, CY, 0.43 * SC, a0, a0 - span, CV, 3);

    /* показания */
    var c1 = 700, c2 = 960;
    C.readout(ctx, c1, 40, 'МОМЕНТ ИМПУЛЬСА, кг·м²/с', num(q.Lz, 3), CL);
    C.readout(ctx, c2, 40, 'ЭНЕРГИЯ K, Дж', num(q.K, 2), CV);
    C.readout(ctx, c1, 130, 'МОМЕНТ ИНЕРЦИИ, кг·м²', num(q.I, 3), inkc);
    C.readout(ctx, c2, 130, 'РАБОТА РУК, Дж', num(s.A, 2), CF);
    C.readout(ctx, c1, 220, 'УГЛОВАЯ СКОРОСТЬ, рад/с', num(s.w, 3), CV);
    C.readout(ctx, c2, 220, 'K − K₀ − A, Дж', num(q.balans, 6), mut);
    C.readout(ctx, c1, 310, 'РАССТОЯНИЕ ДО ОСИ, м', num(s.r, 3), inkc);
    C.readout(ctx, c2, 310, 'ОБОРОТОВ В СЕКУНДУ', num(s.w / TWO_PI, 2), CV);
  }

  var ref = C.useStage(W, HGT, step, draw);
  if (!window.__demoState) pokazaniya();
  window.__demoProgon = progon;

  function nachat() {
    st.s = nachalo(); st.mode = 'polzunok'; st.slider = R_FAR;
    st.sled = []; st.idet = true; obnovit();
  }
  /* Ползунок: команда идёт к его значению с предельной скоростью. */
  function ruki(v) {
    st.mode = 'polzunok';
    st.slider = C.clamp(v, R_NEAR, R_FAR);
    st.s.cmd = st.slider; st.s.vlim = V_POLZ;
    st.idet = true; obnovit();
  }
  /* Кнопки: весь путь за три секунды, ползунок едет вместе с командой. */
  function vesti(cel) {
    st.mode = 'knopka';
    st.s.cmd = cel; st.s.vlim = V_KNOPKA;
    st.idet = true; obnovit();
  }
  function pauza() { st.idet = !st.idet; obnovit(); }

  function slova() {
    var A = function (t) { return '<span class="accent">' + t + '</span>'; };
    var s = st.s, q = velichiny(s), f = faza(s);
    var key = f + '|' + (f === 'mid' ? Math.round(s.r * 1000) : '');
    if (key === st.slovaKey) return st.slovaHtml;
    var I = kx('I'), w = kx(String.raw`\omega`), Lz = kx('L_z'), K = kx('K');
    var t;
    if (f === 'far')
      t = 'Человек на скамье Жуковского держит две гантели по ' + A(M + ' кг') + ' на расстоянии ' + A(num(s.r, 2) + ' м') +
        ' от оси. Скамья вращается без трения, ' + A(num(s.w / TWO_PI, 1) + ' оборота в секунду') + '. Момент инерции ' + I + ' = ' +
        A(num(q.I, 2) + ' кг·м²') + ', момент импульса ' + Lz + ' = ' + A(num(q.Lz, 1) + ' кг·м²/с') +
        '. Оранжевой стрелкой нарисовано натяжение руки, бирюзовыми скорости гантелей. «Свести плавно» подтянет гантели к груди.';
    else if (f === 'in')
      t = 'Руки идут к груди, момент инерции ' + I + ' падает, и угловая скорость ' + w + ' растёт во столько же раз: ' +
        'момент импульса ' + Lz + ' стоит на месте. Натяжение руки направлено к оси, гантели идут туда же, работа положительна, ' +
        'и энергия ' + K + ' растёт на работу рук.';
    else if (f === 'out')
      t = 'Руки расходятся, момент инерции ' + I + ' растёт, и угловая скорость ' + w + ' падает во столько же раз: ' +
        'момент импульса ' + Lz + ' стоит на месте. Натяжение руки по-прежнему направлено к оси, а гантели уходят от неё, ' +
        'работа отрицательна, и энергия ' + K + ' убывает вместе с работой рук.';
    else if (f === 'near')
      t = 'Гантели у груди, на ' + A(num(s.r, 2) + ' м') + ' от оси: ' + I + ' = ' + A(num(q.I, 2) + ' кг·м²') + ' и ' + w + ' = ' +
        A(num(s.w, 2) + ' рад/с') + ' при прежнем моменте импульса. Энергия выросла с ' + A(num(s.K0, 1)) + ' до ' +
        A(num(q.K, 1) + ' Дж') + ', и прирост равен работе рук, ' + A(num(s.A, 1) + ' Дж') +
        '. Твёрдым телом человек с гантелями не является: расстояния между его частями меняются, ' +
        'и внутренние силы мышц совершают работу. У твёрдого тела её нет.';
    else
      t = 'Руки на ' + A(num(s.r, 2) + ' м') + ' от оси: ' + I + ' = ' + A(num(q.I, 2) + ' кг·м²') + ' и ' + w + ' = ' +
        A(num(s.w, 2) + ' рад/с') + ', энергия ' + K + ' = ' + A(num(q.K, 1) + ' Дж') + '. Каким путём руки сюда ни пришли бы, ' +
        'работа рук с начала опыта одна, ' + A(num(s.A, 1) + ' Дж') + '. Момент импульса ' + Lz + ' прежний, ' +
        A(num(q.Lz, 1) + ' кг·м²/с') + '.';
    st.slovaKey = key; st.slovaHtml = t;
    return t;
  }

  return html`
    <div class="demo">
      <div class="controls">
        <${C.Slider} label="Положение рук:" min=${R_NEAR} max=${R_FAR} step=${SHAG_POLZ} value=${ui.slider}
                     onChange=${ruki} display=${num(ui.slider, 2) + ' м'} />
        <${C.Group}>
          <${C.Btn} action=${true} disabled=${ui.cmd <= R_NEAR + 1e-9} onClick=${function () { vesti(R_NEAR); }}>Свести плавно<//>
          <${C.Btn} disabled=${ui.cmd >= R_FAR - 1e-9} onClick=${function () { vesti(R_FAR); }}>Развести плавно<//>
        <//>
        <${C.Group}>
          <${C.Btn} onClick=${pauza}>${ui.idet ? 'Пауза' : 'Пуск'}<//>
          <${C.Btn} onClick=${nachat}>Сброс<//>
        <//>
      </div>
      <canvas class="stage" ref=${ref}></canvas>
      <${C.Status} html=${slova()} />
    </div>`;
}

C.mount(Skamya);
</script>
</body>
</html>
