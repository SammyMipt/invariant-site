<script>
'use strict';
var C = window.DemoCore, html = C.html, O = window.DemoOsc;
var useRef = React.useRef, useState = React.useState;

/* ══════════════════ физика ══════════════════

   Блок главы `period-i-amplituda` (бриф briefs/demki_nedelya07.md, № 2;
   карточка 3 описи lekciya07_demki_minuty.md §1.3; рамка §6, «Демки, по
   отдаче», п. 2). Шаг третьего акта о цене линейности: период маятника
   растёт с амплитудой, у 22,8° на процент, у 50,1° на пять, у 69,3° на
   десять, у 90° на восемнадцать. Решения автора 09.10, п. 1: явление
   показывается и называется словами, термина для него на сцене и в
   подписях нет. Слово «размах» в значении амплитуды не идёт (мелочь 17
   аудита ядра); идентификатор файла прежний, из описи.

   МОДЕЛЬ. Метровый маятник, груз 0,1 кг на лёгком стержне (на нити груз
   при амплитуде больше 90° провис бы с первого мгновения: натяжение в
   крайней точке mg cos φ₀ < 0). Уравнение без линеаризации,

       lφ̈ = −g sin φ,

   его дают и уравнение моментов, и производная энергии по времени.
   Счёт: скоростной Верле из shared/demo-osc.js с шагом T₀/400 = 5,015 мс,
   T₀ = 2π√(l/g) = 2,0061 с, три шага на кадр при 60 кадрах в секунду.
   Время идёт целыми шагами, остаток кадра копится, поэтому снятый период
   не зависит от частоты кадров и совпадает с прогоном без кадров
   (__demoCheck) до последнего знака.

   ТРИ ПЕРИОДА РЯДОМ. Гармонический 2π√(l/g). Точный из сохранения энергии
   (энергетический метод, как в блоке главы под спойлером):
   ½ml²φ̇² − mgl cos φ = −mgl cos φ₀ даёт T = 4√(l/g)·K(sin(φ₀/2)), K через
   среднее арифметико-геометрическое (DemoOsc.pendulumPeriod; имени и
   символа интеграла на сцене нет, рамка §4). Снятый с движения: по
   разворотам, нулям угловой скорости, с кубикой Эрмита; от разворота до
   разворота ровно полпериода, отпущенный из покоя груз разворачивается в
   момент отпускания, поэтому первая оценка есть через полпериода, полный
   период через период.

   ФАЗОВАЯ ПЛОСКОСТЬ стоит на сохранении энергии (решения автора, п. 2):
   кривые семейства и выделенная кривая опыта проведены по уровням энергии,
   φ̇² = (2g/l)(cos φ − cos φ₀); сепаратриса, уровень 2mgl, φ̇ = ±2√(g/l)
   cos(φ/2), отделяет качание от вращения. След точки рисует сам счёт, и
   то, что он ложится на кривую, есть проверка схемы глазом.

   КРИВАЯ ПЕРИОДА. Точки снимаются с того же счёта: каждая амплитуда, на
   которую встаёт ползунок или кнопка, прогоняется без кадров на один
   период (до 2150 шагов при 179,9°), и точка T/T₀ ложится на кривую сразу;
   живой маятник снимает тот же период через период и совпадает с точкой.
   Кнопка «Снять кривую» проходит так 5°, 10°, …, 175° и 179°. Рядом
   тонкой линией точная кривая из энергии и пунктиром первая поправка
   1 + φ₀²/16 (формула Борда главы, под спойлером; ошибается в периоде
   меньше процента до 70°). Отметки 1, 5 и 10 % стоят там, где их находит
   делением пополам точная формула, 18 % при 90° печатается тем же счётом.
   Шкала T/T₀ сверху выбирается по текущей амплитуде из ряда 1,2; 1,5; 2;
   3; 4; 6: на малых углах отметки процентов разнесены, у 170° видно, как
   кривая уходит вверх.

   ВРАЩЕНИЕ. Кнопка «Толкнуть через верх» пускает маятник из нижней точки
   с угловой скоростью 6,5 рад/с, выше 2√(g/l) = 6,264 на сепаратрисе.
   Оборот по сохранению энергии T = 4K(κ)/φ̇₀, κ = 2√(g/l)/φ̇₀ (φ̇² =
   φ̇₀²(1 − κ² sin²(φ/2)), подстановка u = φ/2); с движения по проходам
   нижней точки, угол считается без свёртки.

   ПРОВЕРКА (09.10, hcheck на порту 49822: чтение __demoState после
   __demoTick и прогон __demoCheck; та же физика в node против квадратуры
   Симпсона и РК4 с шагом T₀/20000; отчёт
   briefs/demki_nedelya07_bolshoj-razmah_REPORT.md). Точный период через
   K против квадратуры до 1,6·10⁻¹³. Снятый с движения против точного:
   короче на 1,0·10⁻⁵ при 1°–30°, 8,3·10⁻⁶ при 70°, 7,0·10⁻⁶ при 90°;
   длиннее на 2,2·10⁻⁶ при 170°, 5,2·10⁻⁶ при 179° и 6,6·10⁻⁶ при 179,9°
   (10,766 с). Отметки: 1 % при 22,814°, 5 % при 50,104°, 10 % при
   69,325°, при 90° длиннее на 18,03 %; при 30° 1,74 % и синус меньше угла
   на 4,51 %; при 70° 10,21 %, первая поправка 9,33 %; 170° в 2,44 раза,
   179° в 3,90. Энергия держится до 6,2·10⁻⁵ своей величины над нижней
   точкой и за тысячу периодов не уходит. Оборот при 6,5 рад/с 1,68516 с
   с движения против 1,68535 из энергии, короче на 1,1·10⁻⁴: это ошибка
   схемы второго порядка (при T₀/800 и T₀/1600 вчетверо и в шестнадцать
   раз меньше), у верхней точки маятник идёт медленно, и малая ошибка
   энергии тянет время; поэтому оборот печатается тремя знаками. Снятый
   период не зависит от кадра: 1/60, 1/144, 1/30 и 0,05 с дают одно число
   до последнего знака. Подложенные дефекты ловятся: синус, заменённый
   углом, даёт 2,0060 с при 70° и при 170° против 2,2110 и 4,8935; шаг
   T₀/40 ошибается при 70° на 8,4·10⁻⁴. */

/* ── чистая физика ──────────────────────────────────────────────
   Отсюда до пометки «конец чистой физики» код не знает о браузере и
   прогоняется в node вместе с demo-osc.js. */

var G = 9.81, L1 = 1, M = 0.1;
var TWO_PI = 2 * Math.PI, DEG = Math.PI / 180;
var W0 = Math.sqrt(G / L1);              /* 3,1321 рад/с */
var T0 = TWO_PI / W0;                    /* 2,0061 с */
var SHAGOV = 400;
var H = T0 / SHAGOV;                     /* 5,015 мс */
var V_VRASH = 6.5;                       /* толчок через верх, рад/с */
var OMEGA_SEP = 2 * W0;                  /* 6,264 рад/с внизу на сепаратрисе */

function acc(q) { return -W0 * W0 * Math.sin(q); }

/* Точный период качания и оборота: оба из сохранения энергии */
function Ttochnyj(A) { return O.pendulumPeriod(W0, A); }
function Toborot(v0) {
  var k = OMEGA_SEP / v0;
  return 4 * O.ellipK(k, Math.sqrt((1 - k) * (1 + k))) / v0;
}
function borda(A) { return 1 + A * A / 16; }
function sinGap(A) { return 1 - Math.sin(A) / A; }

/* Энергия, Дж: от низа отсчитана потенциальная, −mgl в нижней точке */
function energiya(s) { return 0.5 * M * L1 * L1 * s.v * s.v - M * G * L1 * Math.cos(s.q); }

/* Новый опыт: из покоя на Adeg градусов или толчок из нижней точки. */
function novyj(Adeg, vrash) {
  var m = { Adeg: Adeg, A: Adeg * DEG, vrash: !!vrash, nakop: 0, Tizm: null, dE: 0,
            povoroty: O.crossing(0), oboroty: O.crossing(1), niz: TWO_PI, sled: [] };
  m.s = vrash ? { t: 0, q: 0, v: V_VRASH } : { t: 0, q: m.A, v: 0 };
  m.s.a = acc(m.s.q);
  if (vrash) m.oboroty.mark(0, 1);       /* старт в нижней точке */
  else m.povoroty.mark(0, -1);           /* разворот справа в момент отпускания */
  m.E0 = energiya(m.s);
  m.Eshk = m.E0 + M * G * L1;            /* энергия над нижней точкой */
  m.Tex = vrash ? Toborot(V_VRASH) : Ttochnyj(m.A);
  m.dlinaSleda = Math.min(2600, Math.ceil(1.02 * m.Tex / H));
  m.sled.push([svernut(m.s.q), m.s.v]);
  return m;
}

function svernut(q) { return q - TWO_PI * Math.round(q / TWO_PI); }

function shag(m) {
  var s = m.s, t0 = s.t, q0 = s.q, v0 = s.v, a0 = s.a;
  O.verlet(s, acc, H);
  if (m.vrash) {
    /* проход нижней точки: угол без свёртки пересекает 2πn */
    if (m.oboroty.feed(t0, q0 - m.niz, s.t, s.q - m.niz, v0, s.v) != null) {
      m.niz += TWO_PI;
      m.Tizm = m.oboroty.period();
    }
  } else if (m.povoroty.feed(t0, v0, s.t, s.v, a0, s.a) != null) {
    var T = m.povoroty.period(), half = m.povoroty.half();
    m.Tizm = T != null ? T : (half != null ? 2 * half : null);
  }
  var e = Math.abs(energiya(s) - m.E0) / m.Eshk;
  if (e > m.dE) m.dE = e;
  m.sled.push([svernut(s.q), s.v]);
  if (m.sled.length > m.dlinaSleda) m.sled.shift();
}

/* Продвинуть на dt модельного времени целыми шагами; остаток копится. */
function prodvinut(m, dt) {
  m.nakop += dt;
  var n = Math.floor(m.nakop / H + 1e-9);
  if (n > 20000) n = 20000;
  for (var i = 0; i < n; i++) shag(m);
  m.nakop -= n * H;
  if (m.nakop < 0) m.nakop = 0;
}

/* Полный опыт без кадров: качание до полного периода (два разворота
   после отпускания), вращение до первого полного оборота. */
function dovesti(m) {
  var guard = 0;
  while (guard++ < 40 * SHAGOV) {
    shag(m);
    if (m.vrash ? m.oboroty.count >= 2 : m.povoroty.count >= 3) break;
  }
  return m;
}

/* Амплитуда, при которой точный период длиннее гармонического в r раз:
   деление пополам, период от амплитуды растёт монотонно. */
function amplitudaDlya(r) {
  var lo = 1e-6, hi = Math.PI - 1e-9;
  for (var i = 0; i < 200; i++) {
    var mid = 0.5 * (lo + hi);
    if (Ttochnyj(mid) / T0 < r) lo = mid; else hi = mid;
  }
  return 0.5 * (lo + hi) / DEG;
}
var OTMETKI = [
  { pct: 1, Adeg: amplitudaDlya(1.01) },
  { pct: 5, Adeg: amplitudaDlya(1.05) },
  { pct: 10, Adeg: amplitudaDlya(1.10) },
  { pct: (Ttochnyj(90 * DEG) / T0 - 1) * 100, Adeg: 90 }
];

/* Сводка опыта: то, что демка утверждает, в СИ (углы ещё и в градусах). */
function svodka(m) {
  var r = m.Tizm != null ? m.Tizm / T0 : null;
  return {
    mode: m.vrash ? 'вращение' : 'качание',
    rotating: m.vrash,
    amp: m.vrash ? null : m.Adeg, ampRad: m.vrash ? null : m.A,
    v0: m.vrash ? V_VRASH : 0,
    t: m.s.t, q: svernut(m.s.q), v: m.s.v,
    T0: T0, h: H,
    T: m.Tizm, Texact: m.Tex,
    ratio: m.vrash ? null : r,
    ratioExact: m.vrash ? null : m.Tex / T0,
    percent: m.vrash || r == null ? null : (r - 1) * 100,
    borda: m.vrash ? null : borda(m.A),
    sinGap: m.vrash ? null : sinGap(m.A),
    E: energiya(m.s), E0: m.E0, dE: m.dE,
    separatrix: { E: 2 * M * G * L1, omegaBottom: OMEGA_SEP },
    turns: m.vrash ? m.oboroty.count - 1 : m.povoroty.count - 1
  };
}

function progon(Adeg, vrash) { return svodka(dovesti(novyj(Adeg, vrash))); }
/* ── конец чистой физики ── */

/* Русская запятая и настоящий минус */
function num(v, d) {
  if (v == null || !isFinite(v)) return '—';
  if (Math.abs(v) < 0.5 * Math.pow(10, -d)) v = 0;
  return v.toFixed(d).replace('.', ',').replace('-', '−');
}
function sek(t) { return t == null ? '—' : num(t, t < 10 ? 4 : 3); }
function procent(p) { return p == null ? '—' : num(p, p < 10 ? 2 : p < 100 ? 1 : 0); }
function gradus(a) { return num(a, Math.abs(a - Math.round(a)) < 1e-9 ? 0 : 1) + '°'; }

/* ══════════════════ сцена ══════════════════

   Слева маятник, в середине фазовая плоскость (угол, угловая скорость),
   справа период против амплитуды в долях гармонического. Внизу четыре
   показания. Цвета данных от темы не зависят: движение бирюзовое, точный
   счёт из энергии оранжевый, сепаратриса малиновая. */

var W = 1000, HGT = 460;
var PVX = 112, PVY = 158, PVL = 96;              /* маятник */
var FX0 = 228, FX1 = 592, FY0 = 52, FY1 = 268;  /* фазовая плоскость */
var FQ = 195 * DEG, FV = 8.4;                    /* её полуокна: угол и скорость */
var PX0 = 668, PX1 = 978, PY0 = 62, PY1 = 262;   /* кривая периода */
var RY = 340, RX = [300, 520, 745, 980];          /* показания */
var CV_DV = '77,182,198';                        /* движение */
var CV_EX = '224,138,82';                        /* точный счёт из энергии */
var CV_SEP = '214,92,132';                       /* сепаратриса */
var SHKALY = [1.2, 1.5, 2, 3, 4, 5, 6];
var PROHOD = [];                                 /* «Снять кривую» */
for (var ap = 5; ap <= 175; ap += 5) PROHOD.push(ap);
PROHOD.push(179);

/* Верх шкалы T/T₀: по текущей амплитуде, а пока идёт «Снять кривую» и
   до следующей смены опыта, по всем снятым точкам. */
function shkala(r) {
  var need = 1.04 * r;
  for (var i = 0; i < SHKALY.length; i++) if (SHKALY[i] >= need) return SHKALY[i];
  return SHKALY[SHKALY.length - 1];
}
function shkalaDlya(m, tochki) {
  var r = m.vrash ? 0 : m.Tex / T0;
  if (tochki) for (var k in tochki) if (tochki[k].ratio > r) r = tochki[k].ratio;
  return r ? shkala(r) : null;
}

var pokaz = {};
window.__demoState = pokaz;

function BolshojRazmah() {
  var ref0 = useRef(null);
  if (!ref0.current) {
    var m0 = novyj(30, false);
    ref0.current = { m: m0, A: 30, vrash: false, run: true, tochki: {}, ochered: [],
                     nakopProhod: 0, ytop: shkalaDlya(m0), faza: '' };
  }
  var S = ref0.current;
  var pair = useState({ A: 30, vrash: false, run: true, faza: '' });
  var ui = pair[0], setUi = pair[1];

  /* Точка кривой: период, снятый с того же счёта без кадров */
  function tochka(Adeg) {
    var key = Math.round(Adeg * 10);
    if (S.tochki[key]) return;
    var sv = progon(Adeg, false);
    S.tochki[key] = { Adeg: Adeg, T: sv.T, ratio: sv.ratio };
  }
  function spisokTochek() {
    return Object.keys(S.tochki).map(function (k) { return S.tochki[k]; })
      .sort(function (a, b) { return a.Adeg - b.Adeg; });
  }
  if (!Object.keys(S.tochki).length) tochka(S.A);

  function faza() {
    var m = S.m;
    return (m.Tizm != null ? 'T' + sek(m.Tizm) : 'zhdem') + '/' + Object.keys(S.tochki).length;
  }
  function zapolnit() {
    Object.assign(pokaz, svodka(S.m));
    pokaz.running = S.run;
    pokaz.ytop = S.ytop;
    pokaz.points = spisokTochek().map(function (p) { return { amp: p.Adeg, T: p.T, ratio: p.ratio }; });
    pokaz.marks = OTMETKI.map(function (o) { return { percent: o.pct, amp: o.Adeg }; });
  }
  function snyat() {
    zapolnit();
    var f = faza();
    if (f !== S.faza) {
      S.faza = f;
      setUi(function (u) { return Object.assign({}, u, { faza: f }); });
    }
  }
  if (!pokaz.mode) zapolnit();

  function step(dt) {
    /* «Снять кривую»: сорок амплитуд в секунду, независимо от паузы */
    if (S.ochered.length) {
      S.nakopProhod += dt;
      while (S.ochered.length && S.nakopProhod >= 1 / 40) {
        tochka(S.ochered.shift());
        S.nakopProhod -= 1 / 40;
      }
      if (!S.ochered.length) S.nakopProhod = 0;
    }
    /* шкала T/T₀ плавно идёт к нужной */
    var cel = shkalaDlya(S.m, S.prohod ? S.tochki : null);
    if (cel != null && S.ytop !== cel) {
      S.ytop += (cel - S.ytop) * Math.min(1, dt * 8);
      if (Math.abs(S.ytop - cel) < 1e-3) S.ytop = cel;
    }
    if (S.run) prodvinut(S.m, dt);
    snyat();
  }

  /* ── примитивы ── */

  function punktir(ctx, x0, y0, x1, y1, color, w, dash) {
    ctx.save(); ctx.setLineDash(dash || [5, 5]); ctx.strokeStyle = color; ctx.lineWidth = w || 1.4;
    ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); ctx.restore();
  }
  function shar(ctx, x, y, r, rgb) {
    ctx.fillStyle = 'rgb(' + rgb + ')';
    ctx.beginPath(); ctx.arc(x, y, r, 0, TWO_PI); ctx.fill();
  }
  function liniya(ctx, pts, color, w, dash) {
    ctx.save();
    if (dash) ctx.setLineDash(dash);
    ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath();
    for (var i = 0; i < pts.length; i++) {
      if (pts[i] == null) continue;
      if (i && pts[i - 1] != null) ctx.lineTo(pts[i][0], pts[i][1]); else ctx.moveTo(pts[i][0], pts[i][1]);
    }
    ctx.stroke(); ctx.restore();
  }

  /* ── маятник ── */

  function mayatnik(ctx, m, ink, mut) {
    var inkS = 'rgba(' + ink + ',.85)', mutS = 'rgba(' + mut + ',.95)';
    var q = m.s.q;
    var bx = PVX + PVL * Math.sin(q), by = PVY + PVL * Math.cos(q);
    /* окружность, по которой ходит груз, и вертикаль */
    ctx.strokeStyle = 'rgba(' + ink + ',.14)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(PVX, PVY, PVL, 0, TWO_PI); ctx.stroke();
    punktir(ctx, PVX, PVY - PVL - 12, PVX, PVY + PVL + 14, mutS);
    if (!m.vrash) {
      /* дуга амплитуды: от −φ₀ до φ₀, угол от вертикали вниз */
      ctx.save(); ctx.strokeStyle = 'rgba(' + CV_EX + ',.9)'; ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(PVX, PVY, PVL + 16, Math.PI / 2 - m.A, Math.PI / 2 + m.A);
      ctx.stroke(); ctx.restore();
      var ex = PVX + (PVL + 16) * Math.sin(m.A), ey = PVY + (PVL + 16) * Math.cos(m.A);
      shar(ctx, ex, ey, 3.5, CV_EX);
      shar(ctx, 2 * PVX - ex, ey, 3.5, CV_EX);
    }
    /* стержень, ось, груз */
    ctx.strokeStyle = inkS; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(PVX, PVY); ctx.lineTo(bx, by); ctx.stroke();
    shar(ctx, bx, by, 11, CV_DV);
    ctx.fillStyle = 'rgb(' + ink + ')';
    ctx.beginPath(); ctx.arc(PVX, PVY, 4.5, 0, TWO_PI); ctx.fill();
    C.label(ctx, PVX, 30, m.vrash ? 'толчок ' + num(V_VRASH, 2) + ' рад/с' : 'φ₀ = ' + gradus(m.Adeg), 17,
            m.vrash ? 'rgb(' + CV_DV + ')' : 'rgb(' + CV_EX + ')');
    C.label(ctx, PVX, 298, 'l = 1 м, стержень', 17, mutS);
  }

  /* ── фазовая плоскость ── */

  function faz(ctx, m, ink, mut) {
    var mutS = 'rgba(' + mut + ',.95)', i, u, f;
    var cx = (FX0 + FX1) / 2, cy = (FY0 + FY1) / 2;
    function X(q) { return cx + q / FQ * (FX1 - FX0) / 2; }
    function Y(v) { return cy - v / FV * (FY1 - FY0) / 2; }
    C.label(ctx, FX0, 30, 'фазовая плоскость', 17, mutS, 'left');
    /* легенда сепаратрисы в шапке */
    C.label(ctx, FX1, 30, 'сепаратриса', 17, 'rgb(' + CV_SEP + ')', 'right');
    var wl = ctx.measureText('сепаратриса').width;
    liniya(ctx, [[FX1 - wl - 36, 24], [FX1 - wl - 10, 24]], 'rgb(' + CV_SEP + ')', 2.4);

    ctx.strokeStyle = 'rgba(' + ink + ',.25)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(FX0, cy); ctx.lineTo(FX1, cy); ctx.moveTo(cx, FY0); ctx.lineTo(cx, FY1); ctx.stroke();

    ctx.save();
    ctx.beginPath(); ctx.rect(FX0, FY0 - 4, FX1 - FX0, FY1 - FY0 + 8); ctx.clip();

    /* семейство качаний: уровни энергии, φ = φ₀ sin u */
    function kachanie(A, color, w) {
      [1, -1].forEach(function (zn) {
        var pts = [];
        for (i = 0; i <= 160; i++) {
          u = -Math.PI / 2 + Math.PI * i / 160;
          f = A * Math.sin(u);
          var v = W0 * Math.sqrt(Math.max(0, 2 * (Math.cos(f) - Math.cos(A))));
          pts.push([X(f), Y(zn * v)]);
        }
        liniya(ctx, pts, color, w);
      });
    }
    function vrashchenie(v0, color, w, odnaVetv) {
      (odnaVetv ? [1] : [1, -1]).forEach(function (zn) {
        var pts = [];
        for (i = 0; i <= 240; i++) {
          f = -FQ + 2 * FQ * i / 240;
          var v = Math.sqrt(Math.max(0, v0 * v0 - 2 * W0 * W0 * (1 - Math.cos(f))));
          pts.push([X(f), Y(zn * v)]);
        }
        liniya(ctx, pts, color, w);
      });
    }
    var tonko = 'rgba(' + ink + ',.2)';
    for (var a = 20; a <= 160; a += 20) kachanie(a * DEG, tonko, 1.2);
    vrashchenie(6.9, tonko, 1.2);
    vrashchenie(7.8, tonko, 1.2);
    /* сепаратриса: φ̇ = ±2√(g/l) cos(φ/2); за ±180° её ветви меняются
       местами, и в верхней точке получается крест */
    [1, -1].forEach(function (zn) {
      var pts = [];
      for (i = 0; i <= 240; i++) {
        f = -FQ + 2 * FQ * i / 240;
        pts.push([X(f), Y(zn * OMEGA_SEP * Math.cos(f / 2))]);
      }
      liniya(ctx, pts, 'rgb(' + CV_SEP + ')', 2.2);
    });
    /* след счёта широкой полосой, поверх неё тонко кривая опыта из
       энергии: тонкая линия идёт по середине полосы */
    var sl = m.sled, pts = [];
    for (i = 0; i < sl.length; i++) {
      if (i && Math.abs(sl[i][0] - sl[i - 1][0]) > Math.PI) pts.push(null);
      pts.push([X(sl[i][0]), Y(sl[i][1])]);
    }
    liniya(ctx, pts, 'rgba(' + CV_DV + ',.7)', 6);
    if (m.vrash) vrashchenie(V_VRASH, 'rgb(' + CV_EX + ')', 1.8, true);
    else kachanie(m.A, 'rgb(' + CV_EX + ')', 1.8);
    shar(ctx, X(svernut(m.s.q)), Y(m.s.v), 7, CV_DV);
    ctx.restore();

    /* верхняя точка: сёдла сепаратрисы, нижняя: центр */
    [-Math.PI, Math.PI].forEach(function (q) {
      ctx.strokeStyle = 'rgb(' + CV_SEP + ')'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(X(q), cy, 5, 0, TWO_PI); ctx.stroke();
    });
    /* подписи: в углах над и под вращениями кривых нет */
    C.label(ctx, X(125 * DEG), Y(7.4), 'вращение', 17, mutS);
    C.label(ctx, X(-125 * DEG), Y(-7.4) + 12, 'вращение', 17, mutS);
    C.label(ctx, FX0 + 4, FY0 + 12, 'угловая скорость', 17, mutS, 'left');
    C.label(ctx, FX1 + 6, cy + 6, 'угол', 17, mutS, 'left');
    var ya = FY1 + 22;
    C.label(ctx, X(-Math.PI), ya, '−180°', 17, mutS);
    C.label(ctx, X(0), ya, '0', 17, mutS);
    C.label(ctx, X(Math.PI), ya, '180°', 17, mutS);
  }

  /* ── кривая периода ── */

  function grafik(ctx, m, ink, mut) {
    var mutS = 'rgba(' + mut + ',.95)', ytop = S.ytop, i, a;
    function X(adeg) { return PX0 + adeg / 180 * (PX1 - PX0); }
    function Y(r) { return PY1 - (r - 1) / (ytop - 1) * (PY1 - PY0); }
    C.label(ctx, PX0 - 30, 30, 'период против амплитуды', 17, mutS, 'left');

    /* оси; ось абсцисс стоит на гармоническом периоде */
    ctx.strokeStyle = 'rgba(' + ink + ',.55)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(PX0, PY0 - 4); ctx.lineTo(PX0, PY1); ctx.lineTo(PX1, PY1); ctx.stroke();
    C.label(ctx, PX0 - 6, PY1 + 6, '1', 17, mutS, 'right');
    C.label(ctx, PX0 - 6, PY0 + 6, num(ytop, ytop < 2 && Math.abs(ytop * 10 - Math.round(ytop * 10)) < 1e-6 ? 1 : ytop < 2 ? 2 : 0), 17, mutS, 'right');
    C.label(ctx, PX0 + 6, PY0 - 8, 'T / T₀', 17, mutS, 'left');

    ctx.save();
    ctx.beginPath(); ctx.rect(PX0, PY0 - 4, PX1 - PX0 + 6, PY1 - PY0 + 6); ctx.clip();
    /* первая поправка пунктиром, точная кривая из энергии */
    var pb = [], pe = [];
    for (i = 0; i <= 360; i++) {
      a = 180 * i / 360;
      pb.push([X(a), Y(borda(a * DEG))]);
      if (a > 0 && a < 180) pe.push([X(a), Y(Ttochnyj(a * DEG) / T0)]);
    }
    for (i = 1; i <= 20; i++) { a = 179.5 + 0.5 * (1 - Math.pow(0.5, i)); pe.push([X(a), Y(Ttochnyj(a * DEG) / T0)]); }
    liniya(ctx, pb, mutS, 1.6, [6, 5]);
    liniya(ctx, pe, 'rgba(' + CV_EX + ',.9)', 2);

    /* отметки процентов */
    var zanyato = [];
    OTMETKI.forEach(function (o, k) {
      var x = X(o.Adeg), y = Y(1 + o.pct / 100);
      punktir(ctx, x, PY1, x, y, 'rgba(' + mut + ',.7)', 1.2, [3, 4]);
      ctx.strokeStyle = 'rgb(' + CV_EX + ')'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, 4.5, 0, TWO_PI); ctx.stroke();
    });

    /* точки, снятые с движения; выше шкалы они уходят за край, как и
       точная кривая */
    spisokTochek().forEach(function (p) {
      if (p.ratio != null) shar(ctx, X(p.Adeg), Y(p.ratio), 4, CV_DV);
    });
    /* текущий опыт */
    if (!m.vrash && m.Tizm != null) {
      var yc = Y(m.Tizm / T0);
      ctx.strokeStyle = 'rgb(' + CV_DV + ')'; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.arc(X(m.Adeg), yc, 8, 0, TWO_PI); ctx.stroke();
    }
    ctx.restore();

    /* подписи отметок: проценты у точки, пока шкала не выше 2 (дальше
       точки прижаты к оси и подписи путались бы с соседями), градусы под
       осью в два ряда; подпись, которая налезла бы на поставленную, не
       ставится */
    OTMETKI.forEach(function (o, k) {
      var x = X(o.Adeg), y = Y(1 + o.pct / 100);
      var t = num(o.pct, 0) + ' %';
      ctx.font = '17px "Golos Text", system-ui, sans-serif';
      var w = ctx.measureText(t).width, box = [x - 6 - w, y - 24, x - 6, y - 6];
      var stolk = zanyato.some(function (b) { return !(box[2] < b[0] || box[0] > b[2] || box[3] < b[1] || box[1] > b[3]); });
      if (!stolk && ytop <= 2.001 && box[1] > PY0 - 20) {
        C.label(ctx, x - 6, y - 9, t, 17, 'rgb(' + CV_EX + ')', 'right');
        zanyato.push(box);
      }
      C.label(ctx, x, PY1 + (k % 2 ? 42 : 22), gradus(Math.round(o.Adeg * 10) / 10), 17, mutS);
    });
    C.label(ctx, PX1, PY1 + 22, '180°', 17, mutS, 'right');
    C.label(ctx, PX1, PY1 + 42, 'амплитуда', 17, mutS, 'right');

    /* легенда в левом верхнем углу, где кривая не проходит */
    var lx = PX0 + 14, ly = PY0 + 16;
    liniya(ctx, [[lx, ly - 5], [lx + 24, ly - 5]], 'rgba(' + CV_EX + ',.9)', 2);
    C.label(ctx, lx + 32, ly, 'точный', 17, 'rgb(' + CV_EX + ')', 'left');
    shar(ctx, lx + 12, ly + 17, 4, CV_DV);
    C.label(ctx, lx + 32, ly + 22, 'с движения', 17, 'rgb(' + CV_DV + ')', 'left');
    liniya(ctx, [[lx, ly + 39], [lx + 24, ly + 39]], mutS, 1.6, [6, 5]);
    C.label(ctx, lx + 32, ly + 44, '1 + φ₀²/16', 17, mutS, 'left');  }

  /* ── показания ── */

  function kolonki(m) {
    var r = m.Tizm != null ? m.Tizm / T0 : null;
    if (m.vrash) return [
      { c: 'ПОРОГ ВРАЩЕНИЯ, рад/с', v: num(OMEGA_SEP, 2), s: '2√(g/l) в нижней точке' },
      { c: 'ОБОРОТ ТОЧНО, с', v: num(m.Tex, 3), s: 'из сохранения энергии' },
      { c: 'ОБОРОТ С ДВИЖЕНИЯ, с', v: num(m.Tizm, 3), s: m.Tizm != null ? 'шаг T₀/400' : 'ждём оборота' },
      { c: 'СКОРОСТЬ ВНИЗУ, рад/с', v: num(V_VRASH, 2), s: 'выше порога на ' + procent((V_VRASH / OMEGA_SEP - 1) * 100) + ' %' }
    ];
    var s4 = m.Adeg <= 90 ? 'синус меньше угла на ' + procent(sinGap(m.A) * 100) + ' %'
                          : (r != null ? 'в ' + num(r, 2) + ' раза' : '');
    return [
      { c: 'ГАРМОНИЧЕСКИЙ T₀, с', v: sek(T0), s: '2π√(l/g)' },
      { c: 'ТОЧНЫЙ, с', v: sek(m.Tex), s: 'из сохранения энергии' },
      { c: 'С ДВИЖЕНИЯ, с', v: sek(m.Tizm), s: m.Tizm != null ? 'по разворотам, шаг T₀/400' : 'ждём разворота' },
      { c: 'ДЛИННЕЕ ГАРМОНИЧЕСКОГО', v: r != null ? '+' + procent((r - 1) * 100) + ' %' : '—', s: s4 }
    ];
  }

  function draw(ctx) {
    var tone = C.tones(ctx), ink = tone.ink, mut = tone.muted, acc2 = tone.accent;
    var m = S.m;
    mayatnik(ctx, m, ink, mut);
    faz(ctx, m, ink, mut);
    grafik(ctx, m, ink, mut);
    var kol = kolonki(m);
    var cvet = ['rgb(' + ink + ')', 'rgb(' + CV_EX + ')', 'rgb(' + CV_DV + ')', 'rgb(' + acc2 + ')'];
    for (var i = 0; i < 4; i++) {
      C.readout(ctx, RX[i], RY, kol[i].c, kol[i].v, cvet[i]);
      C.label(ctx, RX[i], RY + 66, kol[i].s, 17, 'rgba(' + mut + ',.95)', 'right');
    }
    ctx.textAlign = 'center';
  }

  var ref = C.useStage(W, HGT, step, draw);

  /* ── ручки ── */

  function zagruzit(A, vrash, run) {
    S.A = A; S.vrash = vrash; S.run = run; S.m = novyj(A, vrash); S.faza = null; S.prohod = false;
    if (!vrash) tochka(A);
    snyat();
    setUi({ A: A, vrash: vrash, run: run, faza: S.faza });
  }
  function amplituda(v) {
    var A = Math.min(179, Math.max(1, Math.round(v)));
    if (A !== S.A || S.vrash) zagruzit(A, false, S.run);
  }
  function pusk() { S.run = !S.run; snyat(); setUi(function (u) { return Object.assign({}, u, { run: S.run }); }); }
  function sbros() { zagruzit(S.A, S.vrash, true); }
  function snyatKrivuyu() { S.ochered = PROHOD.slice(); S.nakopProhod = 0; S.prohod = true; }

  /* Для автопроверки: __demoSet({ amp, rotate, run }) ставит опыт;
     __demoCheck(amp, rotate) — прогон без кадров на один период (оборот),
     живую сцену не трогает; __demoSweep() — «Снять кривую». */
  window.__demoSet = function (q) {
    q = q || {};
    zagruzit(q.amp != null ? q.amp : S.A, !!q.rotate, q.run == null ? true : !!q.run);
    return pokaz;
  };
  window.__demoCheck = progon;
  window.__demoSweep = function () { snyatKrivuyu(); return PROHOD.length; };
  window.__demoModel = { novyj: novyj, shag: shag, dovesti: dovesti, svodka: svodka, prodvinut: prodvinut,
                         Ttochnyj: Ttochnyj, Toborot: Toborot, OTMETKI: OTMETKI, H: H, T0: T0 };

  /* ── строка показаний ── */

  function slova() {
    var Ac = function (t) { return '<span class="accent">' + t + '</span>'; };
    var m = S.m;
    if (m.vrash) {
      return 'Маятник толкнули из нижней точки с угловой скоростью ' + Ac(num(V_VRASH, 2) + ' рад/с') +
        ', а на сепаратрисе внизу она 2√(g/l) = ' + num(OMEGA_SEP, 2) + ' рад/с. Энергии хватает пройти верх, и маятник вращается: ' +
        'точка бежит над сепаратрисой и назад не поворачивает. Оборот по сохранению энергии ' + Ac(num(m.Tex, 3) + ' с') +
        (m.Tizm != null ? ', с движения ' + Ac(num(m.Tizm, 3) + ' с') : '') + '. Где кончается яма, кончаются и колебания.';
    }
    var r = m.Tizm != null ? m.Tizm / T0 : null;
    var p = r != null ? (r - 1) * 100 : null;
    var nachalo = 'Маятник 1 м отпущен из покоя с ' + gradus(m.Adeg) + '. Точный период из сохранения энергии ' +
      Ac(sek(m.Tex) + ' с') + (m.Tizm != null ? ', снятый с движения ' + Ac(sek(m.Tizm) + ' с') : ', снятый с движения появится после первого разворота') +
      ', гармонический ' + sek(T0) + ' с.';
    if (r == null) return nachalo;
    if (m.Adeg < OTMETKI[0].Adeg)
      return nachalo + ' Период длиннее гармонического на ' + Ac(procent(p) + ' %') + ': до ' + gradus(Math.round(OTMETKI[0].Adeg * 10) / 10) +
        ' поправка меньше процента.';
    if (m.Adeg <= 90)
      return nachalo + ' Синус угла меньше самого угла на ' + Ac(procent(sinGap(m.A) * 100) + ' %') +
        ', а период длиннее гармонического на ' + Ac(procent(p) + ' %') + '.';
    var hvost = m.Adeg >= 179 ? ' Энергии почти хватает дойти до верха: кривая опыта прижата к сепаратрисе, и маятник подолгу стоит у верхней точки.'
                              : ' Чем ближе амплитуда к 180°, тем дольше маятник стоит у верхней точки.';
    return nachalo + ' Период длиннее гармонического в ' + Ac(num(r, 2) + ' раза') + '.' + hvost +
      ' Груз держит стержень: на нити при амплитуде больше 90° он провис бы сразу.';
  }

  var PRESET = [14, 30, 70, 170, 179.9];
  return html`
    <div class="demo">
      <div class="controls">
        <${C.Slider} label="Амплитуда:" min=${1} max=${179} step=${1} value=${Math.min(179, ui.A)}
                     onChange=${amplituda} display=${ui.vrash ? '—' : gradus(ui.A)} />
        <${C.Group} label="Отпустить с:">
          ${PRESET.map(function (a) {
            return html`<${C.Btn} key=${a} active=${!ui.vrash && ui.A === a} onClick=${function () { zagruzit(a, false, true); }}>${gradus(a)}<//>`; })}
          <${C.Btn} active=${ui.vrash} onClick=${function () { zagruzit(S.A, true, true); }}>Толкнуть через верх<//>
        <//>
        <${C.Group}>
          <${C.Btn} onClick=${snyatKrivuyu}>Снять кривую<//>
          <${C.Btn} action=${true} onClick=${pusk}>${ui.run ? 'Пауза' : 'Пуск'}<//>
          <${C.Btn} onClick=${sbros}>Сброс<//>
        <//>
      </div>
      <canvas class="stage" ref=${ref}></canvas>
      <${C.Status} html=${slova()} />
    </div>`;
}

C.mount(BolshojRazmah);
</script>
</body>
</html>
