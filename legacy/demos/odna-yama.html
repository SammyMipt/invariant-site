/* ══════════════════ физика ══════════════════

   Блоки главы `chastota-iz-krivizny`, `ot-ravnovesiya-k-kolebaniyam`,
   `kolebaniya-bez-linejnosti`, `postoyannaya-sila` (бриф
   briefs/demki_nedelya07.md, № 1; карточка 2 описи
   lekciya07_demki_minuty.md §1.3 с тремя правками рамки §6; правило
   методов из решений автора, lekciya07_resheniya_ramki.md, п. 2). Первый
   пункт тезиса: около устойчивого равновесия малые колебания систем с
   разными законами идут по одному уравнению αq̈ + κq = 0, и частоту задают
   кривизна потенциала и инерция, ω² = κ/α.

   ТРИ ПЕРИОДА РЯДОМ. По формуле главы для этой системы; по кривизне,
   посчитанной из самой U численно, 2π√(α/κ), κ = d²U/dq² в q*; снятый с
   движения. Формула в показания по кривизне не заходит: демка знает
   только функцию U(q) и коэффициент инерции α из кинетической энергии.

   ЭНЕРГЕТИЧЕСКИЙ МЕТОД (все пресеты). Полная энергия
   E = ½αq̇² + U(q) сохраняется; её производная по времени даёт уравнение
   движения αq̈ = −dU/dq, и его демка интегрирует без линеаризации.
   Положение равновесия q* ищется делением пополам как место, где dU/dq
   меняет знак; dU/dq и d²U/dq² берутся центральными разностями. Кривизна
   классифицируется числом: d²U/dq² с шагом δ и δ/10 совпадают у гладкой
   U, у излома вторая разность растёт как 1/δ (жёлоб); если ½(d²U/dq²)·L²
   меньше 10⁻⁴ подъёма U на масштабе L, кривизна считается нулём
   (U ∝ x⁴); отрицательная кривизна означает вершину (перевёрнутый
   маятник). Потенциал есть у самой задачи во всех пресетах, поэтому
   кривизна называется везде (решения автора, п. 2).

   ПРАВКА 10.10 по вычитке автора (briefs/lekciya07_vychitka_avtora_10-10.md,
   замечание 4, вариант А): маятник в разгоняющемся вагоне ушёл из главы и
   из демки вместе с динамическим видом 'ur' (уравнение для угла, линейный
   член, правая часть на стоянке). На его месте пружина и маятник на Луне,
   g = 1,62 м/с² (NASA NSSDC, Moon Fact Sheet, surface gravity 1.62 m/s²).

   ПРЕСЕТЫ. «Одно уравнение»: пружина 10 Н/м с грузом 0,1 кг (κ = k,
   α = m, 0,6283 с); маятник 1 м, груз 0,1 кг (κ = mgl, α = ml², 2,0061 с);
   стержень 1 м на оси через конец, 0,1 кг (κ = mgl/2, α = I_A = ml²/3,
   1,6379 с); контур 1 мГн и 1 мкФ (κ = 1/C, α = L, 0,1987 мс; время на
   экране замедлено в 10⁴ раз, период на экране около двух секунд, как у
   маятника); тележки 1 и 3 кг на пружине 20 Н/м (κ = k, α = μ = 0,75 кг из
   кинетической энергии относительного движения, 1,2167 с). У тележек
   движение считается вторым законом для каждой тележки в отдельности,
   период снимается со следа их относительной координаты, центр масс
   стоит; рецепт по-прежнему читает энергию. Ответы двух методов
   совпадают, это и показывается.
   «Где меняется и где молчит»: та же пружина вертикально,
   U = ky²/2 − mgy, y вниз от конца ненагруженной пружины: минимум уходит
   на mg/k = 9,81 см, кривизна та же, период тот же (потенциал здесь есть у
   самой задачи, и кривизну можно назвать). Те же пружина и маятник на
   Луне, g = 1,62 м/с²: у пружины минимум уходит на 1,62 см, кривизна и
   период 0,6283 с прежние; у маятника κ = mgl = 0,162 Н·м вместо 0,981,
   период 2π√(l/g) = 4,9365 с против 2,0061 на Земле, в √(9,81/1,62) =
   2,4608 раза дольше. U = cx⁴, c = 2000 Дж/м⁴,
   груз 0,1 кг: d²U/dx² = 0 в нуле, рецепт частоты не даёт, период
   T = 2K(1/√2)/(A√(c/m)) = 3,708/(A√(c/m)) обратно пропорционален
   амплитуде (0,5244 с при 5 см). Жёлоб: ускорение вдоль стенки
   a = 1 м/с², U = ma|s|, излом на дне, T = 4√(2A/a) (0,5657 с при 1 см,
   1,1314 с при 4 см). Перевёрнутый маятник 1 м, отпущенный из покоя в φ₀
   от верхней точки: d²U/dφ² = −mgl, отклонение φ₀ ch(t/τ), τ = √(l/g), растёт в
   e раз за τ·arch e = 0,5292 с (рамка §6: «около 0,53 с»).

   СЧЁТ. Скоростной Верле из shared/demo-osc.js, шаг 1/400 характерного
   периода: по кривизне у гармонических, по формуле при текущей амплитуде
   у x⁴ и жёлоба, 2πτ у перевёрнутого. Время идёт целыми шагами, остаток
   кадра копится, поэтому числа не зависят от частоты кадров и совпадают с
   прогоном без кадров (__demoCheck). Жёлоб считается точно: сила на каждой
   стенке постоянна, Верле на ней точен, а переход через излом ловится
   событием, момент находится из квадратного уравнения, и шаг делится в
   нём (у разрыва силы Верле иначе теряет порядок). Период снимается по
   разворотам, нулям скорости, с кубикой Эрмита; время от разворота до
   разворота у консервативного движения ровно полпериода и в
   несимметричной яме. Отпущенный из покоя груз разворачивается в момент
   отпускания, поэтому первая оценка периода есть через полпериода.

   ПРОВЕРКА (09.10, hcheck: чтение __demoState после __demoTick и прогон
   __demoCheck, та же физика в node; отчёт
   briefs/demki_nedelya07_odna-yama_REPORT.md). Снятый период против
   точного короче на 1,03·10⁻⁵ у гармонических (ошибка схемы при T/400) и
   на 5,3·10⁻⁶ у x⁴; у маятника при 5° 2,00700 против 2,00702 через K(k),
   при 30° 2,0410, на 1,74 % длиннее формулы; у жёлоба совпадает с
   4√(2A/a) до 10⁻¹³.
   Энергия держится до 6,2·10⁻⁵ своей величины, у x⁴ до 1,1·10⁻⁴, у
   жёлоба до 10⁻¹³, и не уходит. Кривизна из U против формулы до 5·10⁻¹⁰,
   равновесие вертикальной пружины 9,8100 см. Рост перевёрнутого в e раз
   с движения 0,5293 с при 2° против 0,5292 линейного: синус меньше угла,
   и настоящий маятник уходит чуть медленнее. Подложенные дефекты ловятся
   в третьем знаке: жёсткость в U на процент больше даёт 0,6252 против
   0,6283 по формуле, жёлоб простым Верле без события 0,5685 против
   0,5657.
   ПРОВЕРКА ЛУНЫ (10.10, hcheck на порту 49852, ?flat и ?flat=dark, и
   node; отчёт briefs/vychitka07_luna_demka_REPORT.md). Пружина на Луне:
   равновесие 1,6200 см, κ = 10,00 Н/м, 0,6283 с по формуле и кривизне,
   0,62831 с движения при 1, 5 и 9 см. Маятник на Луне: κ = 0,1620 Н·м,
   4,9365 с по формуле и кривизне; с движения 4,9366 при 1° (точный
   4,93663), 4,9388 при 5° (4,93889), 5,1338 при 45° (5,13387); отношение
   к земному 2,4608. Отрицательный контроль: g в U маятника на процент
   больше даёт 4,9120 по кривизне против 4,9365 по формуле; земное g в U
   пружины на Луне уводит равновесие на 9,81 см. */

/* ── чистая физика ──────────────────────────────────────────────
   Отсюда до пометки «конец чистой физики» код не знает о браузере и
   прогоняется в node вместе с demo-osc.js. */

var G = 9.81;
var G_LUNA = 1.62;                 /* NASA NSSDC, Moon Fact Sheet: 1.62 m/s² */
var TWO_PI = 2 * Math.PI, DEG = Math.PI / 180;
var SHAGOV = 400;                  /* шагов на характерный период */
var M = 0.1, K = 10, L1 = 1;       /* груз, пружина, длина маятника */
var LL = 1e-3, CC = 1e-6;          /* контур: индуктивность и ёмкость */
var C4 = 2000;                     /* U = c·x⁴, Дж/м⁴ */
var A_ZH = 1;                      /* жёлоб: ускорение вдоль стенки, м/с² */
var ARCH_E = Math.log(Math.E + Math.sqrt(Math.E * Math.E - 1));   /* arch e = 1,6574 */

var SM = { k: 100, u: 'см', d: 1 };          /* координата в сантиметрах */
var GR = { k: 1 / DEG, u: '°', d: 0 };       /* в градусах */
var MKK = { k: 1e6, u: 'мкКл', d: 1 };        /* заряд в микрокулонах */

function sin2(f) { var s = Math.sin(f / 2); return s * s; }

/* Пресет: ryad — строка рейки; vid — U (энергетический метод),
   teleg (две тележки), izlom (жёлоб);
   ed — единицы координаты на экране; ampl — ползунок в этих единицах;
   alpha — коэффициент инерции; U(q) — потенциальная энергия, Дж;
   poisk — где искать равновесие; shk — масштаб координаты для
   разностей; Tform(A) — формула главы; bezVesa — висящая пружина (на
   схеме вертикально, на графике пунктиром та же пружина без веса);
   luna — опыт на Луне, g = 1,62 м/с². */
var PRESETS = [
  { id: 'pruzhina', ryad: 1, knopka: 'пружина', vid: 'U', ed: SM,
    ampl: { min: 1, max: 10, shag: 0.5, nach: 5 },
    alpha: M, alphaT: 'm', kappaU: 'Н/м',
    U: function (x) { return 0.5 * K * x * x; },
    poisk: [-0.5, 0.5], shk: 0.1,
    Tform: function () { return TWO_PI * Math.sqrt(M / K); }, formT: '2π√(m/k)' },
  { id: 'mayatnik', ryad: 1, knopka: 'маятник', vid: 'U', ed: GR,
    ampl: { min: 1, max: 45, shag: 1, nach: 5 },
    alpha: M * L1 * L1, alphaT: 'ml²', kappaU: 'Н·м',
    U: function (f) { return 2 * M * G * L1 * sin2(f); },
    poisk: [-1, 1], shk: 0.5,
    Tform: function () { return TWO_PI * Math.sqrt(L1 / G); }, formT: '2π√(l/g)' },
  { id: 'os', ryad: 1, knopka: 'тело на оси', vid: 'U', ed: GR,
    ampl: { min: 1, max: 45, shag: 1, nach: 5 },
    alpha: M * L1 * L1 / 3, alphaT: 'ml²/3', kappaU: 'Н·м',
    U: function (f) { return 2 * M * G * (L1 / 2) * sin2(f); },
    poisk: [-1, 1], shk: 0.5,
    Tform: function () { return TWO_PI * Math.sqrt(2 * L1 / (3 * G)); }, formT: '2π√(2l/3g)' },
  { id: 'kontur', ryad: 1, knopka: 'контур', vid: 'U', ed: MKK,
    ampl: { min: 1, max: 10, shag: 0.5, nach: 5 },
    alpha: LL, alphaT: 'L', kappaU: 'Ф⁻¹',
    U: function (q) { return q * q / (2 * CC); },
    poisk: [-1e-4, 1e-4], shk: 1e-5, slow: 1e-4, vr: { k: 1e3, u: 'мс' },
    Tform: function () { return TWO_PI * Math.sqrt(LL * CC); }, formT: '2π√(LC)' },
  { id: 'telezhki', ryad: 1, knopka: 'две тележки', vid: 'teleg', ed: SM,
    ampl: { min: 2, max: 20, shag: 1, nach: 20 },
    m1: 1, m2: 3, kk: 20, l0: 0.6,
    alpha: 0.75, alphaT: 'μ', kappaU: 'Н/м',
    U: function (x) { return 0.5 * 20 * x * x; },
    poisk: [-0.5, 0.5], shk: 0.2,
    Tform: function () { return TWO_PI * Math.sqrt(0.75 / 20); }, formT: '2π√(μ/k)' },
  { id: 'vertikalno', ryad: 2, knopka: 'пружина вертикально', vid: 'U', ed: SM,
    ampl: { min: 1, max: 9, shag: 0.5, nach: 5 },
    alpha: M, alphaT: 'm', kappaU: 'Н/м',
    U: function (y) { return 0.5 * K * y * y - M * G * y; },
    poisk: [-0.5, 0.5], shk: 0.1, bezVesa: true,
    oknoFix: function (an) { return [-0.02, 2 * an.qz + 0.02]; },
    Tform: function () { return TWO_PI * Math.sqrt(M / K); }, formT: '2π√(m/k)' },
  /* Те же пружина и маятник на Луне (вычитка автора 10.10, замечание 4):
     вес пружины слабее и сдвигает равновесие меньше, период тот же;
     у маятника тяжесть сама возвращает груз, кривизна mgl падает с g,
     и период растёт в √(9,81/1,62) = 2,46 раза. Окно у пружины идёт за
     амплитудой: минимум на 1,62 см лежит близко к нулю. */
  { id: 'luna-pruzhina', ryad: 2, knopka: 'пружина на Луне', vid: 'U', ed: SM, luna: true,
    ampl: { min: 1, max: 9, shag: 0.5, nach: 5 },
    alpha: M, alphaT: 'm', kappaU: 'Н/м',
    U: function (y) { return 0.5 * K * y * y - M * G_LUNA * y; },
    poisk: [-0.5, 0.5], shk: 0.1, bezVesa: true,
    Tform: function () { return TWO_PI * Math.sqrt(M / K); }, formT: '2π√(m/k)' },
  { id: 'luna-mayatnik', ryad: 2, knopka: 'маятник на Луне', vid: 'U', ed: GR, luna: true,
    ampl: { min: 1, max: 45, shag: 1, nach: 5 },
    alpha: M * L1 * L1, alphaT: 'ml²', kappaU: 'Н·м',
    U: function (f) { return 2 * M * G_LUNA * L1 * sin2(f); },
    poisk: [-1, 1], shk: 0.5,
    Tform: function () { return TWO_PI * Math.sqrt(L1 / G_LUNA); }, formT: '2π√(l/g), g = 1,62 м/с²' },
  { id: 'x4', ryad: 2, knopka: 'U ∝ x⁴', vid: 'U', ed: SM,
    ampl: { min: 1, max: 10, shag: 0.5, nach: 5 },
    alpha: M, alphaT: 'm', kappaU: 'Н/м',
    U: function (x) { var x2 = x * x; return C4 * x2 * x2; },
    poisk: [-0.5, 0.5], shk: 0.1,
    /* T = 4√(m/2c)·(1/A)·∫₀¹du/√(1 − u⁴), интеграл равен K(1/√2)/√2 */
    Tform: function (A) { return 2 * O.ellipK(Math.SQRT1_2) / (A * Math.sqrt(C4 / M)); }, formT: '3,71√(m/c)/A' },
  { id: 'zhyolob', ryad: 2, knopka: 'жёлоб', vid: 'izlom', ed: { k: 100, u: 'см', d: 2 },
    ampl: { min: 0.25, max: 10, shag: 0.25, nach: 1 },
    alpha: M, alphaT: 'm', kappaU: 'Н/м',
    U: function (s) { return M * A_ZH * Math.abs(s); },
    poisk: [-0.5, 0.5], shk: 0.1,
    Tform: function (A) { return 4 * Math.sqrt(2 * A / A_ZH); }, formT: '4√(2A/a)' },
  { id: 'perevernutyj', ryad: 2, knopka: 'перевёрнутый', vid: 'U', ed: { k: 1 / DEG, u: '°', d: 1 },
    ampl: { min: 1, max: 10, shag: 0.5, nach: 2 },
    alpha: M * L1 * L1, alphaT: 'ml²', kappaU: 'Н·м',
    U: function (f) { return -2 * M * G * L1 * sin2(f); },
    poisk: [-1, 1], shk: 0.5, rost: true, wrap: true, Eshk: 2 * M * G * L1,
    Tform: function () { return ARCH_E * Math.sqrt(L1 / G); }, formT: 'arch e·√(l/g)' }
];
var PO_ID = {};
PRESETS.forEach(function (p) { PO_ID[p.id] = p; if (!p.slow) p.slow = 1; if (!p.vr) p.vr = { k: 1, u: 'с' }; });

/* Вторая производная U в подписях пишется через d/dx, а не штрихом
   (вычитка автора 10.10, замечание 8), с буквой координаты пресета. */
var KOORD_BUKVA = { pruzhina: 'x', mayatnik: 'φ', os: 'φ', kontur: 'q', telezhki: 'x',
                    vertikalno: 'y', 'luna-pruzhina': 'y', 'luna-mayatnik': 'φ',
                    x4: 'x', zhyolob: 's', perevernutyj: 'φ' };
function d2Ut(pr) { return 'd²U/d' + (KOORD_BUKVA[pr.id] || 'x') + '²'; }

/* Производные центральными разностями */
function dU(pr, q) { var d = 1e-6 * pr.shk; return (pr.U(q + d) - pr.U(q - d)) / (2 * d); }
function d2U(pr, q, d) { return (pr.U(q + d) + pr.U(q - d) - 2 * pr.U(q)) / (d * d); }

/* Равновесие и кривизна по самой U. Равновесие там, где сила −dU/dq
   меняет знак. */
function analiz(pr) {
  if (pr._an) return pr._an;
  var f = function (q) { return -dU(pr, q); };
  var lo = pr.poisk[0], hi = pr.poisk[1], flo = f(lo);
  for (var i = 0; i < 200 && hi - lo > 1e-15 * pr.shk; i++) {
    var mid = 0.5 * (lo + hi), fm = f(mid);
    if ((fm > 0) === (flo > 0) && fm !== 0) { lo = mid; flo = fm; } else hi = mid;
  }
  var qz = 0.5 * (lo + hi);
  var an = { qz: qz };
  var d1 = 1e-3 * pr.shk, c1 = d2U(pr, qz, d1), c2 = d2U(pr, qz, d1 / 10);
  var podjom = Math.abs(pr.U(qz + pr.shk) - pr.U(qz));
  if (c1 > 0 && c2 > 5 * c1) an.vid = 'izlom';
  else if (0.5 * Math.abs(c1) * pr.shk * pr.shk < 1e-4 * podjom) an.vid = 'nol';
  else an.vid = c1 < 0 ? 'otr' : 'pol';
  an.kappa = an.vid === 'pol' || an.vid === 'otr' ? d2U(pr, qz, 1e-4 * pr.shk) : null;
  an.omega2 = an.kappa != null ? an.kappa / pr.alpha : null;
  an.Trecipe = an.vid === 'pol' ? TWO_PI / Math.sqrt(an.omega2) : null;
  an.rostRecipe = an.vid === 'otr' ? ARCH_E / Math.sqrt(-an.omega2) : null;
  pr._an = an;
  return an;
}

/* Ускорение по координате */
function uskorenie(pr) {
  if (pr.vid === 'teleg') return function (q) {
    var F = -dU(pr, q[1] - q[0] - pr.l0);        /* сила пружины на вторую тележку */
    return [-F / pr.m1, F / pr.m2];
  };
  return function (q) { return -dU(pr, q) / pr.alpha; };
}

/* Обобщённая координата, скорость и ускорение модели */
function koord(m) { return m.pr.vid === 'teleg' ? m.s.q[1] - m.s.q[0] - m.pr.l0 : m.s.q; }
function skor(m) { return m.pr.vid === 'teleg' ? m.s.v[1] - m.s.v[0] : m.s.v; }
function usk(m) {
  if (m.s.a == null) m.s.a = m.acc(m.s.q, m.s.t);
  return m.pr.vid === 'teleg' ? m.s.a[1] - m.s.a[0] : m.s.a;
}

function energiya(m) {
  var pr = m.pr;
  if (pr.vid === 'teleg')
    return 0.5 * pr.m1 * m.s.v[0] * m.s.v[0] + 0.5 * pr.m2 * m.s.v[1] * m.s.v[1] + pr.U(koord(m));
  return 0.5 * pr.alpha * m.s.v * m.s.v + pr.U(m.s.q);
}

/* Характерный период: по кривизне, а где её нет, по формуле при этой
   амплитуде; у перевёрнутого 2πτ. Шаг схемы — его четырёхсотая доля. */
function harakternyj(pr, an, A) {
  if (an.Trecipe) return an.Trecipe;
  if (pr.rost) return TWO_PI * Math.sqrt(L1 / G);
  return pr.Tform(A);
}

/* Новый опыт: отпущен из покоя в q* + A. */
function novyj(pr, Adisp) {
  var an = analiz(pr), A = Adisp / pr.ed.k;
  var m = { pr: pr, an: an, A: A, Adisp: Adisp, acc: uskorenie(pr),
            povoroty: O.crossing(0), rost: O.crossing(1), nakop: 0,
            Tizm: null, tRost: null, dE: 0, sled: [], pov: [null, an.qz + A] };
  if (pr.vid === 'teleg') {
    var r = pr.l0 + A, mm = pr.m1 + pr.m2;
    m.s = { t: 0, q: [-pr.m2 / mm * r, pr.m1 / mm * r], v: [0, 0] };
  } else {
    m.s = { t: 0, q: an.qz + A, v: 0 };
  }
  m.povoroty.mark(0, -1);            /* разворот справа в момент отпускания */
  m.h = harakternyj(pr, an, A) / SHAGOV;
  m.E0 = energiya(m);
  m.Eshk = pr.Eshk || (m.E0 != null ? Math.abs(m.E0 - pr.U(an.qz)) : null);
  m.sled.push([A, 0]);
  return m;
}

/* Жёлоб: на каждой стенке сила постоянна, движение по параболе во времени
   точное; переход через дно (излом) находится корнем квадратного
   уравнения, и шаг делится в нём. Развороты кормятся по кускам шага. */
function shagIzlom(m, h) {
  var s = m.s, pr = m.pr, ost = h, d = 1e-6 * pr.shk;
  for (var k = 0; k < 4 && ost > 0; k++) {
    var side = s.q > 0 ? 1 : s.q < 0 ? -1 : (s.v > 0 ? 1 : -1);
    /* сила стенки снимается с U в одной точке у дна: на стенке она одна */
    var a = -dU(pr, side * 10 * d) / pr.alpha;
    var q1 = side * s.q, v1 = side * s.v, a1 = side * a;    /* в своей стенке: q1 ≥ 0, a1 < 0 */
    /* корень ½a₁τ² + v₁τ + q₁ = 0: при q₁ > 0 положительный корень один,
       в устойчивой записи; со дна (q₁ = 0) груз уходит и возвращается
       через 2v₁/|a₁| */
    var D = v1 * v1 - 2 * a1 * q1;
    var tau = q1 > 0 ? 2 * q1 / (-v1 + Math.sqrt(D)) : 2 * v1 / (-a1);
    var t0 = s.t, v0 = s.v;
    if (tau <= ost && tau > 0) {
      s.q = 0; s.v = s.v + a * tau; s.t += tau; ost -= tau;
      kormit(m, t0, v0, s.t, s.v, a, a, null);
    } else {
      s.q = s.q + s.v * ost + 0.5 * a * ost * ost; s.v = s.v + a * ost; s.t += ost;
      kormit(m, t0, v0, s.t, s.v, a, a, null);
      ost = 0;
    }
    s.a = a;
  }
}

/* Разворот: скорость меняет знак. Место разворота — эрмитова вставка
   координаты; направление сверху вниз значит правый край ямы. */
function kormit(m, t0, v0, t1, v1, a0, a1, q0) {
  var tc = m.povoroty.feed(t0, v0, t1, v1, a0, a1);
  if (tc == null) return;
  var qc;
  if (m.pr.vid === 'izlom') {
    /* на стенке скорость линейна: место разворота точное */
    var s = m.s, back = t1 - tc;
    qc = s.q - s.v * back + 0.5 * a1 * back * back;
  } else {
    qc = O.hermite(t0, q0, v0, t1, koord(m), v1, tc);
  }
  m.pov[m.povoroty.lastDir < 0 ? 1 : 0] = qc;
  var T = m.povoroty.period(), half = m.povoroty.half();
  m.Tizm = T != null ? T : (half != null ? 2 * half : null);
}

function shag(m) {
  var pr = m.pr, h = m.h;
  var t0 = m.s.t, q0 = koord(m), v0 = skor(m), a0 = pr.vid === 'izlom' ? 0 : usk(m);
  if (pr.vid === 'izlom') shagIzlom(m, h);
  else {
    if (pr.vid === 'teleg') O.verletN(m.s, m.acc, h);
    else O.verlet(m.s, m.acc, h);
    kormit(m, t0, v0, m.s.t, skor(m), a0, usk(m), q0);
  }
  var q1 = koord(m), v1 = skor(m);
  if (pr.rost && m.tRost == null) {
    /* рост в e раз: |q − q*| пересекает e·A снизу вверх */
    var lim = Math.E * m.A, qz = m.an.qz;
    var g0 = Math.abs(q0 - qz) - lim, g1 = Math.abs(q1 - qz) - lim;
    var tr = m.rost.feed(t0, g0, m.s.t, g1, (q0 > qz ? 1 : -1) * v0, (q1 > qz ? 1 : -1) * v1);
    if (tr != null) m.tRost = tr;
  }
  if (pr.wrap) {
    if (m.s.q > Math.PI) m.s.q -= TWO_PI;
    else if (m.s.q < -Math.PI) m.s.q += TWO_PI;
  }
  if (m.E0 != null) {
    var e = Math.abs(energiya(m) - m.E0) / m.Eshk;
    if (e > m.dE) m.dE = e;
  }
  m.sled.push([koord(m) - m.an.qz, skor(m)]);
  if (m.sled.length > 1.15 * SHAGOV) m.sled.shift();
}

/* Продвинуть на dt модельного времени целыми шагами; остаток копится. */
function prodvinut(m, dt) {
  m.nakop += dt;
  var n = Math.floor(m.nakop / m.h + 1e-9);
  if (n > 20000) n = 20000;
  for (var i = 0; i < n; i++) shag(m);
  m.nakop -= n * m.h;
  if (m.nakop < 0) m.nakop = 0;
}

/* Сводка опыта: то, что демка утверждает. */
function svodka(m) {
  var pr = m.pr, an = m.an;
  return {
    preset: pr.id, g: pr.luna ? G_LUNA : G,
    t: m.s.t, q: koord(m), v: skor(m),
    qMin: an.qz,
    curvature: { pol: 'положительная', nol: 'ноль', izlom: 'излом', otr: 'отрицательная' }[an.vid],
    kappa: an.kappa, alpha: pr.alpha, omega2: an.omega2,
    Tformula: pr.rost ? null : pr.Tform(m.A),
    Trecipe: an.Trecipe,
    Tmeasured: pr.rost ? null : m.Tizm,
    amplitude: m.A, amplitudeDisplay: m.Adisp,
    E: energiya(m), E0: m.E0, energyDrift: m.E0 != null ? m.dE : null,
    unstable: an.vid === 'otr',
    growthFormula: pr.rost ? pr.Tform() : null,
    growthRecipe: an.rostRecipe,
    growthTime: m.tRost,
    turns: m.povoroty.count - 1,
    turnLeft: m.pov[0], turnRight: m.pov[1],
    h: m.h, slow: pr.slow
  };
}

/* Прогон без кадров: n разворотов (или до роста в e раз у перевёрнутого). */
function progon(id, Adisp, n) {
  var pr = PO_ID[id], m = novyj(pr, Adisp == null ? pr.ampl.nach : Adisp);
  var lim = (n || 6) + 1, guard = 0;
  while (guard++ < 400 * SHAGOV) {
    shag(m);
    if (pr.rost ? m.tRost != null : m.povoroty.count >= lim) break;
  }
  return svodka(m);
}
/* ── конец чистой физики ── */

/* Русская запятая и настоящий минус; крохи печатаются нулём. */
function num(v, d) {
  if (v == null || !isFinite(v)) return '—';
  if (Math.abs(v) < 0.5 * Math.pow(10, -d)) v = 0;
  return v.toFixed(d).replace('.', ',').replace('-', '−');
}
var SUP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻' };
/* Четыре значащие цифры; большие и малые числа с множителем 10ⁿ */
function sig(v) {
  if (v == null || !isFinite(v)) return '—';
  var a = Math.abs(v);
  if (a >= 1e4 || (a > 0 && a < 1e-2)) {
    var p = Math.floor(Math.log10(a)), mnt = v / Math.pow(10, p);
    if (Math.abs(mnt) >= 9.9995) { mnt /= 10; p++; }
    return num(mnt, 3) + '·10' + String(p).split('').map(function (c) { return SUP[c]; }).join('');
  }
  /* запас 5·10⁻⁵ на округление: 9,9999999 печатается «10,00», а не «10,000» */
  var d = Math.max(0, 3 - Math.floor(Math.log10((a || 1) * (1 + 5e-5))));
  return num(v, d);
}
function vremya(pr, t) { return num(t * pr.vr.k, 4); }
function koordT(pr, q) { return num(q * pr.ed.k, pr.ed.d) + (pr.ed.u === '°' ? '°' : ' ' + pr.ed.u); }

/* ══════════════════ сцена ══════════════════

   Слева схема системы, в середине потенциальная энергия U(q) с параболой
   ½(d²U/dq²)·(q − q*)² в минимуме, уровнем энергии, точками поворота и
   шариком. Справа фазовая плоскость.
   Внизу три периода. Окно по координате следует за амплитудой, но не уже
   0,35 её наибольшего значения: при малой амплитуде парабола и U
   совпадают на глаз, при большой у маятника видно, где они расходятся. */

var W = 1000, HGT = 460;
var SX0 = 10, SX1 = 240, SXC = 125;           /* схема */
var UX0 = 292, UX1 = 640, UY0 = 52, UY1 = 270; /* U(q) */
var FX0 = 690, FX1 = 980, FY0 = 52, FY1 = 270; /* фазовая плоскость */
var RY = 322, RX = [318, 650, 980];            /* показания */
var CV_DV = '77,182,198';                      /* движение: шарик, след, снятый период */
var CV_PAR = '224,138,82';                     /* кривизна: парабола, период по ней */
var CV_PL = '255,122,102', CV_MI = '122,166,255';  /* заряд обкладок */

function okno(m) {
  var pr = m.pr, an = m.an;
  if (pr.oknoFix) return pr.oknoFix(an);
  var w = pr.rost ? 5 * m.A : Math.max(1.3 * m.A, 0.35 * pr.ampl.max / pr.ed.k);
  return [an.qz - w, an.qz + w];
}

var pokaz = {};
window.__demoState = pokaz;

function OdnaYama() {
  var ref0 = useRef(null);
  if (!ref0.current) {
    var p0 = PRESETS[0];
    ref0.current = { pr: p0, A: p0.ampl.nach, run: true, m: novyj(p0, p0.ampl.nach) };
  }
  var S = ref0.current;
  var pair = useState({ id: S.pr.id, A: S.A, run: true, faza: '' });
  var ui = pair[0], setUi = pair[1];

  function faza() {
    var m = S.m;
    return m.pr.rost ? (m.tRost != null ? 'r' + num(m.tRost, 4) : 'zhdem')
                     : (m.Tizm != null ? 'T' + num(m.Tizm * m.pr.vr.k, 4) : 'zhdem');
  }
  function snyat() {
    Object.assign(pokaz, svodka(S.m));
    pokaz.running = S.run;
    var f = faza();
    if (f !== S.faza) {
      S.faza = f;
      setUi(function (u) { return Object.assign({}, u, { faza: f }); });
    }
  }
  if (!pokaz.preset) Object.assign(pokaz, svodka(S.m), { running: S.run });

  function step(dt) {
    if (!S.run) return;
    prodvinut(S.m, dt * S.pr.slow);
    snyat();

  /* ── примитивы ── */

  function pruzhinaRis(ctx, x0, y0, x1, y1, n, w, color) {
    var dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
    var konec = Math.min(10, L * 0.15);
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x0, y0);
    ctx.lineTo(x0 + ux * konec, y0 + uy * konec);
    var L2 = L - 2 * konec;
    for (var i = 1; i <= 2 * n; i++) {
      var s = konec + L2 * (i - 0.5) / (2 * n), sg = i % 2 ? 1 : -1;
      ctx.lineTo(x0 + ux * s - uy * w * sg, y0 + uy * s + ux * w * sg);
    }
    ctx.lineTo(x1 - ux * konec, y1 - uy * konec); ctx.lineTo(x1, y1);
    ctx.stroke();
  }
  function shtrih(ctx, x0, y0, x1, y1, color) {
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    ctx.lineWidth = 1.2; ctx.beginPath();
    var L = Math.hypot(x1 - x0, y1 - y0), n = Math.floor(L / 9);
    for (var i = 0; i <= n; i++) {
      var x = x0 + (x1 - x0) * i / n, y = y0 + (y1 - y0) * i / n;
      if (y0 === y1) { ctx.moveTo(x, y); ctx.lineTo(x - 6, y - 7); }
      else { ctx.moveTo(x, y); ctx.lineTo(x - 7, y + 6); }
    }
    ctx.stroke();
  }
  function punktir(ctx, x0, y0, x1, y1, color, w) {
    ctx.save(); ctx.setLineDash([5, 5]); ctx.strokeStyle = color; ctx.lineWidth = w || 1.4;
    ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); ctx.restore();
  }
  function shar(ctx, x, y, r, rgb) {
    ctx.fillStyle = 'rgb(' + rgb + ')';
    ctx.beginPath(); ctx.arc(x, y, r, 0, TWO_PI); ctx.fill();
  }
  function strelka(ctx, x0, y0, x1, y1, color, w) {
    var dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy);
    if (L < 2) return;
    var ux = dx / L, uy = dy / L, hd = Math.min(11, L * 0.4);
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1 - ux * hd * 0.7, y1 - uy * hd * 0.7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x1, y1);
    ctx.lineTo(x1 - ux * hd - uy * hd * 0.4, y1 - uy * hd + ux * hd * 0.4);
    ctx.lineTo(x1 - ux * hd + uy * hd * 0.4, y1 - uy * hd - ux * hd * 0.4);
    ctx.closePath(); ctx.fill();
  }
  function telo(ctx, x, y, w, h, ink) {
    ctx.fillStyle = 'rgba(' + CV_DV + ',.9)';
    C.roundRect(ctx, x - w / 2, y - h, w, h, 4); ctx.fill();
  }

  /* ── схема системы ── */

  function shema(ctx, m, ink, mut) {

    if (pr.id === 'pruzhina' || pr.id === 'x4') {

      if (pr.id === 'pruzhina') shtrih(ctx, 22, 150, 22, y0, inkS);
      shtrih(ctx, 22, y0, 236, y0, inkS);
      punktir(ctx, xe, 132, xe, y0, mutS);
      if (pr.id === 'pruzhina') pruzhinaRis(ctx, 22, y0 - 18, xb - 20, y0 - 18, 7, 8, inkS);
      telo(ctx, xb, y0, 40, 36);
      if (pr.id === 'pruzhina') { podpis('k = 10 Н/м', 252); podpis('m = 0,1 кг', 276); }
      else { podpis('сила −4cx³', 112); podpis('c = 2000 Дж/м⁴', 252); podpis('m = 0,1 кг', 276); }
    } else if (pr.id === 'mayatnik' || pr.id === 'luna-mayatnik' || pr.id === 'os' || pr.id === 'perevernutyj') {
      var up = pr.id === 'perevernutyj';
      var px = SXC, py = up ? 160 : 50, Lp = up ? 105 : 165;
      var bx = px + Lp * Math.sin(q), by = up ? py - Lp * Math.cos(q) : py + Lp * Math.cos(q);

      if (pr.id === 'os') { podpis('стержень 1 м', 252); podpis('ось через конец', 276); }
      else if (up) { podpis('l = 1 м, груз вверху', 296); }

      var verh = q >= 0 ? CV_PL : CV_MI, niz = q >= 0 ? CV_MI : CV_PL;
      ctx.lineWidth = 5; ctx.lineCap = 'butt';
      ctx.strokeStyle = 'rgba(' + verh + ',' + (0.3 + 0.7 * fr) + ')';
      ctx.beginPath(); ctx.moveTo(xl - 22, ym - 9); ctx.lineTo(xl + 22, ym - 9); ctx.stroke();
      ctx.strokeStyle = 'rgba(' + niz + ',' + (0.3 + 0.7 * fr) + ')';
      ctx.beginPath(); ctx.moveTo(xl - 22, ym + 9); ctx.lineTo(xl + 22, ym + 9); ctx.stroke();

      C.label(ctx, xl + 34, ym + 20, q >= 0 ? '−' : '+', 19, 'rgb(' + niz + ')', 'left');
      /* ток по верхнему проводу: I = dq/dt; при I > 0 он течёт к верхней

    } else if (pr.id === 'telezhki') {

      shtrih(ctx, 16, yr, 236, yr, inkS);
      pruzhinaRis(ctx, x1 + 17, yr - 14, x2 - 25, yr - 14, 6, 6, inkS);
      telo(ctx, x1, yr - 2, 34, 22);
      telo(ctx, x2, yr - 2, 50, 32);
      C.label(ctx, x1, yr - 32, '1 кг', 17, mutS);
      C.label(ctx, x2, yr - 42, '3 кг', 17, mutS);
      ctx.fillStyle = 'rgb(' + ink + ')';
      ctx.beginPath(); ctx.moveTo(xcm, yr + 6); ctx.lineTo(xcm - 7, yr + 18); ctx.lineTo(xcm + 7, yr + 18);
      ctx.closePath(); ctx.fill();
      C.label(ctx, xcm, yr + 40, 'центр масс', 17, mutS);
      podpis('k = 20 Н/м', 276);
    } else if (pr.bezVesa) {
      var yc = 34, sc3 = 600, l0 = 0.12, xv = 105;
      var ytop = yc + sc3 * (l0 + q);

      pruzhinaRis(ctx, xv, yc, xv, ytop, 7, 8, inkS);
      ctx.fillStyle = 'rgba(' + CV_DV + ',.9)';
      C.roundRect(ctx, xv - 20, ytop, 40, 30, 4); ctx.fill();
      var y00 = yc + sc3 * l0, yeq = yc + sc3 * (l0 + m.an.qz);
      punktir(ctx, xv - 34, y00, 236, y00, mutS);
      punktir(ctx, xv - 34, yeq, 236, yeq, 'rgba(' + CV_PAR + ',.9)');
      C.label(ctx, 236, y00 - 6, 'без груза', 17, mutS, 'right');
      /* на Луне линии в 10 пикселях: подпись равновесия уходит под свою */
      C.label(ctx, 236, yeq - y00 < 24 ? yeq + 19 : yeq - 6, 'равновесие', 17, 'rgb(' + CV_PAR + ')', 'right');
      if (pr.luna) podpis('на Луне, g = 1,62 м/с²', 266);
      podpis('k = 10 Н/м, m = 0,1 кг', 290);
    } else if (pr.id === 'zhyolob') {
      /* жёлоб в масштабе по длине, по высоте растянут в пять раз */
      var sinA = A_ZH / G, cosA = Math.sqrt(1 - sinA * sinA), sc4 = 700, raz = 5, x0z = SXC, y0z = 200;
      var smax = 0.15;
      ctx.strokeStyle = inkS; ctx.lineWidth = 2.4; ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(x0z - sc4 * smax * cosA, y0z - raz * sc4 * smax * sinA);
      ctx.lineTo(x0z, y0z);
      ctx.lineTo(x0z + sc4 * smax * cosA, y0z - raz * sc4 * smax * sinA);
      ctx.stroke();
      var bxz = x0z + sc4 * q * cosA, byz = y0z - raz * sc4 * Math.abs(q) * sinA;
      shar(ctx, bxz, byz - 8, 8, CV_DV);
      podpis('a = 1 м/с² вдоль стенки', 252); podpis('высота × 5', 276);
    }
  }

  /* ── U(q) ── */

  function grafik(ctx, m, ink, mut, acc) {
    var pr = m.pr, an = m.an, o = okno(m), lo = o[0], hi = o[1], i, q;
    var mutS = 'rgba(' + mut + ',.95)', fun = pr.U;
    function X(qq) { return UX0 + (qq - lo) / (hi - lo) * (UX1 - UX0); }
    var N = 240, vals = [], vmin = Infinity, vmax = -Infinity;
    for (i = 0; i <= N; i++) {
      q = lo + (hi - lo) * i / N;
      var v = fun(q); vals.push(v);
      if (v < vmin) vmin = v; if (v > vmax) vmax = v;
    }
    var pad = 0.06 * (vmax - vmin || 1);
    vmin -= 0.02 * (vmax - vmin || 1); vmax += pad;
    function Y(v) { return UY1 - (v - vmin) / (vmax - vmin) * (UY1 - UY0); }

    C.label(ctx, UX0, 30, 'энергия U', 17, mutS, 'left');

    ctx.save();
    ctx.beginPath(); ctx.rect(UX0 - 4, UY0 - 6, UX1 - UX0 + 8, UY1 - UY0 + 12); ctx.clip();

    if (pr.bezVesa) {   /* та же пружина без веса */
      ctx.save(); ctx.setLineDash([4, 5]); ctx.strokeStyle = mutS; ctx.lineWidth = 1.8;
      ctx.beginPath();
      for (i = 0; i <= N; i++) { q = lo + (hi - lo) * i / N; var ub = 0.5 * K * q * q; if (i) ctx.lineTo(X(q), Y(ub)); else ctx.moveTo(X(q), Y(ub)); }
      ctx.stroke(); ctx.restore();
    }

    /* сама кривая */
    ctx.strokeStyle = 'rgba(' + ink + ',.85)'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
    ctx.beginPath();
    for (i = 0; i <= N; i++) { q = lo + (hi - lo) * i / N; if (i) ctx.lineTo(X(q), Y(vals[i])); else ctx.moveTo(X(q), Y(vals[i])); }
    ctx.stroke();

    /* парабола по кривизне поверх кривой: где они совпадают, пунктир
       лежит на ней */
    var Uz = fun(an.qz);
    if (an.vid !== 'izlom') {
      ctx.save(); ctx.setLineDash([9, 6]); ctx.strokeStyle = 'rgb(' + CV_PAR + ')'; ctx.lineWidth = 2.4;
      ctx.beginPath();
      for (i = 0; i <= N; i++) {
        q = lo + (hi - lo) * i / N;
        var pv = Uz + 0.5 * (an.kappa || 0) * (q - an.qz) * (q - an.qz);
        if (i) ctx.lineTo(X(q), Y(pv)); else ctx.moveTo(X(q), Y(pv));
      }
      ctx.stroke(); ctx.restore();
    }

    /* уровень энергии и точки поворота */
    var qq = koord(m), yE = Y(m.E0);
    ctx.save(); ctx.setLineDash([6, 5]); ctx.strokeStyle = 'rgba(' + acc + ',.85)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(UX0, yE); ctx.lineTo(UX1, yE); ctx.stroke(); ctx.restore();
    if (!pr.rost) {
      m.pov.forEach(function (pq) {
        if (pq == null) return;
        ctx.strokeStyle = 'rgb(' + CV_DV + ')'; ctx.lineWidth = 2.4;
        ctx.beginPath(); ctx.moveTo(X(pq), yE - 8); ctx.lineTo(X(pq), yE + 8); ctx.stroke();
      });
    }
    shar(ctx, X(qq), Y(fun(qq)), 9, CV_DV);
    ctx.restore();

    /* подписи; между точками поворота над уровнем кривая не проходит; у
       вершины перевёрнутого маятника подпись идёт под уровень, к краю */
    if (pr.rost) C.label(ctx, X(lo) + 4, yE + 22, 'уровень энергии', 17, 'rgb(' + acc + ')', 'left');
    else if (yE - 8 > UY0 + 14) C.label(ctx, X(an.qz), yE - 8, 'уровень энергии', 17, 'rgb(' + acc + ')');
    var legenda = an.vid === 'izlom' ? '' : an.vid === 'nol' ? 'парабола: ' + d2Ut(pr) + ' = 0' : 'парабола по ' + d2Ut(pr);
    if (legenda) {
      C.label(ctx, UX1, 30, legenda, 17, 'rgb(' + CV_PAR + ')', 'right');
      var wl = ctx.measureText(legenda).width;
      punktir(ctx, UX1 - wl - 38, 24, UX1 - wl - 10, 24, 'rgb(' + CV_PAR + ')', 2.4);
    }
    if (an.vid === 'izlom') C.label(ctx, X(an.qz), Y(Uz) - 16, 'излом', 17, 'rgb(' + CV_PAR + ')');
    if (pr.bezVesa) {
      /* подпись слева от правой ветви пунктира, на 0,8 высоты графика: там
         она не встречает ни уровень энергии, ни сплошную кривую (на Луне
         минимумы рядом, и подпись у дна легла бы на уровень) */
      var ubL = vmin + 0.8 * (vmax - vmin), qL = Math.min(Math.sqrt(2 * Math.max(ubL, 0) / K), hi);
      C.label(ctx, X(qL) - 8, Y(0.5 * K * qL * qL), 'без веса', 17, mutS, 'right');
    }

    /* ось координаты: края окна и равновесие */
    var ya = UY1 + 12;
    ctx.strokeStyle = 'rgba(' + mut + ',.7)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(UX0, ya); ctx.lineTo(UX1, ya);
    [lo, an.qz, hi].forEach(function (t) { ctx.moveTo(X(t), ya); ctx.lineTo(X(t), ya + 7); });
    ctx.stroke();
    C.label(ctx, X(lo), ya + 28, num(lo * pr.ed.k, pr.ed.d), 17, mutS, 'left');
    C.label(ctx, X(hi), ya + 28, koordT(pr, hi), 17, mutS, 'right');
    var tz = koordT(pr, an.qz);
    C.label(ctx, X(an.qz), ya + 28, tz, 17, 'rgb(' + CV_PAR + ')');
  }

  /* ── фазовая плоскость ── */

  function faz(ctx, m, ink, mut) {
    var pr = m.pr, an = m.an, mutS = 'rgba(' + mut + ',.95)';
    var w = pr.rost ? 5 * m.A : Math.max(1.3 * m.A, 0.35 * pr.ampl.max / pr.ed.k);
    var Om;
    if (an.vid === 'pol') Om = Math.sqrt(an.omega2);
    else if (pr.rost) Om = Math.sqrt(G / L1);
    else Om = Math.sqrt(2 * Math.abs(pr.U(an.qz + m.A) - pr.U(an.qz)) / pr.alpha) / m.A;
    var cx = (FX0 + FX1) / 2, cy = (FY0 + FY1) / 2, hw = (FX1 - FX0) / 2, hh = (FY1 - FY0) / 2;
    function X(d) { return cx + d / w * hw; }
    function Y(v) { return cy - v / (w * Om) * hh; }
    C.label(ctx, FX0, 30, 'фазовая плоскость', 17, mutS, 'left');
    ctx.strokeStyle = 'rgba(' + ink + ',.25)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(FX0, cy); ctx.lineTo(FX1, cy); ctx.moveTo(cx, FY0); ctx.lineTo(cx, FY1); ctx.stroke();
    C.label(ctx, FX1, cy + 26, 'отклонение', 17, mutS, 'right');
    C.label(ctx, cx + 8, FY0 + 12, 'скорость', 17, mutS, 'left');
    ctx.save();
    ctx.beginPath(); ctx.rect(FX0, FY0 - 6, FX1 - FX0, FY1 - FY0 + 12); ctx.clip();
    var sl = m.sled;
    ctx.strokeStyle = 'rgba(' + CV_DV + ',.8)'; ctx.lineWidth = 2.2; ctx.lineJoin = 'round';
    ctx.beginPath();
    for (var i = 0; i < sl.length; i++) {
      var px = X(sl[i][0]), py = Y(sl[i][1]);
      if (i && !(pr.wrap && Math.abs(sl[i][0] - sl[i - 1][0]) > Math.PI)) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    }
    ctx.stroke();
    shar(ctx, X(koord(m) - an.qz), Y(skor(m)), 7, CV_DV);
    ctx.restore();
  }

  /* ── показания ── */

  function kolonki(m) {
    var pr = m.pr, an = m.an, u = pr.vr.u;
    var k1, k2, k3;
    if (pr.rost) {
      k1 = { c: 'РОСТ В e РАЗ ПО ФОРМУЛЕ, с', v: num(pr.Tform(), 4), s: 'τ·arch e, τ = √(l/g)' };

  function draw(ctx) {
    var tone = C.tones(ctx), ink = tone.ink, mut = tone.muted, acc = tone.accent;
    var m = S.m;
    shema(ctx, m, ink, mut);
    grafik(ctx, m, ink, mut, acc);
    faz(ctx, m, ink, mut);
    var kol = kolonki(m), cvet = ['rgb(' + ink + ')', 'rgb(' + CV_PAR + ')', 'rgb(' + CV_DV + ')'];
    for (var i = 0; i < 3; i++) {
      C.readout(ctx, RX[i], RY, kol[i].c, kol[i].v, cvet[i]);
      C.label(ctx, RX[i], RY + 66, kol[i].s, 17, 'rgba(' + mut + ',.95)', 'right');
    }
    ctx.textAlign = 'center';
  }

  var ref = C.useStage(W, HGT, step, draw);

  /* ── ручки ── */

  function zagruzit(pr, A, run) {
    S.pr = pr; S.A = A; S.run = run; S.m = novyj(pr, A); S.faza = null;
    snyat();
    setUi({ id: pr.id, A: A, run: run, faza: S.faza });
  }
  function vybrat(id) { var pr = PO_ID[id]; zagruzit(pr, pr.ampl.nach, true); }
  function amplituda(v) {
    var a = S.pr.ampl, A = Math.round(v / a.shag) * a.shag;
    A = Math.min(a.max, Math.max(a.min, A));
    if (A !== S.A) zagruzit(S.pr, A, S.run);
  }
  function pusk() { S.run = !S.run; snyat(); setUi(function (u) { return Object.assign({}, u, { run: S.run }); }); }
  function sbros() { zagruzit(S.pr, S.A, true); }

  /* Для автопроверки: __demoSet({ preset, amp, run }) ставит опыт с этими
     ручками; __demoCheck(id, amp, n) — прогон без кадров на n разворотов
     (у перевёрнутого до роста в e раз), живую сцену не трогает. */
  window.__demoSet = function (q) {
    q = q || {};
    var pr = q.preset ? PO_ID[q.preset] : S.pr;
    zagruzit(pr, q.amp != null ? q.amp : (q.preset ? pr.ampl.nach : S.A), q.run == null ? true : !!q.run);
    return pokaz;
  };
  window.__demoCheck = progon;
  window.__demoModel = { PRESETS: PRESETS, analiz: analiz, novyj: novyj, shag: shag, svodka: svodka, prodvinut: prodvinut };

  /* ── строка показаний ── */

  function slova() {
    var A = function (t) { return '<span class="accent">' + t + '</span>'; };
    var m = S.m, pr = m.pr, an = m.an;
    var Tf = pr.rost ? null : pr.Tform(m.A), Tm = m.Tizm, Tr = an.Trecipe;
    var tz = function (t) { return vremya(pr, t) + ' ' + pr.vr.u; };
    var izm = Tm != null ? ', снятый с движения ' + A(tz(Tm)) : ', снятый с движения появится после первого разворота';
    var proc = Tm != null && Tf ? (Tm / Tf - 1) * 100 : 0;
    var ampl = koordT(pr, m.A);
    /* снятый период маятника против формулы: при малой амплитуде U у дна

    var hvost = Tm == null ? '.' : proc > 0.05 ? ' при амплитуде ' + ampl + ', на ' + num(proc, proc < 1 ? 2 : 1) +
      ' % длиннее: вдали от дна U идёт ниже параболы.' : '. При такой амплитуде U у дна не отличить от параболы.';
    switch (pr.id) {
      case 'pruzhina':
        return 'Груз 0,1 кг на пружине 10 Н/м. Метод энергетический: U = kx²/2, инерция m читается из кинетической энергии. ' +
          'Кривизна U в минимуме, посчитанная из самой U, ' + A(sig(an.kappa) + ' Н/м') + ', период по ней ' + A(tz(Tr)) +
          ', как по формуле главы' + izm + '. Двигайте амплитуду: снятый период у пружины от неё не зависит.';
      case 'mayatnik':
      case 'os':
        return (pr.id === 'os' ? 'Стержень 1 м на оси через конец: U = mg(l/2)(1 − cos φ), инерция I<sub>A</sub> = ml²/3 относительно оси. '
                               : 'Груз на нити 1 м: возвращает тяжесть, U = mgl(1 − cos φ), инерция ml². ') +
          'Кривизна U в минимуме ' + A(sig(an.kappa) + ' Н·м') + ' и инерция дают ' + A(tz(Tr)) + ', формула главы ' + tz(Tf) + izm + hvost;
      case 'luna-mayatnik':
        var Tz = TWO_PI * Math.sqrt(L1 / G);
        return 'Маятник 1 м на Луне, g = 1,62 м/с²: U = mgl(1 − cos φ), кривизна U в минимуме ' + A(sig(an.kappa) + ' Н·м') +
          ' против ' + sig(M * G * L1) + ' на Земле, инерция ml² та же. Период по кривизне ' + A(tz(Tr)) + ', по формуле главы ' +
          tz(Tf) + ', в ' + A(num(Tr / Tz, 2) + ' раза') + ' дольше земного ' + tz(Tz) + '. Снятый с движения ' +
          (Tm != null ? A(tz(Tm)) + hvost : 'появится после первого разворота.');
      case 'kontur':
        return 'Контур 1 мГн и 1 мкФ, время на экране замедлено в 10⁴ раз. Заряд к нулю возвращает конденсатор, U = q²/2C, ' +
          'кривизна ' + A('1/C') + '; инерция здесь L, из энергии тока LI²/2. Период по кривизне ' + A(tz(Tr)) +
          ', по формуле главы ' + tz(Tf) + izm + (Tm != null ? ', ' + num(1 / Tm, 0) + ' ' +
            C.plural(Math.round(1 / Tm), 'колебание', 'колебания', 'колебаний') + ' в секунду.' : '.');
      case 'telezhki':
        return 'Тележки 1 и 3 кг на пружине 20 Н/м. Движение считается вторым законом для каждой тележки, центр масс стоит. ' +
          'Рецепт читает энергию: U пружины от её растяжения и инерция ' + A('μ = 0,75 кг') + ' из кинетической энергии ' +
          'относительного движения. Период по кривизне ' + A(tz(Tr)) + ', по формуле главы ' + tz(Tf) + izm + '.';
      case 'vertikalno':
        return 'Та же пружина, груз висит. U = ky²/2 − mgy, y отсчитан вниз от конца ненагруженной пружины. Вес сдвинул минимум на ' +
          A(koordT(pr, an.qz)) + ', кривизна осталась ' + A(sig(an.kappa) + ' Н/м') + ', и период тот же, ' + A(tz(Tr)) + izm +
          '. Пунктиром энергия той же пружины без веса.';
      case 'luna-pruzhina':
        return 'Та же пружина с грузом висит на Луне, где g = 1,62 м/с². U = ky²/2 − mgy, y отсчитан вниз от конца ненагруженной пружины. ' +
          'Вес здесь слабее и сдвинул минимум только на ' + A(koordT(pr, an.qz)) + ' против ' + koordT(pr, M * G / K) +
          ' на Земле. Кривизна осталась ' + A(sig(an.kappa) + ' Н/м') + ', и период тот же, что на Земле, ' + A(tz(Tr)) + izm +
          '. Пунктиром энергия той же пружины без веса.';
      case 'x4':
        return 'U = cx⁴, c = 2000 Дж/м⁴, груз 0,1 кг. Парабола в минимуме вырождается в прямую: d²U/dx² = 0, и частоты рецепт не даёт. ' +
          'Колебания при этом есть, но период зависит от амплитуды и обратно ей пропорционален: при ' + ampl +
          ' по формуле главы 3,71√(m/c)/A ' + A(tz(Tf)) + izm + '.';
      case 'zhyolob':
        return 'Шарик в V-образном жёлобе, ускорение вдоль стенки 1 м/с². U = ma|s| с изломом на дне: кривизны там нет, рецепт молчит. ' +
          'Период 4√(2A/a) растёт с амплитудой: при ' + ampl + ' он ' + A(tz(Tf)) + izm + '. Глава: 0,57 с при 1 см, 1,13 с при 4 см.';
      case 'perevernutyj':
        return 'Маятник 1 м отпущен из покоя в ' + ampl + ' от верхней точки. Кривизна U там отрицательна, d²U/dφ² = −mgl, ' +
          'и вместо колебания отклонение растёт: в e раз за ' + A(num(an.rostRecipe, 2) + ' с') +
          (m.tRost != null ? ', с движения ' + A(num(m.tRost, 4) + ' с') + '.' : '.') +
          ' Дальше груз падает, проходит низ и поднимается к вершине с другой стороны.';
    }
    return '';
  }

  var a = S.pr.ampl;
  return html`
    <div class="demo">
      <div class="controls">
        <${C.Group} label="Одно уравнение:">
          ${PRESETS.filter(function (p) { return p.ryad === 1; }).map(function (p) {
            return html`<${C.Btn} key=${p.id} active=${ui.id === p.id} onClick=${function () { vybrat(p.id); }}>${p.knopka}<//>`; })}
        <//>
        <${C.Group} label="Где меняется и где молчит:">
          ${PRESETS.filter(function (p) { return p.ryad === 2; }).map(function (p) {
            return html`<${C.Btn} key=${p.id} active=${ui.id === p.id} onClick=${function () { vybrat(p.id); }}>${p.knopka}<//>`; })}
        <//>
        <${C.Slider} label="Амплитуда:" min=${a.min} max=${a.max} step=${a.shag} value=${ui.A}
                     onChange=${amplituda} display=${num(ui.A, a.shag >= 1 ? 0 : a.shag * 10 % 1 ? 2 : 1) +(S.pr.ed.u === '°' ? '°' : ' ' + S.pr.ed.u)} />
        <${C.Group}>
          <${C.Btn} action=${true} onClick=${pusk}>${ui.run ? 'Пауза' : 'Пуск'}<//>
          <${C.Btn} onClick=${sbros}>Сброс<//>
        <//>
      </div>
      <canvas class="stage" ref=${ref}></canvas>
      <${C.Status} html=${slova()} />
    </div>`;
}

C.mount(OdnaYama);
</script>
</body>
</html>
