<script>
'use strict';
var C = window.DemoCore, html = C.html;
var useRef = React.useRef, useState = React.useState;

/* ══════════════════ физика ══════════════════

   Блок главы zakon-sohraneniya-energii и врезка «Граница строгости». Опыт
   всех троих лекторов МФТИ: груз на нити, намотанной на шкив генератора,
   опускается и крутит генератор, генератор нагружен лампочкой. Механическая
   энергия груза убывает, и демка ищет, куда она делась: каждая статья
   считается отдельно, потом статьи складываются и сверяются с убылью.

   УРАВНЕНИЕ. Нить нерастяжима и невесома, поэтому скорость груза v и
   угловая скорость шкива ω связаны радиусом шкива: v = ωρ. Генератор с
   постоянным магнитом: ЭДС пропорциональна угловой скорости, ε = kω. Ток в
   цепи из обмотки r и лампочки R есть I = ε/(R + r), и тот же ток тормозит
   ротор моментом kI. Постоянная k в обоих местах одна: с разными генератор
   брал бы энергию ниоткуда или терял бы её без следа. Груз:
   m·dv/dt = mg − T. Ротор со шкивом: J·dω/dt = Tρ − kI. Натяжение T
   исключается, и остаётся

       (m + J/ρ²)·dv/dt = mg − k²v/(ρ²(R + r)).

   Разомкнутая цепь: тока нет, тормоза нет, груз и ротор разгоняются вместе с
   ускорением mg/(m + J/ρ²) = 8,92 м/с². Короткое замыкание: R = 0, весь ток
   идёт через обмотку, лампочка вне цепи.

   Правая часть обращается в ноль при установившейся скорости
   v* = mgρ²(R + r)/k², и к ней скорость подходит экспонентой со временем
   τ = (m + J/ρ²)ρ²(R + r)/k². В установившемся режиме ток I* = mgρ/k от
   лампочки не зависит: момент kI обязан уравновесить момент груза mgρ.
   Поэтому мощность обмотки I*²r при любой лампочке одна, 3,85 Вт, а
   мощность лампочки I*²R растёт вместе с R, пока груз успевает выйти на
   установившуюся скорость.

   ЧТО СЧИТАЕТСЯ. Рунге–Кутта четвёртого порядка по четвёрке «путь вниз y,
   скорость v, тепло в лампочке, тепло в обмотке» с шагом 1/1200 с. Тепло
   набирается интегралами ∫I²R dt и ∫I²r dt по тем же шагам, из тока, а не
   из баланса. Убыль потенциальной энергии mgy берётся из пройденного пути,
   кинетическая груза mv²/2 и ротора Jω²/2 из скорости. Четыре статьи
   считаются порознь, их сумма сверяется с убылью, и расхождение лежит в
   __demoState.balanceError в долях от mgh. В схему баланс не заложен: он
   выходит, только если тормозящий момент kI в механике и мощность εI в цепи
   описывают одно и то же. Касание пола ловится точно: шаг, на котором путь
   перевалил бы за 1,5 м, переигрывается укороченным, и его длина ищется
   Ньютоном по пути. Рядом считается точное решение, v = v*(1 − e^(−t/τ)),
   при разомкнутой цепи v = at; расхождение счёта с ним тоже в __demoState.

   ЧИСЛА. Из брифа: m = 2 кг, h = 1,5 м, g = 9,81 м/с², радиус шкива 0,05 м;
   убыль за весь спуск mgh = 29,43 Дж. Подобраны: k = 1 В·с/рад (он же
   Н·м/А), r = 4 Ом, J = 5·10⁻⁴ кг·м², то есть J/ρ² = 0,2 кг, десятая часть
   груза; ряд R по ряду E6 от 1 до 100 Ом и два края ползунка. Условие брифа:
   при средних R груз выходит на установившуюся скорость на первой половине
   спуска. Выход считается по порогу: скорость отстаёт от установившейся
   меньше чем на процент. От короткого замыкания до 22 Ом так и есть: при
   10 Ом (середина ползунка) v* = 0,687 м/с, τ = 0,077 с, выход на 0,19 м
   пути, спуск 2,26 с; при 22 Ом выход на 0,66 м из 0,75. При 33 Ом выход
   уходит во вторую половину спуска (1,34 м), с 47 Ом груз до пола на
   установившуюся не выходит. Короткое замыкание: v* = 0,196 м/с, спуск
   7,67 с, всё тепло в обмотке. Разомкнутая цепь: пол через 0,58 с на
   5,17 м/с, в движении груза 26,75 Дж и ротора 2,68 Дж. Ток в
   установившемся режиме 0,98 А; лампочка 10 Ом получает 9,6 Вт. Больше
   всего энергии лампочке достаётся при 22 Ом, 80 % убыли, ярче всего она
   вспыхивает у пола при 68 Ом, 48 Вт.

   ЧЕГО ЗДЕСЬ НЕТ. Сопротивление лампочки постоянно: у настоящей холодная
   нить держит в разы меньше, чем раскалённая. Индуктивность обмотки не
   учтена: при миллигенри она даёт время порядка 10⁻⁴ с против τ от 0,02 с.
   Трения в подшипниках нет, иначе у тепла была бы пятая статья. Опыт
   кончается касанием пола; удар о пол и выбег ротора после него демка не
   считает, и кинетическая энергия остаётся последней статьёй. */

/* ── чистая физика ──────────────────────────────────────────────
   Отсюда и до пометки «конец чистой физики» код не знает о браузере и
   целиком копируется в node для прогона без глаз; так снята таблица
   «ожидали / получили» в отчёте сборки. */

var M = 2;                 /* кг, груз: число брифа */
var H0 = 1.5;              /* м, высота спуска: число брифа */
var G = 9.81;              /* м/с² */
var RHO = 0.05;            /* м, радиус шкива: число брифа */
var K_G = 1;               /* В·с/рад, он же Н·м/А: постоянная генератора, подобрана */
var R_OB = 4;              /* Ом, обмотка, подобрана */
var J_ROT = 5e-4;          /* кг·м², ротор со шкивом, подобран: J/ρ² = 0,2 кг */
var M_PR = M + J_ROT / (RHO * RHO);   /* кг, 2,2: груз и ротор, приведённые к нити */
var E_POLN = M * G * H0;   /* Дж, 29,43: убыль потенциальной энергии за весь спуск */
var H = 1 / 1200;          /* с, шаг схемы: у короткого замыкания τ = 0,022 с, это 26 шагов */
var POROG = 0.01;          /* вышел на установившуюся: отстаёт от неё меньше чем на процент */

/* Положения ползунка: край «короткое замыкание», ряд E6 от 1 до 100 Ом и
   край «цепь разомкнута», у которого сопротивление бесконечно. */
var RYAD = [0, 1, 1.5, 2.2, 3.3, 4.7, 6.8, 10, 15, 22, 33, 47, 68, 100, Infinity];
var R_NACH = 7;            /* 10 Ом, середина ряда */

function razomknuta(R) { return R === Infinity; }

/* Коэффициент торможения k²/(ρ²(R + r)), кг/с: тормозящая сила, приведённая
   к нити, есть его произведение на скорость. */
function tormoz(R) { return razomknuta(R) ? 0 : K_G * K_G / (RHO * RHO * (R + R_OB)); }

/* Ток: ЭДС kω на полное сопротивление цепи, ω = v/ρ. */
function tok(R, v) { return razomknuta(R) ? 0 : K_G * v / RHO / (R + R_OB); }

/* Установившаяся скорость mgρ²(R + r)/k² и время подхода к ней; у
   разомкнутой цепи их нет. */
function vUst(R) { return razomknuta(R) ? null : M * G * RHO * RHO * (R + R_OB) / (K_G * K_G); }
function tauUst(R) { return razomknuta(R) ? null : M_PR / tormoz(R); }

/* Правая часть: производные пути, скорости и двух теплот. Все четыре
   зависят только от скорости, и пробы Рунге–Кутты берутся по ней. У
   разомкнутой цепи ток ноль, и 0·∞ в лампочке получиться не должно. */
function proizv(R, v) {
  var I = tok(R, v);
  return [v,
          (M * G - tormoz(R) * v) / M_PR,
          razomknuta(R) ? 0 : I * I * R,      /* мощность в лампочке, Вт */
          I * I * R_OB];                       /* мощность в обмотке, Вт */
}

function shagRK(R, s, h) {
  var k1 = proizv(R, s[1]);
  var k2 = proizv(R, s[1] + h / 2 * k1[1]);
  var k3 = proizv(R, s[1] + h / 2 * k2[1]);
  var k4 = proizv(R, s[1] + h * k3[1]);
  var o = [];
  for (var i = 0; i < 4; i++) o.push(s[i] + h / 6 * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]));
  return o;
}

/* Модель: сопротивление, время, четвёрка [путь вниз, скорость, тепло в
   лампочке, тепло в обмотке], флаг «у пола», место выхода на
   установившуюся скорость и след для графика, пары [путь, скорость]. */
function sozdat(R) {
  return { R: R, t: 0, s: [0, 0, 0, 0], pol: false, yVyshel: null, tVyshel: null,
           sled: [[0, 0]] };
}

/* Продвинуть модель на dt. Шаг не длиннее H. Тот шаг, на котором путь
   перевалил бы за h, переигрывается укороченным, и его длина f ищется
   Ньютоном по пути, dy/df = v: первая прикидка линейная, четырёх итераций
   хватает до последнего знака. След пишется, когда груз сдвинулся на 3 мм
   или скорость изменилась на 5 мм/с: так кривая одинаково гладкая и в
   кадре, и при прогоне крупными шагами. */
function prodvinut(m, dt) {
  if (m.pol || !(dt > 0)) return;
  var n = Math.ceil(dt / H - 1e-9), h = dt / n, vu = vUst(m.R);
  for (var i = 0; i < n && !m.pol; i++) {
    var s1 = shagRK(m.R, m.s, h);
    if (s1[0] >= H0) {
      var f = h * (H0 - m.s[0]) / (s1[0] - m.s[0]);
      for (var k = 0; k < 4; k++) { var q = shagRK(m.R, m.s, f); f -= (q[0] - H0) / q[1]; }
      m.s = shagRK(m.R, m.s, f); m.t += f; m.pol = true;
    } else { m.s = s1; m.t += h; }
    if (m.yVyshel === null && vu !== null && m.s[1] >= (1 - POROG) * vu) {
      m.yVyshel = m.s[0]; m.tVyshel = m.t;
    }
    var last = m.sled[m.sled.length - 1];
    if (m.pol || m.s[0] - last[0] >= 0.003 || Math.abs(m.s[1] - last[1]) >= 0.005)
      m.sled.push([m.s[0], m.s[1]]);
  }
}

/* Точное решение того же уравнения из покоя: к нему обязан сойтись счёт. */
function tochno(R, t) {
  if (razomknuta(R)) return M * G / M_PR * t;
  return vUst(R) * (1 - Math.exp(-t / tauUst(R)));
}

/* Показания: всё, что демка утверждает, в единицах СИ. Пишутся в
   переданный объект на месте: автопроверка держит ссылку на него. */
function pokazaniya(m, p) {
  var R = m.R, y = m.s[0], v = m.s[1], I = tok(R, v), om = v / RHO;
  p.R = R;                                  /* Ом; 0 у замыкания, Infinity у разомкнутой */
  p.circuit = R === 0 ? 'short' : razomknuta(R) ? 'open' : 'lamp';
  p.t = m.t;
  p.y = y;                                  /* м, путь вниз от старта */
  p.height = H0 - y;                        /* м, низ груза над полом */
  p.v = v;                                  /* м/с, вниз */
  p.omega = om;                             /* рад/с, шкив */
  p.vTerminal = vUst(R);                    /* м/с, по формуле; у разомкнутой null */
  p.tau = tauUst(R);
  p.current = I;                            /* А */
  p.powerLamp = razomknuta(R) ? 0 : I * I * R;
  p.powerWinding = I * I * R_OB;
  p.lostPotential = M * G * y;
  p.kineticLoad = M * v * v / 2;
  p.kineticRotor = J_ROT * om * om / 2;
  p.kinetic = p.kineticLoad + p.kineticRotor;
  p.heatLamp = m.s[2];                      /* ∫I²R dt */
  p.heatWinding = m.s[3];                   /* ∫I²r dt */
  p.sum = p.kinetic + p.heatLamp + p.heatWinding;
  p.balanceError = (p.sum - p.lostPotential) / E_POLN;   /* доля от mgh, со знаком */
  p.vExact = tochno(R, m.t);
  p.exactError = v - p.vExact;              /* м/с, счёт против точного решения */
  p.yReached = m.yVyshel;                   /* м пути до выхода на установившуюся */
  p.tReached = m.tVyshel;
  p.done = m.pol;
  p.tDescent = m.pol ? m.t : null;
  return p;
}

/* Прогон без экрана до пола; возвращает итоговые показания. Им считается
   сводка по положениям ползунка, его же зовёт __demoProgon. */
function progon(R, dt) {
  var m = sozdat(R), h = dt || 1 / 60, n = 0;
  while (!m.pol && n++ < 1e6) prodvinut(m, h);
  return pokazaniya(m, {});
}
/* ── конец чистой физики ── */

/* Сводка по всем положениям ползунка, один раз при загрузке. Скорость у
   пола задаёт шкалу графика, наибольшая мощность лампочки задаёт полный
   накал рисунка. Из покоя скорость только растёт, поэтому пик мощности у
   каждого R приходится на касание пола. */
var SVODKA = RYAD.map(function (R) { return progon(R, 0.05); });
var P_MAX = Math.max.apply(null, SVODKA.map(function (s) { return s.powerLamp; }));

/* ══════════════════ сцена ══════════════════

   Слева установка: генератор под потолком, шкив со спицами, нить и груз,
   лампочка на проводах. Справа от груза график скорости, у которого высота
   идёт вниз в том же масштабе, что путь груза: конец кривой всегда на
   одной высоте с грузом, и видно, на какой высоте скорость перестала расти.
   Левая ось графика служит линейкой высоты. Скорость по горизонтали, шкала
   своя у каждого R, чтобы установившаяся стояла на двух третях ширины.

   Справа два столбика: убыль потенциальной энергии и четыре статьи, куда
   она ушла. Масштаб столбиков выбран так, что убыль за весь спуск занимает
   ровно высоту спуска на рисунке, и синий столбик растёт на столько же
   пикселей, на сколько опустился груз (синяя полоса у пути груза того же
   цвета). Цвета статей повторяются на установке: груз бирюзовый, спицы
   ротора фиолетовые, лампочка светит янтарём, корпус генератора краснеет
   по накопленному теплу обмотки.

   Яркость лампочки идёт по мощности I²R: альфа свечения растёт как корень
   из доли мощности, полный накал равен самой яркой вспышке на ползунке
   (68 Ом у пола). Линейная шкала погасила бы средние положения до
   неразличимости. */

var W = 1000, HGT = 460;
var PX = 150, PY = 66;                 /* ось генератора и шкива */
var R_KORP = 30, R_SHK = 20;           /* px, корпус и шкив: не в масштабе */
var NX = PX + R_SHK;                   /* нить сходит со шкива справа */
var GRUZ_W = 44, GRUZ_H = 36;          /* px, груз */
var Y0 = 140, Y_POL = 420;             /* низ груза на старте и пол */
var SCY = (Y_POL - Y0) / H0;           /* px на метр по вертикали, 186,7 */
var SCE = (Y_POL - Y0) / E_POLN;       /* px на джоуль: mgh во всю высоту спуска */
var Y_POLOV = Y0 + H0 / 2 * SCY;       /* половина спуска */
var GX0 = 262, GX1 = 560;              /* поле графика скорости */
var KX = [594, 648], KW = 44;          /* столбики: убыль и четыре статьи */
var LX = 712, LXR = 990;               /* легенда: левый край и правый край чисел */
var LY = [172, 212, 244, 276, 308];    /* строки легенды: убыль отдельно, статьи вместе */
var LAMPA = { x: 52, y: 72 };          /* центр колбы */
var MONO = '"JetBrains Mono", ui-monospace, monospace';
var TAU2 = 6.2832;

/* Цвета данных от темы не зависят. Синий у убыли высоты тот же, что у веса
   в «ракете»; бирюза скорости из рисунков главы у груза; фиолетовый у
   ротора; янтарь у лампочки; красная охра у нагрева обмотки. */
var C_POT = '122,166,255';
var C_GRUZ = '77,182,198';
var C_ROT = '167,139,250';
var C_LAMP = '245,180,50';
var C_OBM = '224,108,82';

/* Русская запятая и настоящий минус; остатки счёта в последних знаках
   печатались бы как «−0,00», а ноль есть ноль. */
function num(v, d) {
  if (Math.abs(v) < 0.5 * Math.pow(10, -d)) v = 0;
  return v.toFixed(d).replace('.', ',').replace('-', '−');
}
function omy(R) { return num(R, R % 1 ? 1 : 0) + ' Ом'; }

/* Подпись ползунка добита неразрывными пробелами до длины самой длинной:
   значение моноширинное, и рейка не прыгает, пока ручку ведут по ряду. */
function podpisPolzunka(R) {
  var s = R === 0 ? 'короткое замыкание' : razomknuta(R) ? 'цепь разомкнута' : 'лампочка ' + omy(R);
  while (s.length < 18) s += ' ';
  return s;
}

/* Ближайший круглый шаг оси: 1, 2, 5 на степень десяти. */
function krasivo(x) {
  var p = Math.pow(10, Math.floor(Math.log10(x))), r = x / p;
  return (r < 1.5 ? 1 : r < 3.5 ? 2 : r < 7.5 ? 5 : 10) * p;
}

/* Шкала скорости для положения ползунка: наибольшая из скорости у пола и
   установившейся, с запасом в 1,4 раза, чтобы справа от пунктира
   установившейся влезла её подпись. */
function osSkorosti(i) {
  var s = SVODKA[i], top = 1.4 * Math.max(s.v, s.vTerminal || 0), d = krasivo(top / 4);
  return { d: d, max: Math.ceil(top / d - 1e-9) * d };
}

/* Положение ползунка, ближайшее к заданному сопротивлению. */
function blizhajshij(R) {
  var best = 0, bd = Infinity;
  RYAD.forEach(function (x, i) {

/* Показания живут в одном объекте весь сеанс и правятся на месте:

var POKAZ = {};

function GruzGenerator() {

    POKAZ.lampBrightness = 0; POKAZ.pMax = P_MAX;

     ustanov — вышла на установившуюся; svobodno — цепь разомкнута и груз
     падает; pauza; pol — груз коснулся пола, опыт кончился. */
  function faza() {
    var m = S.m;

  function sync() { setUi({ i: S.i, run: S.run, faza: S.fazaUi }); }

     положение (0 — замыкание, Infinity — разомкнутая цепь) и пускает груз
     с верха; дальше его двигает __demoTick. __demoProgon(R) гонит модель
     до пола без экрана при любом R и отдаёт итоговые показания. */

  window.__demoProgon = function (R, dt) { return progon(R == null ? RYAD[S.i] : R, dt); };
  window.__demoModel = { sozdat: sozdat, prodvinut: prodvinut, pokazaniya: pokazaniya,
                         progon: progon, tochno: tochno, vUst: vUst, tauUst: tauUst, tok: tok,
                         RYAD: RYAD, SVODKA: SVODKA, P_MAX: P_MAX, H: H, M_PR: M_PR,
                         E_POLN: E_POLN };

  /* «Пуск» отпускает груз, на ходу ставит паузу, после пола повторяет опыт
     с верха. «Сброс» ставит груз на старт и ждёт «Пуска». */
  function pusk() {
    if (S.m.pol) { S.run = true; sobrat(S); }
    else S.run = !S.run;
    otmetit(); sync();
  }
  function sbros() { S.run = false; sobrat(S); otmetit(); sync(); }
  /* Ползунок начинает опыт заново: кривая с изломом посередине читалась бы
     как две кривые, а шкала графика у каждого R своя. */
  function vybrat(v) { S.i = C.clamp(Math.round(v), 0, RYAD.length - 1); sbros(); }

  /* Строка показаний пересказывает кадр словами; числа в ней те же, что
     на сцене. Коротко: в витрине строке отведено две-три строки. */
  function slova() {
    var A = function (s) { return '<span class="accent">' + s + '</span>'; };
    var m = S.m, R = m.R, p = POKAZ, f = S.fazaUi;
    var otkr = razomknuta(R), kz = R === 0;
    var Is = num(M * G * RHO / K_G, 2) + ' А';
    if (f === 'start') {
      var nach = 'Груз 2 кг висит на нити, намотанной на шкив генератора, в 1,5 м над ' +
        'полом; запас его потенциальной энергии ' + A(num(E_POLN, 2) + ' Дж') + '. ';
      if (otkr) return nach + 'Цепь разомкнута, тока не будет, и генератор груз не ' +
        'тормозит. «Пуск» отпускает груз.';
      if (kz) return nach + 'Выводы генератора замкнуты накоротко, лампочка вне цепи. ' +
        '«Пуск» отпускает груз.';
      return nach + 'Генератор нагружен лампочкой ' + A(omy(R)) + '. «Пуск» отпускает груз.';
    }
    if (f === 'pauza')
      return 'Пауза: груз прошёл ' + A(num(p.y, 2) + ' м') + ' из 1,5, лампочка получила ' +
        num(p.heatLamp, 2) + ' Дж, обмотка ' + num(p.heatWinding, 2) + ' Дж.';
    if (f === 'svobodno')
      return 'Тока нет, генератор не тормозит, и груз падает почти свободно: с ускорением ' +
        A('8,92 м/с²') + ' вместо 9,81, потому что вместе с ним разгоняется ротор. Вся ' +
        'убыль потенциальной энергии уходит в кинетическую.';
    if (f === 'razgon')
      return 'Груз разгоняется. Чем быстрее он идёт, тем больше ЭДС и ток и тем сильнее ток ' +
        'тормозит шкив.';
    if (f === 'ustanov') {
      if (kz)
        return 'Груз идёт ровно, ' + A(num(p.vTerminal, 3) + ' м/с') + ', медленнее, чем с ' +
          'любой лампочкой: всё сопротивление цепи в обмотке, 4 Ом. Ток ' + Is + ', и вся ' +
          'убыль потенциальной энергии уходит в нагрев обмотки.';
      return 'Груз идёт ровно, ' + A(num(p.vTerminal, 3) + ' м/с') + ': тормозящий момент ' +
        'тока уравновесил тяжесть, и ток ' + Is + ' от лампочки не зависит. Кинетическая ' +
        'энергия больше не растёт, вся убыль потенциальной уходит в тепло лампочки и ' +
        'обмотки, в отношении их сопротивлений ' + num(R, R % 1 ? 1 : 0) + ' к 4.';
    }
    /* груз у пола */
    var za = 'Груз у пола через ' + A(num(p.t, 2) + ' с');
    var itog = 'вместе ' + num(p.sum, 2) + ' Дж, убыль найдена целиком, расхождение ' +
      num(Math.abs(p.balanceError) * 100, 4) + ' %.';
    if (otkr)
      return za + ' на скорости ' + num(p.v, 2) + ' м/с. Тока не было, тепла нет: ' +
        A(num(p.kineticLoad, 2) + ' Дж') + ' в движении груза, ' +
        A(num(p.kineticRotor, 2) + ' Дж') + ' во вращении ротора; ' + itog;
    if (kz)
      return za + ', самый медленный спуск. Лампочка вне цепи: ' +
        A(num(p.heatWinding, 2) + ' Дж') + ' ушли в нагрев обмотки, ' +
        num(p.kinetic, 2) + ' Дж осталось в движении; ' + itog;
    var vyh = p.yReached !== null
      ? ', на установившуюся скорость вышел за первые ' + num(p.yReached, 2) + ' м пути'
      : ' и до установившейся скорости не дошёл: ' + num(p.v, 2) + ' м/с против ' +
        num(p.vTerminal, 2);
    return za + vyh + '. Лампочке досталось ' + A(num(p.heatLamp, 2) + ' Дж') +
      ', обмотке ' + A(num(p.heatWinding, 2) + ' Дж') + ', движению груза и ротора ' +
      A(num(p.kinetic, 2) + ' Дж') + '; ' + itog;
  }

  return html`
    <div class="demo">
      <div class="controls">
        <${C.Group}>
          <${C.Btn} action=${true} onClick=${pusk}>${ui.run ? 'Пауза' : 'Пуск'}<//>
          <${C.Btn} onClick=${sbros}>Сброс<//>
        <//>
        <${C.Slider} label="Нагрузка:" min=${0} max=${RYAD.length - 1} step=${1}
                     value=${ui.i} onChange=${vybrat}
                     display=${podpisPolzunka(RYAD[ui.i])} />
      </div>
      <canvas class="stage" ref=${ref}></canvas>
      <${C.Status} html=${slova()} />
    </div>`;
}

C.mount(GruzGenerator);
</script>
</body>
</html>
